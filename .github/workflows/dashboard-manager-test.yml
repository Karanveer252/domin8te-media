name: Dashboard Manager test (isolated Supabase project)

on:
  workflow_dispatch:
  schedule:
    # Nightly. This workflow is intentionally restricted to the isolated test project.
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  test-dashboard-manager:
    name: Run isolated Dashboard Manager checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Hard boundary: never let this workflow target the original production project.
      EXPECTED_TEST_BASE_URL: https://leuvzsouqsdpdpyjspjr.supabase.co
      DASHBOARD_TEST_PROJECT_URL: ${{ secrets.DASHBOARD_TEST_PROJECT_URL }}
      DASHBOARD_MANAGER_CRON_SECRET: ${{ secrets.DASHBOARD_MANAGER_CRON_SECRET }}
    steps:
      - name: Verify isolated test target and required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_TEST_PROJECT_URL"
          test -n "$DASHBOARD_MANAGER_CRON_SECRET"
          test "$DASHBOARD_TEST_PROJECT_URL" = "$EXPECTED_TEST_BASE_URL"

      - name: Run test-only Edge Function
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "x-dashboard-manager-secret: $DASHBOARD_MANAGER_CRON_SECRET" \
            --data '{}' \
            "$DASHBOARD_TEST_PROJECT_URL/functions/v1/dashboard-manager-test-runner")"
          {
            echo 'json<<EOF'
            printf '%s\n' "$response"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Assert the complete expected check set
        shell: bash
        env:
          RUNNER_JSON: ${{ steps.runner.outputs.json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          expected = [
              "invalid-result-rejected",
              "work-event-processed",
              "projection-verified",
              "dashboard-item-recovery",
              "billing-event-processed",
              "invoice-recovery",
              "invalid-event-opened-exception",
          ]
          payload = json.loads(os.environ["RUNNER_JSON"])
          if payload != {"ok": True, "checks": expected}:
              raise SystemExit("Dashboard Manager test runner returned an unexpected result")
          print("PASS: all seven isolated Dashboard Manager checks succeeded")
          PY
