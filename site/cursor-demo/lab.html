<!-- The growth cursor's click, frozen refresh by refresh (2026-10-07, for the gauntlet loop on the cursor).
     Open as /cursor-demo/lab.html?cursorlab . Local only: the packer never ships cursor-demo/.
     Each cell is what the screen shows on one refresh, enlarged 4x on the site's sand:
       green: the idle cursor as Windows draws it (linear-light blend), no copy on screen;
       white: the click copy alone (the real cursor is gone);
       violet: the real cursor, not yet gone, over the copy (whole, or held back to its core);
       amber: the hand-over (idle cursor under the dissolving copy);
       red label: a refresh that shows something the idle cursor does not (blink, missing shadow, motion
       under the real cursor).
     (2026-10-07, round 2) The strip is now a simulation of the screen itself, not of the copy's clock: Chrome
     shows a frame m refreshes after it is drawn (&m=1|2|3, default 2), Windows hides its cursor on the refresh
     after cursor:none takes (&hand=ms after it is let go, default 22), and the click lands &phase ms before the
     first frame (default half a frame). &est=default plays the first click, before the script has measured m.
     ?fps=60|120|144 sets the refresh rate (default 60); ?zoom=N the enlargement; ?ground=card shows white.
     (2026-10-07, round 3) est=default is now the script's own prior; the summary also plays each case on round
     2's clock ('-r2'), checks the no-report lateness bound, sweeps a middle shadow cover, plays further presses
     during the pulse, and measures moving clicks against the last mouse report (where Windows draws).
     (2026-10-07, pulse builder, round 2) &pulse=1 rows now also print oL / oC / oY (mean OKLab lightness and
     colourfulness, and mean luma, over the pixels colourful at rest, a set that does not change with the frame)
     and mv (how far the picture's farthest corner moved since the refresh before, in screen px). The demo row
     is made one frame at a time (#pulse data-demo says how many came out right). &script=/path.js plays a
     saved copy of the script instead, for before/after numbers.
     (2026-10-07, click -> idle builder, round 1) The way back is measured now: hand-over refreshes are composited
     as the screen does it (the copy, then the real cursor ON TOP in linear light) and costed against idle like
     every other refresh (they were given 0); the strip shows that composite; simulate() lets the real cursor go
     and gives it back as the script's own timetable does (plan().off / plan().hide, or the old dissolve when
     &script= plays a build that has one); each simulated-clicks row has a 'way back' line; new sections for the
     moving hand-over (a copy beside the returned real cursor) and a click during the way back. &drive=1 plays
     whole clicks through the script's real frame loop on a fake clock (&debug=1 prints the raw times).
     (2026-10-07, click -> idle builder, round 3) &drive=1 rows now hand the script the click's own Event Timing report
     for the screen's true lateness (as Chrome would), with 'unmeasured + this click's report' and 'nothing measured at
     all' rows; &critic=1 adds 'MOVE AFTER GIVE-BACK' (still mouse through the letting go, then a pointerrawupdate dt ms
     after it, rAF-aligned pointermoves after that, the real cursor modelled from cursor:none at each hit test and at
     Chrome's timer). The groundAt check pins the test grounds into view (a hidden pane is 0 x 0: set a viewport size)
     and adds a WebGL film ground. -->

      report.push('no report, ' + c[0] + 'Hz, first frame ' + c[1] + 'ms after the click: m <= ' + r.m + ', hist ' + JSON.stringify(r.hist) + (c[0] > 100 ? (r.hist.length ? ' PASS (not empty)' : ' FAIL (empty)') : (r.m ? ' FAIL (60Hz must pass over it)' : ' PASS (passed over)')));
    });
    report.push('prior before any measurement: 60Hz ' + JSON.stringify(L.prior(1000 / 60)) + ' | 144Hz ' + JSON.stringify(L.prior(1000 / 144)));
    /* (round 3) the critic's middle cover for the one refresh that may show over the real cursor or alone */
    H('cover sweep @1.5x sand, one refresh that may be either: real over cover c / copy alone at cover c');
    report.push([0, .25, .4, .5, .6, .75, 1].map(function (c) { var a = diff(scene(d, gs, cover(c), true), idl).max, b = diff(scene(d, gs, cover(c), false), idl).max; return 'c ' + c + ': ' + a + ' / ' + b + ' (worst ' + Math.max(a, b) + ')' }).join(' | '));
    /* (2026-10-07, click -> idle builder, round 2) the shadow alone at cover c, the rim whole (the critic's
       suggestion for a refresh that may be either), and both at c: max levels and px at 12+, with the real
       cursor over it / alone */
    H('cover sweep @1.5x sand: shadow (under) at c, rim whole | both at c; real over it / copy alone (max, 12+ px)');
    [.3, .45, .6, .7, .8, .85, .9, .95, 1].forEach(function (c) {
      var u1 = diff(scene(d, gs, { under: c, core: 1, rim: 1 }, true), idl), u0 = diff(scene(d, gs, { under: c, core: 1, rim: 1 }, false), idl);
      var b1 = diff(scene(d, gs, cover(c), true), idl), b0 = diff(scene(d, gs, cover(c), false), idl);
      report.push('c ' + c + ': under only ' + u1.max + '/' + u1.big + ' | ' + u0.max + '/' + u0.big + ' ; under+rim ' + b1.max + '/' + b1.big + ' | ' + b0.max + '/' + b0.big);
    });
    /* (round 3) presses while the pulse plays: the copy's scale y refresh by refresh at 60Hz with further
       presses, against the plain pulse; the biggest change from one refresh to the next, and when it ends */
    H('round 3: further presses during the pulse (60Hz refreshes, clock ms)');
    [[], [61 - 8.3], [250], [480], [61, 122, 183]].forEach(function (ks) {
      L.kicks(ks); var f = 1000 / 60, prev = null, maxStep = 0, minSy = 9, dip = 0, e = L.end(), trs = [];
      for (var t = f / 2; t < e + f; t += f) {
        var bx = L.look(t), tr = bx.querySelector('.v3cur__mark').style.transform, m2 = /scale\(([\d.]+),\s*([\d.]+)\)/.exec(tr), sy = m2 ? +m2[2] : 1;
        var base = L.CURVE(Math.min(MS, t) / L.BASE_MS, 2); dip = Math.max(dip, base - sy);
        if (prev != null) maxStep = Math.max(maxStep, Math.abs(sy - prev)); prev = sy; minSy = Math.min(minSy, sy);
      }
      var lastT = L.look(e - .01).querySelector('.v3cur__mark').style.transform, atEnd = L.look(e).querySelector('.v3cur__mark').style.transform;
      report.push('presses at ' + (ks.length ? ks.map(function (k) { return k.toFixed(0) }).join(',') : 'none') + 'ms: extra squash up to ' + dip.toFixed(4) + ', biggest refresh step in scale y ' + maxStep.toFixed(4) + ', hand-over at ' + e.toFixed(0) + 'ms (pose just before: ' + (lastT || 'rest') + ', at: ' + (atEnd || 'rest') + ')');
    });
    L.kicks([]); L.look(0);
    var firstMove = rows.filter(function (r) { return r[3] !== '-' && r[1].indexOf('pulse') === 0 })[0];
    report.push('strip: first refresh with a transform: ' + (firstMove ? firstMove[0] + ' ms (' + firstMove[2] + 'ms in) ' + firstMove[3] : 'none') + '; script measured: ' + JSON.stringify(L.lag()));
    var C = L.CURVE; report.push('press: scale y at 6.9/16.7/33.3ms ' + [6.9, 16.7, 33.3].map(function (t) { return C(t / L.BASE_MS, 2).toFixed(4) }).join(' ') + ', lowest ' + (function () { var mn = 9; for (var u = 0; u < .3; u += .0005) mn = Math.min(mn, C(u, 2)); return mn.toFixed(4) })());
    me.innerHTML = report.map(function (r) { return '<p>' + r + '</p>' }).join('');
    me.setAttribute('data-swap', report.join('\n').replace(/<\/?b>/g, ''));
  } catch (e) { me.setAttribute('data-swap', 'error ' + e + ' ' + e.stack); me.textContent = 'error ' + e }
  document.getElementById('tbl').innerHTML = '<tr><th>refresh ms</th><th>stage</th><th>copy ms</th><th>transform</th><th>opacity</th><th>shadow/rim cover</th><th>sticker filter</th><th>vs idle</th></tr>' +
    rows.map(function (r) { return '<tr><td>' + r.join('</td><td>') + '</td></tr>' }).join('');
  window.__labReady = true;
})();
