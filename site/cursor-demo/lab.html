<!doctype html>

<title>Cursor lab</title>
<!-- The growth cursor's click, frozen refresh by refresh (2026-10-07, for the gauntlet loop on the cursor).
     Open as /cursor-demo/lab.html?cursorlab . Local only: the packer never ships cursor-demo/.
     Each cell is what the screen shows on one refresh, enlarged 4x on the site's sand:
       green: the idle cursor as Windows draws it (linear-light blend), no copy on screen;
       white: the click copy alone (the real cursor is gone);
       violet: the real cursor, not yet gone, over the copy (whole, or held back to its core);
       amber: the hand-over (idle cursor under the dissolving copy);
       red label: a refresh that shows something the idle cursor does not (blink, missing shadow, motion
       under the real cursor).
     (2026-10-07, round 2) The strip is now a simulation of the screen itself, not of the copy's clock: Chrome
     shows a frame m refreshes after it is drawn (&m=1|2|3, default 2), Windows hides its cursor on the refresh
     after cursor:none takes (&hand=ms after it is let go, default 22), and the click lands &phase ms before the
     first frame (default half a frame). &est=default plays the first click, before the script has measured m.
     ?fps=60|120|144 sets the refresh rate (default 60); ?zoom=N the enlargement; ?ground=card shows white.
     (2026-10-07, round 3) est=default is now the script's own prior; the summary also plays each case on round
     2's clock ('-r2'), checks the no-report lateness bound, sweeps a middle shadow cover, plays further presses
     during the pulse, and measures moving clicks against the last mouse report (where Windows draws). -->
<!-- the pulse's own styles (.v3cur, .v3cur__mark, the sparkles), as on the site -->
<link rel="stylesheet" href="/assets/v3.css">
<style>
  :root{--sand:#ECE6DD}
  body{margin:0;padding:20px;background:#fff;font:13px/1.4 system-ui,sans-serif;color:#0E1420}
  h1{font-size:16px;margin:0 0 6px}
  h2{font-size:14px;margin:18px 0 6px}
  .note{color:#566074;margin:0 0 14px;max-width:900px}
  #strip{display:flex;flex-wrap:wrap;gap:8px}
  .cell{position:relative;width:calc(96px * var(--z));height:calc(96px * var(--z));background:var(--g,var(--sand));border-radius:6px;overflow:hidden;outline:1px solid rgba(14,20,32,.08)}
  .cell .in{position:absolute;left:0;top:0;width:96px;height:96px;transform:scale(var(--z));transform-origin:0 0}
  .cell .idle{position:absolute;left:30px;top:31px;width:32px;height:32px}
  .cell .v3cur{position:absolute!important;left:0!important;top:0!important;transform:none!important;visibility:visible!important}
  .cell b{position:absolute;left:6px;bottom:4px;font:600 11px/1 system-ui;color:#0E1420;background:rgba(255,255,255,.8);padding:3px 5px;border-radius:4px}
  .cell.k-idle b{background:#d9f2df}.cell.k-hand b{background:#fde7c9}.cell.k-over b{background:#e4dcff}.cell.k-bad b{background:#ffb4a8}
  #metrics p{margin:2px 0;font:12px/1.35 ui-monospace,Consolas,monospace}
  table{border-collapse:collapse;margin-top:18px;font:12px/1.3 ui-monospace,Consolas,monospace}
  td,th{padding:3px 8px;border-bottom:1px solid #eee;text-align:left}
  #grounds{position:relative;height:120px;margin-top:18px}
  #grounds>*{position:absolute;top:0;width:110px;height:110px}
</style>

<body>
<h1>Growth cursor: idle → click → idle, refresh by refresh</h1>
<p class="note">Green = idle cursor only. White = the click copy alone. Violet = the real cursor still showing over the copy. Amber = hand-over. Red = a refresh that differs from the idle cursor where it must not. Measurements below.</p>
<div id="strip"></div>
<div id="metrics"></div>
<table id="tbl"></table>
<!-- test grounds for groundAt(): sand, a card on sand, a gradient, a canvas, a picture -->
<div id="grounds">
  <div style="left:0;background:#ECE6DD"></div>
  <div style="left:130px;background:#ECE6DD"><div style="position:absolute;left:0;top:0;width:24px;height:110px;background:#FBF9F5"></div></div>
  <div style="left:260px;background:linear-gradient(#96BEE6,#ECE6DD)"></div>
  <div style="left:390px;background:#ECE6DD"><canvas width="40" height="40" style="position:absolute;left:20px;top:20px;width:40px;height:40px;pointer-events:none"></canvas></div>
  <div style="left:520px;background:rgba(14,20,32,.5)"></div>
  <img src="/assets/v3-cursor-64.png" alt="" style="left:650px;object-fit:cover;background:#ECE6DD">
</div>
<script>document.querySelector('#grounds canvas').getContext('2d').fillRect(0, 0, 40, 40)</script>
<!-- always the latest script, never a cached one -->

  var strip = document.getElementById('strip'), rows = [];
  simulate(FPS, SM, SEST, SPH, SH, q.get('old') === '1').forEach(function (o) {

    var grounds = [['sand', [236, 230, 221]], ['card', [251, 249, 245]], ['white', [255, 255, 255]], ['ink', [14, 20, 32]]];
    [1.5, 1, 1.25, 2].forEach(function (d) { report.push('@' + d + 'x ' + grounds.map(function (g) { return g[0] + ' ' + diff(scene(d, g[1], WHOLE, false), scene(d, g[1], null, true)).s }).join(' | ')) });

    var lk = [-22, -16, -8, -4, -2, 0, 2, 4, 8].map(function (t) {

    H('simulated clicks: 24 phases x hand 20.5/22/25ms; per refresh vs idle; press = first refresh in motion, after the click');
    [60, 120, 144].forEach(function (fps) {
      [1, 2, 3].forEach(function (m) {
        ['measured', 'measured-r2', 'default', 'default-r2', 'old'].forEach(function (est) {
          var worst = 0, dbl = 0, dblMax = 0, bad = 0, n = 0, press = 0, wtag = '';
          for (var ph = 0; ph < 24; ph++) [20.5, 22, 25].forEach(function (hand) {

          report.push(fps + 'Hz m=' + m + ' ' + (est === 'old' ? 'round 1 ' : 'est ' + est).padEnd(13) + ': worst ' + worst + ' (' + wtag + '), both-shadow refreshes avg ' + (dbl / n).toFixed(2) + ' max ' + dblMax + ', bad refreshes ' + bad + '/' + n + ' clicks, press shows ' + (press / n).toFixed(1) + 'ms after the click');

    });

    /* (round 2) clicking while moving: a mouse reporting at 125 / 1000 Hz in whole screen px, the copy placed

    H('clicking while moving (60Hz, m=2), screen px off where Windows draws the cursor, and its cost over the whole copy');
    function path(kind, t) {               /* screen px along x and y, t in ms */

      if (kind === 'speeding') return [.0009 * t * t * 6, -.0006 * t * t * 6];

    }
    var offs = {};
    function costOff(dx, dy) { var k = dx + ',' + dy; if (!offs[k]) offs[k] = diff(scene(1.5, gs, { under: 1, core: 1, rim: 1, dx: dx, dy: dy }, true), idl); return offs[k] }
    ['slow', 'steady', 'speeding', 'stopping'].forEach(function (kind) {
      [125, 1000].forEach(function (hz) {
        var worstP = 0, worstN = 0, cP = 0, cN = 0, stepX = 0, stepMax = 0, natMax = 0;
        for (var t0 = 100; t0 < 300; t0 += 7) {

    H('other grounds @1.5x: copy alone vs idle');
    [['sky', [150, 190, 230]], ['mid photo', [120, 110, 100]], ['dark photo', [40, 40, 45]], ['ink', [14, 20, 32]], ['white', [255, 255, 255]], ['card', [251, 249, 245]], ['sand', [236, 230, 221]]].forEach(function (g) {
      var id = scene(1.5, g[1], null, true);
      report.push(g[0].padEnd(10) + ' made for sand (round 1) ' + diff(scene(1.5, g[1], { under: 1, core: 1, rim: 1, fitG: [236, 230, 221] }, false), id).s.padEnd(18) + ' | made for this ground (round 2) ' + diff(scene(1.5, g[1], WHOLE, false), id).s);
    });
    [[[251, 249, 245], [236, 230, 221]], [[236, 230, 221], [40, 40, 45]]].forEach(function (e) {
      var mean = [0, 1, 2].map(function (k) { return Math.round((e[0][k] + e[1][k]) / 2) });
      report.push('edge ' + e[0] + ' / ' + e[1] + ': made for the mean, over each side: ' + e.map(function (g) { return diff(scene(1.5, g, { under: 1, core: 1, rim: 1, fitG: mean }, false), scene(1.5, g, null, true)).s }).join(' | ') + '; made for the first: over the second ' + diff(scene(1.5, e[1], { under: 1, core: 1, rim: 1, fitG: e[0] }, false), scene(1.5, e[1], null, true)).s);

    var sy0 = scrollY; document.getElementById('grounds').scrollIntoView();
    var gb = document.getElementById('grounds').getBoundingClientRect(), ga = [10, 140, 270, 400, 530, 650].map(function (x0) { var g = L.groundAt(gb.left + x0 + 10, gb.top + 10); return g ? g.join(',') : 'none' }); scrollTo(0, sy0);
    report.push('groundAt: sand ' + ga[0] + ' | card edge ' + ga[1] + ' | gradient ' + ga[2] + ' | canvas overlay (dark; canvases are passed over, so sand) ' + ga[3] + ' | half ink on white ' + ga[4] + ' | photo ' + ga[5]);

    H('round 3: lateness measurements');
    report.push('measured on this page so far (warm-up, before any click): ' + JSON.stringify(L.lag()));
    [[164, 3], [144, 2], [120, 4], [60, 6], [60, 1]].forEach(function (c) {

    report.push([0, .25, .4, .5, .6, .75, 1].map(function (c) { var a = diff(scene(d, gs, cover(c), true), idl).max, b = diff(scene(d, gs, cover(c), false), idl).max; return 'c ' + c + ': ' + a + ' / ' + b + ' (worst ' + Math.max(a, b) + ')' }).join(' | '));

    H('round 3: further presses during the pulse (60Hz refreshes, clock ms)');
    [[], [61 - 8.3], [250], [480], [61, 122, 183]].forEach(function (ks) {
      L.kicks(ks); var f = 1000 / 60, prev = null, maxStep = 0, minSy = 9, dip = 0, e = L.end(), trs = [];

        var base = L.CURVE(Math.min(1, t / MS), 2); dip = Math.max(dip, base - sy);
        if (prev != null) maxStep = Math.max(maxStep, Math.abs(sy - prev)); prev = sy; minSy = Math.min(minSy, sy);
      }

      report.push('presses at ' + (ks.length ? ks.map(function (k) { return k.toFixed(0) }).join(',') : 'none') + 'ms: extra squash up to ' + dip.toFixed(4) + ', biggest refresh step in scale y ' + maxStep.toFixed(4) + ', hand-over at ' + e.toFixed(0) + 'ms (pose just before: ' + (lastT || 'rest') + ', at: ' + (atEnd || 'rest') + ')');
    });

    report.push('strip: first refresh with a transform: ' + (firstMove ? firstMove[0] + ' ms (' + firstMove[2] + 'ms in) ' + firstMove[3] : 'none') + '; script measured: ' + JSON.stringify(L.lag()));
    var C = L.CURVE; report.push('press: scale y at 6.9/16.7/33.3ms ' + [6.9, 16.7, 33.3].map(function (t) { return C(t / MS, 2).toFixed(4) }).join(' ') + ', lowest ' + (function () { var mn = 9; for (var u = 0; u < .3; u += .0005) mn = Math.min(mn, C(u, 2)); return mn.toFixed(4) })());

    rows.map(function (r) { return '<tr><td>' + r.join('</td><td>') + '</td></tr>' }).join('');

})();
