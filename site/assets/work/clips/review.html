<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Portfolio clips</title>
<style>
:root{--bg:#f7f3ee;--ink:#2a2420;--mute:#7a6f66;--card:#fff;--line:#e6ddd3}
@media (prefers-color-scheme:dark){:root{--bg:#1b1917;--ink:#efe9e3;--mute:#a59a90;--card:#26231f;--line:#3a352f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:32px 16px 64px}
main{max-width:1180px;margin:0 auto}h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:44px 0 14px;padding-top:18px;border-top:1px solid var(--line)}
p.lede{color:var(--mute);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
video{display:block;width:100%;height:auto;background:#000}
figcaption{padding:12px 14px 14px}figcaption b{display:block;font-size:15px}figcaption span{color:var(--mute);font-size:13.5px}
code{font-size:12px;color:var(--mute)}
</style></head><body><main>
<h1>Portfolio clips</h1>
<p class="lede">Recorded 2026-10-07 from the real builds: Freddy’s from steakburger-winnipeg.vercel.app, Lecookie from the copy hosted at /work/lecookie/live/. Each one loops. Review only; nothing on the story pages uses these yet.</p>

<h2>Freddy’s Fanpage</h2>
<div class="grid">
<figure><video src="freddys-tier.mp4" poster="freddys-tier.jpg" autoplay muted loop playsinline></video><figcaption><b>Tier slip prints in</b><span>A fan posts the comment that tips them into Silver; the receipt slip prints down with its tier line. <code>freddys-tier.mp4 · 7s</code></span></figcaption></figure>
<figure><video src="freddys-react.mp4" poster="freddys-react.jpg" autoplay muted loop playsinline></video><figcaption><b>Reactions that stamp</b><span>Four taps, each emoji slams in tilted and settles, the pill turns red. <code>freddys-react.mp4 · 7s</code></span></figcaption></figure>
<figure><video src="freddys-cursor.mp4" poster="freddys-cursor.jpg" autoplay muted loop playsinline></video><figcaption><b>Burger cursor</b><span>Every click pops the top bun and the toppings jump. <code>freddys-cursor.mp4 · 5s</code></span></figcaption></figure>
<figure><video src="freddys-winner.mp4" poster="freddys-winner.jpg" autoplay muted loop playsinline></video><figcaption><b>Winner stamp</b><span>Hover straightens the crown stamp; a click opens that fan’s challenge wins. <code>freddys-winner.mp4 · 5s</code></span></figcaption></figure>
<figure><video src="freddys-fans.mp4" poster="freddys-fans.jpg" autoplay muted loop playsinline></video><figcaption><b>Fan counter + free meal ticket</b><span>The night-board digits roll in on load, above the red ticket with its FREE MEAL stamp. <code>freddys-fans.mp4 · 2.5s</code></span></figcaption></figure>
</div>

<h2>Lecookie</h2>
<div class="grid">
<figure><video src="lecookie-quiz.mp4" poster="lecookie-quiz.jpg" autoplay muted loop playsinline></video><figcaption><b>Design your own cookie</b><span>Shape, icing, topping: the cookie in the box changes with each answer and ends signed JW. <code>lecookie-quiz.mp4 · 12s</code></span></figcaption></figure>
<figure><video src="lecookie-oven.mp4" poster="lecookie-oven.jpg" autoplay muted loop playsinline></video><figcaption><b>Out of the little oven</b><span>“Watch it bake”: the door slides up and the chosen cookie rides out on the belt. <code>lecookie-oven.mp4 · 7s</code></span></figcaption></figure>
<figure><video src="lecookie-rack.mp4" poster="lecookie-rack.jpg" autoplay muted loop playsinline></video><figcaption><b>Belt to cooling rack</b><span>On scroll the cookie hops off the belt, rolls to the rack, settles, and steam draws itself. <code>lecookie-rack.mp4 · 5s</code></span></figcaption></figure>
<figure><video src="lecookie-plate.mp4" poster="lecookie-plate.jpg" autoplay muted loop playsinline></video><figcaption><b>Icing flood + piping</b><span>It rolls onto the plate; the icing floods out from the centre and the decoration is piped round. <code>lecookie-plate.mp4 · 5s</code></span></figcaption></figure>
<figure><video src="lecookie-board.mp4" poster="lecookie-board.jpg" autoplay muted loop playsinline></video><figcaption><b>JW signed on</b><span>Onto the clay board, where the JW monogram is wiped on like piping. <code>lecookie-board.mp4 · 5s</code></span></figcaption></figure>
<figure><video src="lecookie-box.mp4" poster="lecookie-box.jpg" autoplay muted loop playsinline></video><figcaption><b>Boxed and sealed</b><span>Into the box, the lid drops with a bounce and the gold wax seal stamps down. <code>lecookie-box.mp4 · 5s</code></span></figcaption></figure>
<figure><video src="lecookie-cursor.mp4" poster="lecookie-cursor.jpg" autoplay muted loop playsinline></video><figcaption><b>A cursor you can eat</b><span>Clicks take bites, crumbs fall, a fresh cookie pops back. Small on screen; best shown as a detail. <code>lecookie-cursor.mp4 · 9s</code></span></figcaption></figure>
</div>
</main></body></html>
