      const r = reader(m);
      const out = [];
      for (let d = w.from; d <= w.to; d++) out.push({ d: T.isoDay(d), v: r.at(d), p: r.at(d - days) });
      return out;
    }

    const decisions = () => state().decisions || {};

    /** Services in the client's package, with the client's decisions applied. */
    function services() {
      const d = decisions();
      /** @type {Record<string, any>} */
      const out = {};
      for (const id of SERVICE_ORDER) {
        if (!inPackage(id) || !tenant.services[id]) continue;
        out[id] = { id, ...clone(tenant.services[id]), decisions: [], requests: [] };
      }
      for (const [apvId, dec] of Object.entries(d)) {
        const apv = tenant.approvals[apvId];
        if (!apv) continue;
        for (const p of (apv.effects && apv.effects[dec.decision]) || []) {
          const s = out[p.service];
          if (!s) continue;
          for (const k of ['status', 'now', 'next', 'expected']) if (p[k]) s[k] = clone(p[k]);
        }
        for (const s of Object.values(out)) {
          for (const ms of s.milestones) {
            if (ms.needs !== apv.actionId) continue;
            if (dec.decision === 'approved' && ms.onApproved === 'done') {
              ms.state = 'done';
              ms.date = dec.at.slice(0, 10);
            }
            delete ms.needs;
          }
          if (!s.milestones.some((ms) => ms.state === 'current')) {
            const nxt = s.milestones.find((ms) => ms.state === 'next');
            if (nxt) nxt.state = 'current';
          }
        }
        if (out[apv.service]) out[apv.service].decisions.push({ approvalId: apvId, title: apv.title, ...dec });
      }
      for (const r of state().requests || []) if (out[r.service]) out[r.service].requests.push(r);
      return out;
    }

    function rank(a) {
      if (a.priority === 'urgent') return 0;
      if (a.deadline && a.deadline.kind === 'due' && T.dayNum(a.deadline.date) - T.dayNum(now()) <= 2) return 1;
      if (!a.deadline) return 2;
      return 3;
    }
    /** What the client needs to do, most urgent first. Answered approvals drop out. */
    function attention() {
      const d = decisions();
      return tenant.actions
        .filter((a) => inPackage(a.service) && !(a.approvalId && d[a.approvalId]))
        .map((a) => ({ ...clone(a), severity: a.severity || SEVERITY_OF_KIND[a.kind] || 'approval' }))
        .sort((a, b) => rank(a) - rank(b) || String(a.deadline ? a.deadline.date : '9').localeCompare(String(b.deadline ? b.deadline.date : '9')));
    }

    /**
     * For the all-caught-up state: the next planned milestone and the latest completed work,
     * both read from the services, so the state never shows anything that is not on record.
     */
    function highlights() {
      /** @type {any[]} */ const upcoming = [];
      /** @type {any[]} */ const wins = [];
      for (const s of Object.values(services())) {
        for (const m of s.milestones) if (m.state !== 'done') upcoming.push({ service: s.id, title: m.title, date: m.date });
        if (s.proof) wins.push({ service: s.id, text: s.proof.text, date: s.proof.date });
      }
      upcoming.sort((a, b) => a.date.localeCompare(b.date));
      wins.sort((a, b) => b.date.localeCompare(a.date));
      return { next: upcoming[0] || null, win: wins[0] || null };
    }

    /**
     * What is coming up, in date order, from the record only: open milestones (and whether one
     * is waiting on the client), the client's own deadlines, planned campaigns and the next
     * meeting. The payment grace date is left out: it already sits on the payment row in Needs
     * your attention. Answered approvals drop out with their row.
     */
    function upcoming() {
      const today = T.dayNum(now());
      /** @type {any[]} */ const items = [];
      // A milestone waiting on one of the client's own dated tasks appears once, as that task.
      const dated = new Set();
      for (const a of attention()) {
        if (!a.deadline || a.deadline.kind === 'grace') continue;
        dated.add(a.id);
        items.push({ date: a.deadline.date, title: a.title, service: a.service, owner: 'client', waiting: false, kind: 'deadline' });
      }
      for (const s of Object.values(services())) {
        for (const m of s.milestones) {
          if (m.state !== 'done' && !(m.needs && dated.has(m.needs))) items.push({ date: m.date, title: m.title, service: s.id, owner: 'team', waiting: !!m.needs, kind: 'milestone' });
        }
      }
      if (inPackage('advertising')) {
        for (const c of tenant.campaigns || []) {
          if (c.status === 'planned') items.push({ date: c.from, title: `${c.name} campaign starts`, service: 'advertising', owner: 'team', waiting: false, kind: 'campaign' });
        }
      }
      if (tenant.meeting && tenant.meeting.status === 'confirmed') {
        items.push({ date: tenant.meeting.at.slice(0, 10), time: tenant.meeting.at.slice(11, 16), title: tenant.meeting.title, length: tenant.meeting.length, service: null, owner: 'both', waiting: false, kind: 'meeting' });
      }
      return items.filter((i) => T.dayNum(i.date) >= today)
        .sort((a, b) => a.date.localeCompare(b.date) || String(a.time || '').localeCompare(String(b.time || '')))
        .slice(0, 6);
    }

    /** One plain-English observation, computed from the stored series and nothing else. */
    function insight() {
      const id = tenant.insightMetric;
      const m = tenant.metrics[id];
      if (!m) return { state: 'none', text: 'There is not enough connected data to compare yet.' };
      const srcs = m.sources.map(sourceState);
      const bad = srcs.find((s) => s.state === 'error');
      if (bad) return { state: 'error', text: `We couldn't load ${bad.name} just now, so there is no comparison to show.` };
      const t = totals(m, 30);
      if (!t.change || t.change.dir === 'flat') return { state: 'none', text: `${m.label} stayed about the same as the previous 30 days.`, sources: srcs };
      // Compare weekdays by their daily average: a 30-day window can hold five Tuesdays one
      // month and four the next, so raw weekday totals would invent a change.
      const w = windows(30);
      const r = reader(m);
      const tally = (a, b) => {
        const sum = [0, 0, 0, 0, 0, 0, 0];
        const n = [0, 0, 0, 0, 0, 0, 0];
        for (let d = a; d <= b; d++) { sum[T.dow(d)] += r.at(d) || 0; n[T.dow(d)] += 1; }
        return { sum, n };
      };
      const cur = tally(w.from, w.to);
      const prev = tally(w.pFrom, w.pTo);
      const up = t.change.dir === 'up';
      const byDay = cur.sum.map((s, i) => ({ dow: i, cs: s, cn: cur.n[i], ps: prev.sum[i], pn: prev.n[i], d: s / cur.n[i] - prev.sum[i] / prev.n[i] }))
        .sort((a, b) => (up ? b.d - a.d : a.d - b.d));
      const top = byDay.slice(0, 2);
      const rest = byDay.slice(2);
      const topMean = (top[0].d + top[1].d) / 2;
      const restMean = rest.reduce((s, x) => s + x.d, 0) / rest.length;
      const clear = top.every((x) => (up ? x.d > 0 : x.d < 0)) && (up ? topMean >= 1.5 * Math.max(restMean, 0.0001) : topMean <= 1.5 * Math.min(restMean, -0.0001));
      const days = top.map((x) => x.dow).sort((a, b) => WEEK_ORDER.indexOf(a) - WEEK_ORDER.indexOf(b)).map((i) => WEEKDAYS_PLURAL[i]);
      const avgNow = (top[0].cs + top[1].cs) / (top[0].cn + top[1].cn);
      const avgThen = (top[0].ps + top[1].ps) / (top[0].pn + top[1].pn);
      const one = (x) => (x < 20 ? x.toFixed(1) : n2s(Math.round(x)));
      const detail = clear
        ? `The ${up ? 'rise' : 'drop'} was biggest on ${days[0]} and ${days[1]}: ${one(avgNow)} ${m.unit} a day on average, ${up ? 'up' : 'down'} from ${one(avgThen)}.`
        : `The ${up ? 'rise' : 'drop'} was spread across the week rather than on particular days.`;
      const pct = Math.round(Math.abs(t.change.pct));
      return {
        state: 'ok', metric: id, label: m.label, unit: m.unit, value: t.value, previous: t.previous, pct, dir: t.change.dir,
        headline: `${m.label} ${up ? 'rose' : 'fell'} ${pct}% compared with the previous 30 days: ${n2s(t.value)}, ${up ? 'up' : 'down'} from ${n2s(t.previous)}.`,
        detail, weekdays: top.map((x) => x.dow), sources: srcs
      };
    }

    function updates() {
      return tenant.updates.filter((u) => inPackage(u.service)).map((u) => clone(u)).sort((a, b) => b.date.localeCompare(a.date));
    }

    function account() {
      const srcs = sources();
      const working = srcs.filter((s) => s.state === 'fresh' || s.state === 'stale');
      const latest = working.map((s) => T.parse(s.updatedAt)).sort((a, b) => b - a)[0];
      return {
        // The person signed in, over the record's main contact: a restaurant can have more than one.
        business: clone(tenant.business), user: { ...clone(tenant.user), ...(session.firstName ? { firstName: session.firstName } : {}), ...(session.email ? { email: session.email } : {}) },
        package: clone(tenant.package), team: clone(tenant.team),
        meeting: clone(tenant.meeting), subscription: clone(tenant.billing.subscription), sources: srcs,
        connected: working.length, problems: srcs.filter((s) => s.state !== 'fresh'),
        updatedAt: latest ? T.isoTime(latest) : null, openActions: attention().length,
        // The look the client chose (theme, and the ground where the design has one), kept with the
        // account so it follows them to every device. Null until they first choose.
        appearance: clone(state().appearance || null)
      };
    }

    function results(days) {
      const groups = [];
      for (const g of GROUPS) {
        if (g.service && !inPackage(g.service)) continue;
        const ids = Object.keys(tenant.metrics).filter((id) => tenant.metrics[id].group === g.id && inPackage(tenant.metrics[id].service));
        const pend = (tenant.pending || []).filter((p) => p.group === g.id);
        if (!ids.length && !pend.length) continue;
        const ms = ids.map((id) => metric(id, days));
        const chartMetric = ms.find((x) => x.chart && x.state !== 'error' && x.value !== null);
        const srcs = [...new Set(ids.flatMap((id) => tenant.metrics[id].sources))].map(sourceState);
        const notes = srcs.filter((s) => s.state === 'disconnected').map((s) => {
          const ends = ids.map((id) => tenant.metrics[id]).filter((mm) => mm.sources.includes(s.id)).map((mm) => mm.series.end)[0];
          return { kind: 'disconnected', source: s.id, name: s.name, since: s.since, lastDay: ends || null };
        });
        groups.push({
          id: g.id, title: g.title, intro: g.intro,
          state: ms.length > 0 && ms.every((x) => x.state === 'error') ? 'error' : 'ok',
          metrics: ms, pending: clone(pend), sources: srcs, notes,
          chart: chartMetric ? { metric: chartMetric.id, label: chartMetric.label, unit: chartMetric.unit, value: chartMetric.value, previous: chartMetric.previous, points: points(chartMetric.id, days) } : null,
          campaigns: g.id === 'advertising' ? clone(tenant.campaigns || []) : []
        });
      }
      const summary = days === 30 ? (tenant.summaries || []).find((s) => s.days === 30) : null;
      return { window: windowInfo(days), groups, summary: summary ? clone(summary) : null };
    }

    function billing() {
      if (failing.has('stripe')) throw fail('source-error', 'We could not reach Stripe just now.');
      return { ...clone(tenant.billing), stripeConnected: integrations.stripe.connected };
    }

    function settings() {
      const saved = state().notifications || {};
      /** @type {Record<string, boolean>} */
      const prefs = {};
      for (const n of NOTIFICATIONS) prefs[n.id] = n.required ? true : saved[n.id] !== undefined ? !!saved[n.id] : true;
      return { email: session.email || tenant.user.email, categories: clone(NOTIFICATIONS), prefs, savedAt: state().notificationsSavedAt || null, sources: sources() };
    }

    function approval(id) {
      const a = tenant.approvals[id];
      if (!a) throw fail('not-found', 'This item is no longer waiting for you.');
      return { ...clone(a), decision: decisions()[id] || null };
    }

    /* ---- writes ------------------------------------------------------------------- */

    /**
     * Records the client's answer to an approval. Live: POST /api/approvals/:id/decision,
     * which stores it with an audit timestamp and tells the account team.
     * @param {string} id @param {'approved'|'changes'} decision @param {string} [comment]
     */
    function decide(id, decision, comment) {
      return call(() => {
        const apv = tenant.approvals[id];
        if (!apv) throw fail('not-found', 'This item is no longer waiting for you.');
        const st = state();
        st.decisions = st.decisions || {};
        if (st.decisions[id]) throw Object.assign(fail('already-decided', 'You already answered this one.'), { previous: st.decisions[id] });
        if (decision !== 'approved' && decision !== 'changes') throw fail('bad-decision', 'Choose approve or request changes.');
        const text = String(comment || '').trim();
        if (decision === 'changes' && !text) throw fail('comment-required', 'Tell us what to change so we can fix it.', 'comment');
        if (text.length > 1000) throw fail('comment-too-long', 'Keep the note under 1,000 characters.', 'comment');
        return src.put('decision', { approvalId: id, decision, comment: text, by: session.firstName })
          .then((/** @type {any} */ r) => ({ decision: r.decision, comment: r.comment, at: r.at, by: r.by }));
      }, 700);
    }

    /** A note to the account team. Live: POST /api/messages. */
    function sendMessage(about, text) {
      return call(() => {
        const body = String(text || '').trim();
        if (!body) throw fail('text-required', 'Write your message first.', 'text');
        if (body.length > 2000) throw fail('text-too-long', 'Keep the message under 2,000 characters.', 'text');
        return src.put('message', { about: about || 'general', text: body, by: session.firstName });
      }, 600);
    }

    /** A change request against one service. Live: POST /api/requests. */
    function sendRequest(service, text) {
      return call(() => {
        if (!inPackage(service) || !SERVICES[service]) throw fail('bad-service', 'That service is not part of your plan.');
        const body = String(text || '').trim();
        if (!body) throw fail('text-required', 'Tell us what you would like changed.', 'text');
        if (body.length > 2000) throw fail('text-too-long', 'Keep the request under 2,000 characters.', 'text');
        return src.put('request', { service, text: body, status: 'review', by: session.firstName });
      }, 600);
    }

    /**
     * The client's look, kept with the account. Live: PUT /api/settings/appearance, stored with the
     * signed-in user (a personal choice, not the whole tenant's). Only known values are kept.
     * @param {{theme?: string, scene?: string}} look
     */
    function saveAppearance(look) {
      return call(() => {
        const next = { ...(state().appearance || {}) };
        const l = look || {};
        if (l.theme !== undefined && l.theme !== 'light' && l.theme !== 'dark') throw fail('bad-theme', 'Choose light or dark.');
        if (l.scene !== undefined && l.scene !== 'scenes' && l.scene !== 'static') throw fail('bad-scene', 'Choose Scenes or Static.');
        if (l.theme) next.theme = l.theme;
        if (l.scene) next.scene = l.scene;
        next.savedAt = T.isoTime(now());
        return src.put('appearance', { look: next }).then(() => clone(next));
      }, 150);
    }

    /** Resend preferences. The required category cannot be switched off. */
    function saveNotifications(prefs) {
      return call(() => {
        /** @type {Record<string, boolean>} */
        const next = {};
        for (const n of NOTIFICATIONS) next[n.id] = n.required ? true : !!(prefs && prefs[n.id]);
        return src.put('notifications', { prefs: next }).then((/** @type {any} */ r) => ({ prefs: clone(next), at: r.at }));
      }, 500);
    }

    return {
      tenantId: session.tenantId,
      now,
      getAccount: () => call(account),
      getAttention: () => call(attention),
      // Charted metrics carry their daily figures for a small sparkline; the rest do not.
      getStrip: (days = 30) => call(() => ({
        window: windowInfo(days),
        metrics: tenant.strip.map((id) => metric(id, days)).filter(Boolean)
          .map((m) => (m.chart && m.state !== 'error' && m.value !== null ? { ...m, spark: points(m.id, days).map((p) => p.v) } : m))
      })),
      getHighlights: () => call(highlights),
      getUpcoming: () => call(upcoming),
      getWorkSummary: () => call(() => Object.values(services())),
      getWork: () => call(() => ({ services: Object.values(services()), actions: attention() })),
      getInsight: () => call(insight),
      getUpdates: () => call(updates),
      getResults: (days = 30) => call(() => results(days)),
      getBilling: () => call(billing),
      getSettings: () => call(settings),
      getMessages: () => call(() => (state().messages || []).slice().reverse(), 150),
      getApproval: (id) => call(() => approval(id), 150),
      refresh: () => src.reload().then(() => call(() => ({ checkedAt: T.isoTime(now()), updatedAt: account().updatedAt }))),
      decide,
      sendMessage,
      sendRequest,
      saveNotifications,
      saveAppearance,
      resetDemo: () => src.reset()
    };
  }

  /**
   * The client for a signed-in person: the demo's, or the live one when live-data.js has set
   * D8.data.liveSource (it does only in the live build).
   * @param {{tenantId: string, firstName: string, email: string}} session
   */
  function connect(session) {
    if (MODE === 'live') {
      if (!D8.data.liveSource) throw fail('no-live', 'The live connection did not load.');
      return makeClient(session, D8.data.liveSource(session));
    }
    return makeClient(session, demoSource(session));
  }

  D8.auth = auth;
  D8.integrations = integrations;
  D8.data = {
    MODE, SERVICES, SERVICE_ORDER, STATUS, GROUPS, NOTIFICATIONS, SEVERITY, HEALTH,
    connect, scenarios, currentScenario, switchScenario,
    // For live-data.js: build a client on another source, and the shared helpers it needs.
    makeClient, normalize, apply, fail,
    /** Tests only: pick a scenario without a URL. */
    useScenario: (id) => { scenarioOverride = id; }
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* data/live-data.js */
// @ts-check
/*
 * The live connection: sign-in through Clerk, records from the portal database (Supabase).
 * Loaded after dashboard-data.js and active only when the page carries
 * window.D8CONFIG = { mode: 'live', supabaseUrl, supabaseKey, clerkPublishableKey } (the live build
 * adds it; the demo build never does, and then this file does nothing and loads nothing).
 *
 * What it relies on, and why it is safe in a browser:
 *   - Each restaurant is a Clerk organisation. Clerk's session token names the person and the
 *     restaurant, Supabase accepts that token (Third-Party Auth: Clerk), and the database's own row
 *     level security hands out only that restaurant's rows. See portal/supabase/README.md.
 *   - The keys here are the public ones (Supabase publishable key, Clerk publishable key). No
 *     secret key ever reaches the browser.
 *   - Sign-in is a 6-digit code emailed by Clerk. There are no passwords, and Domin8te never
 *     sends sign-in emails itself.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const cfg = /** @type {any} */ (root).D8CONFIG;
  if (!cfg || cfg.mode !== 'live' || !D8.data) return;
  const T = D8.time;
  const { makeClient, normalize, apply, fail } = D8.data;

  // A local preview (console/preview-stub.js, never deployed) supplies in-memory stand-ins for
  // Clerk and Supabase through window.D8PREVIEW, so the screens can be tried without the services.
  const PREVIEW = /** @type {any} */ (root).D8PREVIEW || null;
  const CLERK_JS = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
  const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';

  /** Loads a script once. @param {string} src @param {Record<string, string>} [attrs] */
  function script(src, attrs) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.crossOrigin = 'anonymous';
      for (const [k, v] of Object.entries(attrs || {})) s.setAttribute(k, v);
      s.onload = () => resolve(null);
      s.onerror = () => reject(fail('offline', "We couldn't reach the sign-in service. Check your connection and try again."));
      document.head.appendChild(s);
    });
  }

  /* ---- Clerk ------------------------------------------------------------------------------------ */

  /** @type {Promise<any>|null} */
  let clerkReady = null;
  function clerk() {
    if (!clerkReady && PREVIEW) clerkReady = PREVIEW.clerk.load().then(() => PREVIEW.clerk);
    if (!clerkReady) {
      clerkReady = script(CLERK_JS, { 'data-clerk-publishable-key': cfg.clerkPublishableKey })
        .then(async () => {
          const C = /** @type {any} */ (root).Clerk;
          if (!C) throw fail('offline', "We couldn't start the sign-in service.");
          await C.load();
          return C;
        })
        .catch((e) => { clerkReady = null; throw e; });
    }
    return clerkReady;
  }

  /* ---- Whose sign-in this page uses ------------------------------------------------------------
   * One browser can hold more than one signed-in person (Clerk's multi-session mode): Karan as
   * himself for the console and a restaurant's login for the portal, side by side. Each page picks
   * its own: the console the person on the Domin8te team, the portal a person who belongs to a
   * restaurant. Tokens are asked of that session directly (session.getToken), so neither page ever
   * switches the browser's active session and signs the other page out. With one person per
   * browser (single-session mode) this is simply the active session, as before. */
  const APP = cfg.app === 'console' ? 'console' : 'portal';
  const TEAM = String(cfg.teamOrgId || '').split(',').map((x) => x.trim()).filter(Boolean);
  /** @param {any} s */
  const orgsOf = (s) => ((s && s.user && s.user.organizationMemberships) || []).map((/** @type {any} */ m) => m.organization && m.organization.id).filter(Boolean);
  /** The organisation this page asks tokens for, for one session. @param {any} s */
  function orgFor(s) {
    const orgs = orgsOf(s);
    if (APP === 'console') return orgs.find((id) => TEAM.includes(id)) || '';
    const own = s && s.lastActiveOrganizationId;
    if (own && !TEAM.includes(own) && orgs.includes(own)) return own;
    return orgs.find((id) => !TEAM.includes(id)) || '';
  }
  /** The signed-in session this page uses, or null. @param {any} C */
  function mySession(C) {
    const all = ((C.client && (C.client.signedInSessions || C.client.activeSessions)) || []).filter((/** @type {any} */ s) => s && s.user);
    if (!all.length) return C.session && C.user ? C.session : null;
    const fits = all.filter((/** @type {any} */ s) => orgFor(s));
    // The active session first when it fits, then any that fits, then the active one regardless (so a
    // person with no access still gets this page's "no access" answer instead of a sign-in loop).
    const active = C.session && fits.find((/** @type {any} */ s) => s.id === C.session.id);
    return active || fits[0] || (C.session && C.user ? C.session : all[0]);
  }
  /** A token for this page's session and organisation. @param {any} C */
  async function tokenFor(C) {
    const s = mySession(C);
    if (!s) return null;
    const org = orgFor(s);
    try { return await s.getToken(org ? { organizationId: org } : undefined); }
    catch (e) { if (org && C.session && s.id === C.session.id) return s.getToken(); throw e; }
  }
  try { root.__d8LastEmail = root.localStorage.getItem('d8.lastEmail') || ''; } catch (e) { root.__d8LastEmail = ''; }

  /**
   * A person usually belongs to one restaurant. If no restaurant is active in the session yet (the
   * first sign-in, or a new invitation), the first one they belong to becomes active, so the token
   * names it. @param {any} C
   */
  async function pickOrganisation(C) {
    if (C.organization) return;
    const memberships = (C.user && C.user.organizationMemberships) || [];
    if (memberships.length) await C.setActive({ organization: memberships[0].organization.id });
  }

  /** Clerk's errors, in the portal's words. @param {any} err @param {string} [field] */
  function clerkFail(err, field) {
    if (err && err.code && !err.errors) return err; // already ours
    const e = (err && err.errors && err.errors[0]) || {};
    const code = e.code || '';
    if (code === 'form_identifier_not_found') return fail('not-invited', "We couldn't find an invitation for that email. Check the address, or ask your account team to invite you.", field);
    if (code === 'session_exists' || code === 'identifier_already_signed_in') return fail('other-account', 'Another account is already signed in on this browser. Sign it out first, or use a private window.', field);
    if (code === 'form_code_incorrect') return fail('bad-code', "That code isn't right. Check the email and try again.", 'code');
    if (code === 'verification_expired') return fail('code-expired', 'That code has expired. Ask for a new one.', 'code');
    if (code === 'too_many_requests' || code === 'verification_failed') return fail('slow-down', 'Too many tries. Wait a minute, then ask for a new code.', field);
    if (code === 'form_param_format_invalid') return fail('bad-email', 'Enter the email address your invitation was sent to, like name@restaurant.com.', 'email');
    return fail('sign-in-failed', e.longMessage || e.message || "We couldn't sign you in just now. Try again in a moment.", field);
  }

  /** The sign-in waiting for its code. @type {any} */
  let pending = null;

  const auth = {
    provider: 'Clerk',
    connected: true,
    live: true,
    /** The signed-in person and their restaurant, or null when signed out. */
    async getSession() {
      const C = await clerk();
      const s = mySession(C);
      if (!s) return null;
      if (C.session && s.id === C.session.id && !(C.client && C.client.signedInSessions && C.client.signedInSessions.length > 1)) await pickOrganisation(C);
      const user = s.user || C.user;
      if (!user) return null;
      const email = user.primaryEmailAddress ? user.primaryEmailAddress.emailAddress : '';
      return {
        userId: user.id,
        // The restaurant is the session's Clerk organisation; the database checks it again on every read.
        tenantId: orgFor(s) || (C.session && s.id === C.session.id && C.organization ? C.organization.id : ''),
        firstName: user.firstName || '',
        email,
        role: ''
      };
    },
    /** Emails a 6-digit sign-in code (Clerk sends it). @param {string} email */
    async requestSignInLink(email) {
      const e = String(email || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) throw fail('bad-email', 'Enter the email address your invitation was sent to, like name@restaurant.com.', 'email');
      const C = await clerk();
      try { root.localStorage.setItem('d8.lastEmail', e); root.__d8LastEmail = e; } catch (x) { /* remembering the email is a nicety */ }
      try {
        const si = await C.client.signIn.create({ identifier: e });
        const factor = (si.supportedFirstFactors || []).find((/** @type {any} */ f) => f.strategy === 'email_code');
        if (!factor) throw fail('no-code', 'Email codes are not switched on for this portal yet. Tell your account team.', 'email');
        await si.prepareFirstFactor({ strategy: 'email_code', emailAddressId: factor.emailAddressId });
        pending = si;
        return { sent: true, demo: false, code: true, to: e };
      } catch (err) {
        throw clerkFail(err, 'email');
      }
    },
    /** Checks the code and starts the session. @param {string} code */
    async verifyCode(code) {
      const c = String(code || '').replace(/\s+/g, '');
      if (!/^\d{6}$/.test(c)) throw fail('bad-code', 'Enter the 6-digit code from the email.', 'code');
      if (!pending) throw fail('no-pending', 'Ask for a new code first.', 'code');
      const C = await clerk();
      try {
        const res = await pending.attemptFirstFactor({ strategy: 'email_code', code: c });
        if (res.status !== 'complete') throw fail('not-complete', "That code didn't finish signing you in. Ask for a new one.", 'code');
        await C.setActive({ session: res.createdSessionId });
        pending = null;
      } catch (err) {
        throw clerkFail(err, 'code');
      }
    },
    async signOut() {
      const C = await clerk();
      // Only this page's person signs out; another person signed in on this browser stays signed in.
      const s = mySession(C);
      if (s && C.client && C.client.signedInSessions && C.client.signedInSessions.length > 1) await C.signOut({ sessionId: s.id });
      else await C.signOut();
    },
    demoSignIn() {
      return Promise.reject(fail('no-demo', 'There is no demo account here.'));
    }
  };

  /* ---- Supabase ----------------------------------------------------------------------------------- */

  /** @type {Promise<any>|null} */
  let dbReady = null;
  function db() {
    if (!dbReady && PREVIEW) dbReady = Promise.resolve(PREVIEW.supabase.createClient());
    if (!dbReady) {
      dbReady = script(SUPABASE_JS)
        .then(() => {
          const S = /** @type {any} */ (root).supabase;
          if (!S) throw fail('offline', "We couldn't reach your account.");
          return S.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
            // Every request carries the Clerk session token; the database reads the person and the
            // restaurant from it.
            accessToken: async () => {
              const C = await clerk();
              // When a request has to go without a sign-in, note why, so the cause can be found.
              const note = (/** @type {any} */ why) => { /** @type {any} */ (root).__d8AuthTrouble = { at: new Date().toISOString(), ...why }; };
              if (!mySession(C)) { note({ why: 'no-session', user: !!C.user }); return null; }
              try {
                const t = await tokenFor(C);
                if (!t) note({ why: 'empty-token', status: C.session && C.session.status });
                return t;
              } catch (e) {
                note({ why: 'refresh-failed', error: String((e && (/** @type {any} */ (e).message || e)) || 'unknown') });
                throw e;
              }
            }
          });
        })
        .catch((e) => { dbReady = null; throw e; });
    }
    return dbReady;
  }

  /** Database errors, in the portal's words. @param {any} error */
  function dbFail(error) {
    const code = error && error.code;
    if (code === '23505') return fail('already-decided', 'You already answered this one.');
    if (code === '42501' || code === 'PGRST301') return fail('forbidden', "We couldn't save that for your account. Sign out and in again, then try once more.");
    if (code === '23514') return fail('invalid', "That wasn't saved: something in it is too long or missing.");
    return fail('source-error', "We couldn't reach your account just now. Try again in a moment.");
  }

  /**
   * The live source for one signed-in person: their restaurant's record and their own rows, read
   * once and kept here, and every action written to the database before it counts.
   * @param {{userId: string, tenantId: string, firstName: string, email: string}} session
   */
  function liveSource(session) {
    /** @type {any} */ let tenant = null;
    /** @type {string|null} */ let rowId = null;
    /** @type {any} */ let st = {};
    const now = () => Date.now();

    async function load() {
      if (!session.tenantId) { tenant = null; return; }
      const sb = await db();
      const t = await sb.from('tenants').select('id, name, doc').eq('clerk_org_id', session.tenantId).limit(1);
      if (t.error) throw dbFail(t.error);
      const row = t.data && t.data[0];
      if (!row) { tenant = null; return; }
      const [d, m, r, p] = await Promise.all([
        sb.from('decisions').select('approval_id, decision, comment, by_name, at').eq('tenant_id', row.id),
        sb.from('messages').select('id, about, body, from_staff, by_name, at').eq('tenant_id', row.id).order('at'),
        sb.from('requests').select('id, service, body, status, by_name, at').eq('tenant_id', row.id).order('at'),
        sb.from('user_prefs').select('notifications, notifications_saved_at, appearance').maybeSingle()
      ]);
      for (const x of [d, m, r, p]) if (x.error) throw dbFail(x.error);
      /** @type {any} */ const next = {};
      for (const x of d.data || []) apply(next, 'decision', { approvalId: x.approval_id, decision: x.decision, comment: x.comment, at: x.at, by: x.by_name });
      for (const x of m.data || []) apply(next, 'message', { id: x.id, about: x.about, text: x.body, at: x.at, fromTeam: x.from_staff, by: x.by_name });
      for (const x of r.data || []) apply(next, 'request', { id: x.id, service: x.service, text: x.body, at: x.at, status: x.status });
      if (p.data && p.data.notifications) apply(next, 'notifications', { prefs: p.data.notifications, at: p.data.notifications_saved_at });
      if (p.data && p.data.appearance) apply(next, 'appearance', { look: p.data.appearance });
      st = next;
      rowId = row.id;
      tenant = { ...normalize(row.doc, now), tenantId: row.id, name: row.name };
    }

    let ready = load();
    return {
      get ready() { return ready; },
      tenant: () => tenant,
      latency: 0,
      failing: new Set(),
      now,
      state: () => st,
      /** @param {string} kind @param {any} rec @returns {Promise<any>} */
      async put(kind, rec) {
        const sb = await db();
        let res;
        if (kind === 'decision') {
          res = await sb.from('decisions').insert({ tenant_id: rowId, approval_id: rec.approvalId, decision: rec.decision, comment: rec.comment, by_name: rec.by || '' }).select('at').single();
        } else if (kind === 'message') {
          res = await sb.from('messages').insert({ tenant_id: rowId, about: rec.about, body: rec.text, by_name: rec.by || '' }).select('id, at').single();
        } else if (kind === 'request') {
          res = await sb.from('requests').insert({ tenant_id: rowId, service: rec.service, body: rec.text, by_name: rec.by || '' }).select('id, at, status').single();
        } else if (kind === 'notifications') {
          res = await sb.from('user_prefs').upsert({ clerk_user_id: session.userId, notifications: rec.prefs, notifications_saved_at: new Date().toISOString() }).select('notifications_saved_at').single();
        } else if (kind === 'appearance') {
          res = await sb.from('user_prefs').upsert({ clerk_user_id: session.userId, appearance: rec.look }).select('updated_at').single();
        } else {
          throw fail('bad-kind', 'Unknown action.');
        }
        if (res.error) throw dbFail(res.error);
        const row = res.data || {};
        const stored = { ...rec, id: row.id || rec.id, at: row.at || row.notifications_saved_at || T.isoTime(now()) };
        if (row.status) stored.status = row.status;
        apply(st, kind, stored);
        return stored;
      },
      reload() { ready = load(); return ready; },
      reset: () => Promise.resolve()
    };
  }

  D8.auth = auth;
  D8.data.liveSource = liveSource;
  // The agency console signs in the same way and talks to the same database.
  D8.live = { clerk, db, dbFail, config: cfg };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/components.js */
// @ts-check
/*
 * Reusable pieces of the client portal. Each returns an HTML string built from escaped
 * record values; pages compose them. Names follow the brief: StatusBadge, MetricStrip,
 * ActionNeededList, ServiceWorkCard, InsightCard, UpdateCard, EmptyState, ErrorState, and so on.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const esc = F.esc;

  /** @param {string} name @param {string} [cls] */
  const icon = (name, cls) => `<svg class="i${cls ? ' ' + cls : ''}" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;

  /* ---- small pieces ----------------------------------------------------------------- */

  function StatusBadge(status) {
    const s = D8.data.STATUS[status] || D8.data.STATUS.planned;
    return `<span class="badge tone-${s.tone}">${icon(s.icon)}${esc(s.label)}</span>`;
  }

  function ServiceTag(service) {
    const s = D8.data.SERVICES[service];
    return s ? `<span class="svc-tag">${icon(s.icon)}${esc(s.label)}</span>` : `<span class="svc-tag">${icon('layers')}All services</span>`;
  }

  /** The icon for each kind of source, so a figure's origin reads at a glance. */
  const SOURCE_ICON = { gbp: 'pin', analytics: 'globe', booking: 'calendar', 'meta-ads': 'megaphone', facebook: 'share', instagram: 'share', stripe: 'card' };

  /** A source's health in plain words: Connected, Delayed, Needs reconnecting, Not loading. */
  function HealthBadge(src) {
    const h = D8.data.HEALTH[src.state] || D8.data.HEALTH.missing;
    return `<span class="badge tone-${h.tone}">${icon(h.icon)}${esc(h.label)}</span>`;
  }

  /** Where a figure comes from and how fresh it is, in words, with an icon for problems. */
  function FreshnessIndicator(src, now) {
    if (src.state === 'error') return `<span class="fresh is-error">${icon('alert')}${esc(src.name)}: not loading just now</span>`;
    if (src.state === 'disconnected') return `<span class="fresh is-off">${icon('linkoff')}${esc(src.name)}: needs reconnecting since ${esc(F.date(src.since))}</span>`;
    if (src.state === 'stale') return `<span class="fresh is-stale">${icon('clock')}${esc(src.name)}: delayed, last updated ${esc(F.ago(src.updatedAt, now))}</span>`;
    if (src.state === 'missing') return '';
    return `<span class="fresh">${esc(src.name)}, updated ${esc(F.ago(src.updatedAt, now))}</span>`;
  }

  /** A compact source chip: the source's icon and name, then how fresh it is, quieter. */
  function SourceChip(src, now) {
    const h = src.state === 'fresh' ? '' : (D8.data.HEALTH[src.state] || D8.data.HEALTH.missing).label;
    const when = src.state === 'fresh' || src.state === 'stale' ? `updated ${F.ago(src.updatedAt, now)}` : '';
    return `<span class="src-line"><span class="src-chip${src.state === 'fresh' ? '' : ' is-' + esc(src.state)}">${icon(SOURCE_ICON[src.id] || 'layers')}${esc(src.name)}</span>${h ? `<span class="src-health is-${esc(src.state)}">${esc(h)}</span>` : ''}${when ? `<span class="src-when">${esc(when)}</span>` : ''}</span>`;
  }

  /** Direction of change as an arrow and words, never colour alone. */
  function Delta(m) {
    if (!m.change) return '';
    if (m.change.dir === 'flat') return `<span class="delta is-flat">${icon('minus')}About the same</span>`;
    const up = m.change.dir === 'up';
    return `<span class="delta ${up ? 'is-up' : 'is-down'}">${icon(up ? 'up' : 'down')}${up ? 'Up' : 'Down'} ${Math.round(Math.abs(m.change.pct))}%</span>`;
  }

  /** Why a figure has no comparison, in plain words. */
  function ComparisonNote(m, days) {
    const n = m.note;
    if (!n) return '';
    if (n.kind === 'ends') return `Figures stop on ${esc(F.date(n.date, { weekday: false }))}, so this is not compared.`;
    if (n.kind === 'starts') return `Figures start on ${esc(F.date(n.date, { weekday: false }))}, so this is not compared yet.`;
    if (n.kind === 'no-history') return `Not enough history yet to compare with the previous ${days} days.`;
    if (n.kind === 'zero-before') return m.group === 'advertising' ? `No ads ran in the previous ${days} days.` : `None in the previous ${days} days.`;
    return '';
  }

  function sourceLine(sources, now) {
    return sources.map((s) => FreshnessIndicator(s, now)).filter(Boolean).join('<span class="sep" aria-hidden="true">·</span>');
  }

  /**
   * A clickable status chip for a source problem in the Home header. It goes to Connected
   * accounts, where the fix is.
   */
  function StatusChip(src, now) {
    if (src.state === 'disconnected') return `<a class="status-chip is-connection" href="#/settings/sources">${icon('linkoff')}${esc(src.name)} disconnected${icon('chevron-right', 'chip-go')}</a>`;
    if (src.state === 'error') return `<a class="status-chip is-critical" href="#/settings/sources">${icon('alert')}${esc(src.name)} not loading${icon('chevron-right', 'chip-go')}</a>`;
    if (src.state === 'stale') return `<a class="status-chip is-scheduled" href="#/settings/sources">${icon('clock')}${esc(src.name)} delayed, updated ${esc(F.ago(src.updatedAt, now))}${icon('chevron-right', 'chip-go')}</a>`;
    return '';
  }

  /* ---- states ----------------------------------------------------------------------- */

  function EmptyState(o) {
    return `<div class="empty">${icon(o.icon || 'check', 'empty-icon')}<div><p class="empty-title">${esc(o.title)}</p>${o.text ? `<p class="empty-text">${esc(o.text)}</p>` : ''}${o.action || ''}</div></div>`;
  }

  /** A section-sized error: says what failed, that the rest of the page works, and offers a retry. */
  function ErrorState(o) {
    return `<div class="error-state" role="alert">${icon(o.icon || 'alert', 'empty-icon')}<div><p class="empty-title">${esc(o.title)}</p><p class="empty-text">${esc(o.text || 'The rest of this page is still up to date.')}</p>${o.retry ? `<button class="btn btn-glass btn-sm" type="button" data-action="retry" data-section="${esc(o.retry)}">${icon('refresh')}Try again</button>` : ''}</div></div>`;
  }

  /** Shimmering placeholder shapes while a section loads. Hidden from screen readers; the section says "Loading". */
  function Skeleton(kind, n = 1) {
    const one = {
      strip: '<div class="metric-card skel-card"><span class="skel skel-line w60"></span><span class="skel skel-fig"></span><span class="skel skel-line w80"></span></div>',
      row: '<div class="skel-card skel-act"><span class="skel skel-dot"></span><div><span class="skel skel-line w60"></span><span class="skel skel-line w90"></span></div><span class="skel skel-btn"></span></div>',
      card: '<div class="card skel-card"><span class="skel skel-line w40"></span><span class="skel skel-line w90"></span><span class="skel skel-line w70"></span><span class="skel skel-line w80"></span></div>',
      block: '<div class="card skel-card"><span class="skel skel-line w30"></span><span class="skel skel-block"></span></div>',
      text: '<span class="skel skel-line w70"></span>'
    }[kind];
    return `<div class="skel-wrap skel-${kind}" aria-hidden="true">${Array(n).fill(one).join('')}</div><p class="sr-only" role="status">Loading</p>`;
  }

  /* ---- page structure --------------------------------------------------------------- */

  function PageHeader(o) {
    return `<header class="page-head${o.cls ? ' ' + o.cls : ''}"><div class="page-head-text"><h1 id="page-title" tabindex="-1">${esc(o.title)}</h1>${o.intro ? `<p class="lede">${o.introHtml ? o.intro : esc(o.intro)}</p>` : ''}${o.after || ''}</div>${o.aside ? `<div class="page-aside">${o.aside}</div>` : ''}</header>`;
  }

  /** @param {string} id heading id @param {string} titleHtml already-escaped title @param {string} [extra] */
  function SectionHead(id, titleHtml, extra) {
    return `<div class="sec-head"><h2 id="${esc(id)}">${titleHtml}</h2>${extra || ''}</div>`;
  }

  /* ---- metrics ------------------------------------------------------------------------ */

  /** A 30-day line drawn from the metric's real daily figures. Decorative: the number says it. */
  function Sparkline(values) {
    const v = (values || []).map((x) => (x === null ? null : Number(x)));
    const nums = /** @type {number[]} */ (v.filter((x) => x !== null));
    if (nums.length < 2) return '';
    const max = Math.max(...nums);
    const min = Math.min(...nums);
    const span = max - min || 1;
    const W = 120;
    const H = 32;
    let d = '';
    let pen = false;
    v.forEach((x, i) => {
      if (x === null) { pen = false; return; }
      const px = (i / (v.length - 1)) * W;
      const py = H - 3 - ((x - min) / span) * (H - 6);
      d += (pen ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1);
      pen = true;
    });
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="${d}"/></svg>`;
  }

  function MetricCard(m, now, days) {
    const link = `<a class="card-link" href="#/results"><span class="sr-only">${esc(m.label)}: see it in Results</span></a>`;
    if (m.state === 'pending') {
      return `<article class="metric-card is-pending"><p class="metric-label">${esc(m.label)}</p><p class="metric-empty">${icon('linkoff')}Not connected yet</p><p class="metric-meta">${esc(m.text)}</p></article>`;
    }
    if (m.state === 'error') {
      return `<article class="metric-card is-error"><p class="metric-label">${esc(m.label)}</p><p class="metric-empty">${icon('alert')}Couldn't load just now</p><p class="metric-meta">${esc(m.text)} The other figures are up to date.</p><button class="btn-text" type="button" data-action="retry" data-section="strip">${icon('refresh')}Try again</button></article>`;
    }
    const note = ComparisonNote(m, days);
    return `<article class="metric-card is-link">
      <p class="metric-label">${esc(m.label)}</p>
      <p class="metric-value"><span class="fig">${m.value === null ? 'None' : F.num(m.value)}</span>${Delta(m)}</p>
      ${m.spark ? Sparkline(m.spark) : ''}
      ${note ? `<p class="metric-note">${note}</p>` : ''}
      <p class="metric-src">${m.sources.map((s) => SourceChip(s, now)).join('')}</p>
      ${link}
    </article>`;
  }

  /** The performance strip: no more than four figures tied to the client's goals, each its own card. */
  function MetricStrip(strip, now) {
    const w = strip.window;
    const cells = strip.metrics.slice(0, 4).map((m) => MetricCard(m, now, w.days)).join('');
    return `<div class="strip">${cells}</div>`;
  }

  /* ---- needs your attention ------------------------------------------------------------ */

  /** The primary button's weight follows the severity: solid orange only for the urgent one. */
  const PRIMARY_STYLE = { critical: 'btn btn-primary', approval: 'btn btn-tint', connection: 'btn btn-glass', scheduled: 'btn btn-glass' };

  function actionPrimary(a, cls) {
    return a.primary.does === 'approval'
      ? `<button class="${cls}" type="button" data-action="approve" data-id="${esc(a.approvalId)}">${esc(a.primary.label)}</button>`
      : `<button class="${cls}" type="button" data-action="external" data-kind="${esc(a.primary.does)}">${esc(a.primary.label)}</button>`;
  }

  /**
   * One thing the client needs to do: what, why it matters, the deadline or consequence, one
   * primary action, and a "View details" disclosure. Clicking anywhere else on the card opens
   * the details too.
   */
  function ActionNeededItem(a, now) {
    const sev = D8.data.SEVERITY[a.severity] || D8.data.SEVERITY.approval;
    const kindIcon = a.icon || { billing: 'card', connection: 'linkoff', approval: 'check' }[a.kind] || 'alert';
    let when = '';
    if (a.deadline && a.deadline.kind === 'grace') {
      when = `<span class="due tone-overdue">${icon('calendar')}Services continue until ${esc(F.date(a.deadline.date))}</span>`;
    } else if (a.deadline) {
      const d = F.due(a.deadline.date, now);
      when = `<span class="due tone-${d.tone}">${icon('calendar')}${esc(d.text)}</span>`;
    } else if (a.since) {
      when = `<span class="due tone-later">${icon('pause')}Paused since ${esc(F.date(a.since))}</span>`;
    }
    const moreId = 'more-' + esc(a.id);
    const more = (a.more && a.more.length) || a.link
      ? `<div class="act-more" id="${moreId}" hidden>${(a.more || []).map((p) => `<p>${esc(p)}</p>`).join('')}${a.link ? `<a class="link link-more" href="${esc(a.link.href)}">${esc(a.link.label)}${icon('arrow-right')}</a>` : ''}</div>`
      : '';
    const toggle = more ? `<button class="btn-text act-toggle" type="button" data-action="toggle-more" aria-expanded="false" aria-controls="${moreId}">View details<span class="sr-only">: ${esc(a.title)}</span>${icon('chevron-down')}</button>` : '';
    return `<li class="act-card sev-${esc(a.severity)}" data-row="${esc(a.id)}">
      <span class="act-icon">${icon(kindIcon)}</span>
      <div class="act-main">
        <div class="act-head"><h3 class="act-title">${esc(a.title)}</h3><span class="sev-chip">${icon(sev.icon)}${esc(a.tag || sev.label)}</span></div>
        <p class="act-detail">${esc(a.detail)}</p>
        ${when ? `<p class="act-when">${when}</p>` : ''}
        ${more}
      </div>
      <div class="act-do">${actionPrimary(a, PRIMARY_STYLE[a.severity] || 'btn btn-glass')}${toggle}</div>
    </li>`;
  }

  function ActionNeededList(items, now) {
    return `<ol class="act-list">${items.map((a) => ActionNeededItem(a, now)).join('')}</ol>`;
  }

  /**
   * The payoff state when nothing needs the client: a calm status orb, what is planned next,
   * the latest win, and a gentle way into the results. Every fact comes from the services.
   */
  function CaughtUp(h) {
    const svc = (id) => (D8.data.SERVICES[id] ? D8.data.SERVICES[id].label : '');
    const facts = [];
    if (h && h.next) facts.push(`<div><dt>Next planned</dt><dd>${esc(h.next.title)}, ${esc(F.date(h.next.date))}<span class="cu-svc">${esc(svc(h.next.service))}</span></dd></div>`);
    if (h && h.win) facts.push(`<div><dt>Latest win</dt><dd>${esc(h.win.text)}, ${esc(F.date(h.win.date, { weekday: false }))}<span class="cu-svc">${esc(svc(h.win.service))}</span></dd></div>`);
    return `<div class="caught-up">
      <span class="orb" aria-hidden="true">${icon('check')}</span>
      <div class="cu-body">
        <h3 class="cu-title">You're all caught up</h3>
        <p class="cu-text">Nothing needs you right now. When something does, it appears here first, and we email you.</p>
        ${facts.length ? `<dl class="cu-facts">${facts.join('')}</dl>` : ''}
        <a class="btn btn-glass" href="#/results">Review your results${icon('arrow-right')}</a>
      </div>
    </div>`;
  }

  /**
   * Coming up: the next few dates on record, each with whose move it is. A calendar-style date,
   * the thing, then who (you, Domin8te, or you and your account team) and the service.
   */
  function UpcomingList(items, now) {
    if (!items.length) return EmptyState({ icon: 'calendar', title: 'Nothing scheduled in the next few weeks.', text: 'New dates appear here as soon as they are set.' });
    const T = D8.time;
    const who = { client: 'You', team: 'Domin8te', both: 'You and your account team' };
    return `<ol class="upcoming">${items.map((i) => {
      const gap = T.dayNum(i.date) - T.dayNum(now);
      const day = gap === 0 ? 'Today' : gap === 1 ? 'Tomorrow' : F.longDate(i.date).split(' ')[0];
      const [d, m] = F.date(i.date, { weekday: false }).split(' ');
      const owner = i.owner === 'team' && i.waiting ? 'Domin8te, waiting on you' : who[i.owner] || who.team;
      const when = i.time ? `${day}, ${esc(i.time)}${i.length ? `, ${esc(i.length)}` : ''}` : day;
      return `<li class="up-item is-${esc(i.kind)}${i.owner === 'client' || i.waiting ? ' is-yours' : ''}">
        <time class="up-date" datetime="${esc(i.date)}"><span class="up-day">${esc(d)}</span><span class="up-mon">${esc(m)}</span></time>
        <div class="up-main"><p class="up-title">${esc(i.title)}</p><p class="up-meta"><span class="up-when">${when}</span><span class="up-who">${esc(owner)}</span>${i.service ? ServiceTag(i.service) : ''}</p></div>
      </li>`;
    }).join('')}</ol>`;
  }

  /* ---- current work --------------------------------------------------------------------- */

  function nextStep(next) {
    const who = next.who === 'client' ? 'You' : 'Domin8te';
    return `<strong>${who}:</strong> ${esc(F.lcFirst(next.text))}`;
  }

  /** A concise service card: status, what is happening now, when, what is next, one proof. */
  function ServiceWorkCard(s) {
    const svc = D8.data.SERVICES[s.id];
    return `<article class="card work-card is-link" aria-labelledby="wc-${esc(s.id)}">
      <header class="work-head"><h3 id="wc-${esc(s.id)}">${icon(svc.icon)}${esc(svc.label)}</h3>${StatusBadge(s.status)}</header>
      <p class="work-now">${esc(s.now || 'Getting started')}</p>
      <dl class="facts">
        ${s.expected && s.expected.date ? `<div><dt>Expected by</dt><dd>${esc(F.date(s.expected.date))}: ${esc(F.lcFirst(s.expected.text))}</dd></div>` : ''}
        ${s.next && s.next.text ? `<div><dt>Next step</dt><dd>${nextStep(s.next)}</dd></div>` : ''}
        ${s.proof && s.proof.text ? `<div><dt>Completed</dt><dd>${esc(s.proof.text)}, ${esc(F.date(s.proof.date, { weekday: false }))}</dd></div>` : ''}
      </dl>
      <a class="link link-more card-link-text" href="#/work/${esc(s.id)}">View details<span class="sr-only"> for ${esc(svc.label)}</span>${icon('arrow-right')}</a>
    </article>`;
  }

  /* ---- insight and updates --------------------------------------------------------------- */

  function InsightCard(ins, now) {
    if (ins.state === 'error') return `<div class="card insight">${SectionHead('h-insight', 'What changed')}${ErrorState({ title: 'No comparison to show right now.', text: ins.text, retry: 'insight' })}</div>`;
    if (ins.state === 'none') return `<div class="card insight">${SectionHead('h-insight', 'What changed')}<p class="insight-detail">${esc(ins.text)}</p><a class="link link-more" href="#/results">See all results${icon('arrow-right')}</a></div>`;
    return `<article class="card insight" aria-labelledby="h-insight">
      ${SectionHead('h-insight', 'What changed')}
      <p class="insight-lead">${esc(ins.headline)}</p>
      <p class="insight-detail">${esc(ins.detail)}</p>
      <p class="meta insight-src">${icon('shield')}Worked out from ${sourceLine(ins.sources, now)}</p>
      <a class="link link-more" href="#/results">See all results${icon('arrow-right')}</a>
    </article>`;
  }

  function author(u) {
    if (u.author === 'automatic') return `<span class="author">${icon('refresh', 'author-icon')}Automatic notice from your connected accounts</span>`;
    return `<span class="author"><span class="team-mark" aria-hidden="true"></span>Your account team</span>`;
  }

  /**
   * One agency update in the fixed structure: completed, changed, result, why, next.
   * Compact (Home) shows why it matters instead of the result.
   */
  function UpdateCard(u, o = {}) {
    const rows = o.compact
      ? [['Completed', u.completed], ['What changed', u.changed], ['Why it matters', u.why || u.result], ['Next step', u.next]]
      : [['Completed', u.completed], ['What changed', u.changed], ['Result', u.result], ['Why it matters', u.why], ['Next step', u.next]];
    const tag = o.headingLevel || 'h3';
    return `<article class="card update${o.compact ? ' is-compact' : ''}"${o.id ? ` id="${esc(o.id)}"` : ''}>${o.lead || ''}
      <header class="update-head"><p class="update-date"><time datetime="${esc(u.date)}">${esc(F.date(u.date))}</time></p>${ServiceTag(u.service)}</header>
      <${tag} class="update-title">${esc(u.title)}</${tag}>
      <dl class="facts facts-wide">${rows.filter((r) => r[1]).map((r) => `<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>
      <footer class="update-foot">${author(u)}${o.compact ? `<a class="link link-more" href="#/updates">View all updates${icon('arrow-right')}</a>` : ''}</footer>
    </article>`;
  }

  /* ---- controls -------------------------------------------------------------------------- */

  function DateRangeSelector(days) {
    const opts = [[7, 'Last 7 days'], [30, 'Last 30 days'], [90, 'Last 90 days']];
    return `<fieldset class="segmented"><legend class="sr-only">Date range</legend>${opts.map(([d, l]) =>
      `<label class="seg"><input type="radio" name="range" value="${d}"${d === days ? ' checked' : ''} data-change="range"><span>${l}</span></label>`).join('')}</fieldset>`;
  }

  /** @param {Array<[string, string]>} options value, label @param {string} value @param {string} name */
  function FilterChips(options, value, name, legend) {
    return `<fieldset class="segmented is-chips"><legend class="sr-only">${esc(legend)}</legend>${options.map(([v, l]) =>
      `<label class="seg"><input type="radio" name="${esc(name)}" value="${esc(v)}"${v === value ? ' checked' : ''} data-change="${esc(name)}"><span>${esc(l)}</span></label>`).join('')}</fieldset>`;
  }

  function InvoiceRow(inv) {
    const st = {
      paid: ['Paid', 'success', 'check'],
      failed: ['Payment failed', 'error', 'alert'],
      open: ['Due', 'attention', 'clock']
    }[inv.status] || ['Unknown', 'neutral', 'info'];
    const period = F.range(inv.period[0], inv.period[1]);
    return `<li class="invoice">
      <div class="inv-main"><p class="inv-num">${esc(inv.number)}</p><p class="meta">Issued ${esc(F.date(inv.issued, { year: true }))} for ${esc(period)}</p>${inv.note ? `<p class="inv-note">${esc(inv.note)}</p>` : ''}</div>
      <span class="badge tone-${st[1]}">${icon(st[2])}${st[0]}</span>
      <button class="btn btn-glass btn-sm" type="button" data-action="external" data-kind="invoice" data-id="${esc(inv.id)}" data-number="${esc(inv.number)}">View invoice<span class="sr-only"> ${esc(inv.number)} on Stripe</span>${icon('external')}</button>
    </li>`;
  }

  /**
   * Changes the address without adding a history entry. Sandboxed previews (the design-system
   * card) can refuse this; the page has already changed, so it is safe to skip.
   * @param {string} url a hash, or a query and hash
   */
  function replaceHash(url) {
    try {
      root.history.replaceState(null, '', url);
    } catch (e) { /* sandboxed preview: keep the old address */ }
  }

  D8.ui = {
    replaceHash,
    icon, StatusBadge, ServiceTag, HealthBadge, FreshnessIndicator, SourceChip, StatusChip, Delta, ComparisonNote, sourceLine,
    EmptyState, ErrorState, Skeleton, PageHeader, SectionHead,
    Sparkline, MetricCard, MetricStrip, ActionNeededItem, ActionNeededList, CaughtUp, UpcomingList, ServiceWorkCard, nextStep,
    InsightCard, UpdateCard, DateRangeSelector, FilterChips, InvoiceRow
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/charts.js */
// @ts-check
/*
 * One chart type: a daily line for the chosen period, with the previous period as a dashed
 * line for comparison. Drawn at the element's real width (redrawn on resize) so the labels
 * stay legible on a phone. Hover shows the day's figures; the same figures are always
 * available as a table under the chart for keyboard and screen-reader users.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const T = D8.time;

  /** @param {number} v */
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }

  /** @param {HTMLElement} host */
  function draw(host) {
    const data = JSON.parse(host.getAttribute('data-points') || '[]');
    if (!data.length) return;
    const days = Number(host.getAttribute('data-days')) || data.length;
    const unit = host.getAttribute('data-unit') || '';
    const W = Math.max(260, Math.floor(host.clientWidth));
    if (host.getAttribute('data-w') === String(W)) return;
    host.setAttribute('data-w', String(W));
    const H = host.clientHeight || 200;
    const P = { l: 6, r: 44, t: 12, b: 28 };
    const iw = W - P.l - P.r;
    const ih = H - P.t - P.b;
    const vals = [];
    for (const p of data) { if (p.v !== null) vals.push(p.v); if (p.p !== null) vals.push(p.p); }
    const max = niceMax(Math.max(1, ...vals));
    const x = (i) => P.l + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
    const y = (v) => P.t + (1 - v / max) * ih;
    const path = (key) => {
      let d = '';
      let pen = false;
      data.forEach((p, i) => {
        if (p[key] === null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p[key]).toFixed(1);
        pen = true;
      });
      return d;
    };
    const idx = data.map((p, i) => (p.v === null ? -1 : i)).filter((i) => i >= 0);
    const area = idx.length > 1
      ? 'M' + x(idx[0]).toFixed(1) + ',' + y(0) + idx.map((i) => 'L' + x(i).toFixed(1) + ',' + y(data[i].v).toFixed(1)).join('') + 'L' + x(idx[idx.length - 1]).toFixed(1) + ',' + y(0) + 'Z'
      : '';
    const grid = [0, max / 2, max].map((t) =>
      `<line class="c-grid" x1="${P.l}" x2="${W - P.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="c-y" x="${W - P.r + 8}" y="${(y(t) + 4).toFixed(1)}">${F.num(Math.round(t * 10) / 10)}</text>`).join('');
    const marks = [0, Math.floor((data.length - 1) / 2), data.length - 1];
    const xl = marks.map((i, k) => `<text class="c-x" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${F.date(data[i].d, { weekday: false })}</text>`).join('');
    const last = idx.length ? idx[idx.length - 1] : -1;
    const end = last >= 0 ? `<circle class="c-end" cx="${x(last).toFixed(1)}" cy="${y(data[last].v).toFixed(1)}" r="4.5"/>` : '';
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${grid}<path class="c-area" d="${area}"/><path class="c-prev" d="${path('p')}"/><path class="c-cur" d="${path('v')}"/>${end}<line class="c-cross" x1="0" x2="0" y1="${P.t}" y2="${P.t + ih}" visibility="hidden"/><circle class="c-dot-prev" r="3.5" visibility="hidden"/><circle class="c-dot" r="5" visibility="hidden"/>${xl}</svg><div class="chart-tip" aria-hidden="true" hidden></div>`;

    const svg = /** @type {SVGSVGElement} */ (host.querySelector('svg'));
    const tip = /** @type {HTMLElement} */ (host.querySelector('.chart-tip'));
    const cross = /** @type {SVGLineElement} */ (svg.querySelector('.c-cross'));
    const dot = /** @type {SVGCircleElement} */ (svg.querySelector('.c-dot'));
    const dotPrev = /** @type {SVGCircleElement} */ (svg.querySelector('.c-dot-prev'));
    const show = (i) => {
      const p = data[i];
      const px = x(i);
      cross.setAttribute('x1', px.toFixed(1));
      cross.setAttribute('x2', px.toFixed(1));
      cross.setAttribute('visibility', 'visible');
      if (p.v !== null) { dot.setAttribute('cx', px.toFixed(1)); dot.setAttribute('cy', y(p.v).toFixed(1)); dot.setAttribute('visibility', 'visible'); } else dot.setAttribute('visibility', 'hidden');
      if (p.p !== null) { dotPrev.setAttribute('cx', px.toFixed(1)); dotPrev.setAttribute('cy', y(p.p).toFixed(1)); dotPrev.setAttribute('visibility', 'visible'); } else dotPrev.setAttribute('visibility', 'hidden');
      const prevDay = T.isoDay(T.dayNum(p.d) - days);
      tip.innerHTML = `<strong>${F.date(p.d)}</strong><span>${p.v === null ? 'No figures' : F.num(p.v) + ' ' + F.esc(unit)}</span><span class="tip-prev">${F.date(prevDay, { weekday: false })}: ${p.p === null ? 'no figures' : F.num(p.p)}</span>`;
      tip.hidden = false;
      const tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + 'px';
    };
    const hide = () => {
      tip.hidden = true;
      for (const el of [cross, dot, dotPrev]) el.setAttribute('visibility', 'hidden');
    };
    host.onpointermove = (e) => {
      const r = svg.getBoundingClientRect();
      const i = Math.round(((e.clientX - r.left - P.l) / iw) * (data.length - 1));
      show(Math.max(0, Math.min(data.length - 1, i)));
    };
    host.onpointerleave = hide;
  }

  const observer = typeof ResizeObserver !== 'undefined'
    ? new ResizeObserver((entries) => entries.forEach((e) => draw(/** @type {HTMLElement} */ (e.target))))
    : null;

  /** Draws every chart inside `scope` and keeps it sized to its container. @param {ParentNode} scope */
  function mountAll(scope) {
    scope.querySelectorAll('.chart[data-points]').forEach((el) => {
      const host = /** @type {HTMLElement} */ (el);
      host.removeAttribute('data-w');
      draw(host);
      if (observer) observer.observe(host);
    });
  }

  D8.charts = { mountAll };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/dialogs.js */
// @ts-check
/*
 * Dialogs and toasts. One native <dialog> is reused: it traps focus, closes on Escape
 * (except while saving) and hands focus back to the button that opened it.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const esc = F.esc;
  const icon = (n, c) => D8.ui.icon(n, c);

  const dlg = () => /** @type {HTMLDialogElement} */ (document.getElementById('dlg'));
  const inner = () => /** @type {HTMLElement} */ (document.getElementById('dlg-inner'));
  /** @type {HTMLElement|null} */
  let returnTo = null;
  /** @type {null|(() => void)} */
  let onClosed = null;

  /* ---- toasts ------------------------------------------------------------------------ */

  /** @param {string} text @param {{tone?: string}} [o] */
  function toast(text, o = {}) {
    const box = document.getElementById('toasts');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast' + (o.tone ? ' tone-' + o.tone : '');
    el.innerHTML = `${icon(o.tone === 'error' ? 'alert' : 'check')}<p>${esc(text)}</p><button class="icon-btn" type="button" aria-label="Dismiss">${icon('x')}</button>`;
    const btn = /** @type {HTMLElement} */ (el.querySelector('button'));
    const remove = () => el.remove();
    btn.addEventListener('click', remove);
    box.appendChild(el);
    setTimeout(remove, 6000);
  }

  /* ---- the shell ----------------------------------------------------------------------- */

  function head(title, sub) {
    return `<div class="dlg-head"><div><h2 id="dlg-title" tabindex="-1">${esc(title)}</h2>${sub ? `<p class="dlg-sub">${sub}</p>` : ''}</div><button class="icon-btn dlg-x" type="button" data-dlg-close aria-label="Close">${icon('x')}</button></div>`;
  }

  /** Opens the dialog with `html` and moves focus to its title. */
  function open(html, trigger, closed) {
    const d = dlg();
    returnTo = trigger || /** @type {HTMLElement|null} */ (document.activeElement);
    onClosed = closed || null;
    inner().innerHTML = html;
    d.removeAttribute('data-busy');
    if (!d.open) d.showModal();
    focusTitle();
  }
  function focusTitle() {
    const t = /** @type {HTMLElement|null} */ (document.getElementById('dlg-title'));
    if (t) t.focus();
  }
  /**
   * Everything that happens after a dialog closes: clear it, hand focus back, run the
   * follow-up (for example reloading the page's data after an approval). It runs straight
   * from close(), because Chrome only delivers the dialog's own "close" event on the next
   * animation frame, which never comes in a background tab.
   */
  function finish() {
    const d = dlg();
    if (d.open) return; // a newer dialog is already showing
    const cb = onClosed;
    const back = returnTo;
    onClosed = null;
    returnTo = null;
    if (inner().innerHTML) inner().innerHTML = '';
    if (back && document.contains(back)) back.focus();
    if (cb) cb();
  }
  function close() {
    const d = dlg();
    if (d.hasAttribute('data-busy')) return;
    if (d.open) d.close();
    finish();
  }
  function wire() {
    const d = dlg();
    // Escape takes the same path as the close button, and does nothing while saving.
    d.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
    // Safety net for any other way the dialog closes; finish() only acts once.
    d.addEventListener('close', finish);
    d.addEventListener('click', (e) => {
      const t = /** @type {HTMLElement} */ (e.target);
      if (t.closest('[data-dlg-close]')) close();
      else if (t === d) close(); // a click on the backdrop
    });
  }

  function setBusy(on, button, label) {
    const d = dlg();
    if (on) d.setAttribute('data-busy', '1');
    else d.removeAttribute('data-busy');
    inner().querySelectorAll('button, textarea, input, select').forEach((el) => {
      const b = /** @type {HTMLButtonElement} */ (el);
      if (b.hasAttribute('data-dlg-close') && !on) { b.disabled = false; return; }
      b.disabled = on;
    });
    if (button) {
      if (on) {
        button.setAttribute('data-label', button.innerHTML);
        button.innerHTML = `<span class="spinner" aria-hidden="true"></span>${esc(label)}`;
        button.classList.add('is-busy');
      } else if (button.hasAttribute('data-label')) {
        button.innerHTML = button.getAttribute('data-label') || '';
        button.classList.remove('is-busy');
      }
    }
  }

  function fieldError(field, msg) {
    const input = /** @type {HTMLElement|null} */ (inner().querySelector(`[name="${field}"]`));
    const err = /** @type {HTMLElement|null} */ (inner().querySelector(`#err-${field}`));
    if (!input || !err) return false;
    if (msg) {
      err.innerHTML = `${icon('alert')}${esc(msg)}`;
      err.hidden = false;
      input.setAttribute('aria-invalid', 'true');
      input.focus();
    } else {
      err.hidden = true;
      input.removeAttribute('aria-invalid');
    }
    return true;
  }

  function formError(msg) {
    const box = /** @type {HTMLElement|null} */ (inner().querySelector('.form-error'));
    if (!box) return;
    box.innerHTML = msg ? `${icon('alert')}<span>${esc(msg)}</span>` : '';
    box.hidden = !msg;
  }

  /* ---- approvals ------------------------------------------------------------------------ */

  function preview(p) {
    if (!p) return '';
    if (p.type === 'posts') {
      return `<ol class="posts">${p.items.map((it) => `<li class="post"><div class="post-img">${icon('image')}<span>${esc(it.image)}</span></div><div class="post-body"><p class="post-when">${esc(it.day)} <span class="meta">on ${esc(it.channels)}</span></p><p class="post-text">${esc(it.text)}</p></div></li>`).join('')}</ol>`;
    }
    if (p.type === 'hours') {
      return `<table class="hours"><caption class="sr-only">Proposed opening hours</caption><tbody>${p.rows.map((r) => `<tr><th scope="row">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>`;
    }
    // Added for the agency console: a plain list, and a link to the draft (only https addresses).
    if (p.type === 'list') {
      return `<ul class="apv-list">${(p.items || []).map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`;
    }
    if (p.type === 'link' && /^https:\/\//.test(String(p.url || ''))) {
      return `<p class="apv-link"><a class="btn btn-glass" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.label || 'Open the draft')}${icon('external')}</a></p>`;
    }
    return '';
  }

  function decided(a, rec, now) {
    const ok = rec.decision === 'approved';
    return `<div class="confirm-state" role="status">
      <span class="confirm-icon tone-${ok ? 'success' : 'info'}">${icon(ok ? 'check' : 'edit')}</span>
      <h3>${ok ? 'Approved' : 'Changes requested'}</h3>
      <p>${esc(ok ? a.approve.done : a.change.done)}</p>
      ${rec.comment ? `<blockquote class="your-note"><p class="meta">Your note</p><p>${esc(rec.comment)}</p></blockquote>` : ''}
      <p class="audit">${icon('clock')}${ok ? 'Approved' : 'Changes requested'} by ${esc(rec.by)} on ${esc(F.date(rec.at))} at ${esc(F.time(rec.at))}</p>
      <div class="dlg-actions"><button class="btn btn-solid" type="button" data-dlg-close>Done</button></div>
    </div>`;
  }

  /** Review an item and approve it or ask for changes, with an optional note. */
  function approval(id, trigger, ctx) {
    let changed = false;
    open(head('Loading', '') + `<div class="dlg-body">${D8.ui.Skeleton('text', 3)}</div>`, trigger, () => { if (changed) ctx.afterChange(); });
    ctx.client.getApproval(id).then((a) => {
      const now = ctx.client.now();
      const svc = D8.data.SERVICES[a.service];
      const due = F.due(a.due, now);
      const sub = `${esc(svc ? svc.label : '')} · <span class="due tone-${due.tone}">${esc(due.text)}</span>`;
      if (a.decision) {
        inner().innerHTML = head(a.title, sub) + `<div class="dlg-body">${decided(a, a.decision, now)}</div>`;
        focusTitle();
        return;
      }
      inner().innerHTML = head(a.title, sub) + `<div class="dlg-body">
        <p class="dlg-intro">${esc(a.intro)}</p>
        ${preview(a.preview)}
        <form class="dlg-form" novalidate>
          <div class="field">
            <label for="apv-comment">Note for your account team <span class="optional">(needed if you request changes)</span></label>
            <textarea id="apv-comment" name="comment" rows="3" maxlength="1000" aria-describedby="err-comment"></textarea>
            <p class="field-error" id="err-comment" hidden></p>
          </div>
          <p class="form-error" role="alert" hidden></p>
          <div class="dlg-actions">
            <button class="btn btn-tint" type="submit" value="approved">${esc(a.approve.label)}</button>
            <button class="btn btn-glass" type="submit" value="changes">${esc(a.change.label)}</button>
          </div>
        </form></div>`;
      focusTitle();
      const form = /** @type {HTMLFormElement} */ (inner().querySelector('form'));
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = /** @type {HTMLButtonElement} */ (/** @type {SubmitEvent} */ (e).submitter);
        const decision = btn && btn.value === 'changes' ? 'changes' : 'approved';
        const comment = /** @type {HTMLTextAreaElement} */ (form.elements.namedItem('comment')).value;
        fieldError('comment', '');
        formError('');
        if (decision === 'changes' && !comment.trim()) { fieldError('comment', 'Tell us what to change so we can fix it.'); return; }
        setBusy(true, btn, decision === 'approved' ? 'Saving your approval' : 'Sending your changes');
        ctx.client.decide(id, decision, comment).then((rec) => {
          changed = true;
          setBusy(false);
          inner().innerHTML = head(a.title, sub) + `<div class="dlg-body">${decided(a, rec, ctx.client.now())}</div>`;
          focusTitle();
          toast(decision === 'approved' ? `${a.title}: approved.` : `${a.title}: changes requested.`);
        }).catch((err) => {
          setBusy(false, btn);
          if (err.code === 'already-decided' && err.previous) {
            changed = true;
            inner().innerHTML = head(a.title, sub) + `<div class="dlg-body">${decided(a, err.previous, ctx.client.now())}</div>`;
            focusTitle();
          } else if (err.field && fieldError(err.field, err.message)) {
            /* shown next to the field */
          } else {
            formError(`We couldn't save your answer, so nothing has changed. ${err.message || ''} Try again.`);
          }
        });
      });
    }).catch((err) => {
      inner().innerHTML = head('Something went wrong', '') + `<div class="dlg-body">${D8.ui.ErrorState({ title: "We couldn't open this item.", text: err.message || 'Try again in a moment.' })}<div class="dlg-actions"><button class="btn btn-glass" type="button" data-dlg-close>Close</button></div></div>`;
      focusTitle();
    });
  }

  /* ---- outside pages: Stripe, Instagram, Clerk -------------------------------------------- */

  const OUTSIDE = {
    'billing-portal': { title: 'Update your payment method', where: 'Stripe', text: 'Your card details are handled by Stripe, our payment provider, on its own secure page. Domin8te never sees your full card number.' },
    invoice: { title: 'View invoice', where: 'Stripe', text: 'Invoices, with the amount and a PDF to download, open on Stripe.' },
    'connect-instagram': { title: 'Reconnect Instagram', where: 'Instagram', text: "You'll sign in on Instagram's own page and choose the account Domin8te can post to. We never see your password." },
    'clerk-account': { title: 'Sign-in and security', where: 'Clerk', text: 'Your email address, sign-in methods and active sessions are managed by Clerk, our sign-in provider.' }
  };

  function external(kind, id, trigger) {
    const o = OUTSIDE[kind] || (String(kind).startsWith('connect-') ? { title: 'Reconnect this account', where: 'the provider', text: "You'll sign in on the provider's own page and choose what Domin8te can access. We never see your password." } : null);
    if (!o) return;
    const b = /** @type {HTMLButtonElement|null} */ (trigger && trigger.tagName === 'BUTTON' ? trigger : null);
    if (b) b.disabled = true;
    const number = trigger && trigger.getAttribute('data-number');
    D8.integrations.resolve(kind, id).then((url) => {
      if (b) b.disabled = false;
      if (url) { root.location.assign(url); return; }
      open(head(number ? `${o.title} ${number}` : o.title, '') + `<div class="dlg-body">
        <p class="dlg-intro">${esc(o.text)}</p>
        <div class="notice">${icon('info')}<p><strong>${esc(o.where)} is not connected in this demo</strong>, so nothing opens and nothing changes. In the live portal this button takes you straight to ${esc(o.where)}, then brings you back here.</p></div>
        <div class="dlg-actions"><button class="btn btn-solid" type="button" data-dlg-close>Close</button></div></div>`, trigger);
    }).catch(() => {
      if (b) b.disabled = false;
      toast(`We couldn't reach ${o.where} just now. Try again in a minute.`, { tone: 'error' });
    });
  }

  /* ---- messages and change requests ------------------------------------------------------ */

  function compose(o, trigger, ctx) {
    const isRequest = o.mode === 'request';
    const svc = isRequest ? D8.data.SERVICES[o.service] : null;
    const pkg = ctx.account.package.services;
    const title = isRequest ? `Ask for a change: ${svc ? svc.label : ''}` : 'Message your account team';
    const about = isRequest ? '' : `<div class="field"><label for="msg-about">What is it about?</label><select id="msg-about" name="about"><option value="general">Something else</option>${pkg.map((s) => `<option value="${esc(s)}">${esc(D8.data.SERVICES[s].label)}</option>`).join('')}<option value="billing">Billing</option></select></div>`;
    let sent = false;
    open(head(title, esc(ctx.account.team.reply)) + `<div class="dlg-body">
      <form class="dlg-form" novalidate>
        ${about}
        <div class="field">
          <label for="msg-text">${isRequest ? 'What would you like changed?' : 'Your message'}</label>
          <textarea id="msg-text" name="text" rows="5" maxlength="2000" aria-describedby="msg-hint err-text"></textarea>
          <p class="hint" id="msg-hint">${isRequest ? 'For example: swap the brunch photo for the one I sent on Monday.' : 'Your account team reads every message. For urgent problems, say so in the first line.'}</p>
          <p class="field-error" id="err-text" hidden></p>
        </div>
        <p class="form-error" role="alert" hidden></p>
        <div class="dlg-actions"><button class="btn btn-solid" type="submit">${isRequest ? 'Send request' : 'Send message'}</button><button class="btn btn-glass" type="button" data-dlg-close>Cancel</button></div>
      </form></div>`, trigger, () => { if (sent) ctx.afterChange(); });
    const form = /** @type {HTMLFormElement} */ (inner().querySelector('form'));
