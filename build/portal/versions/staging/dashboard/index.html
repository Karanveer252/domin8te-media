.pk-today { margin-top: 16px; padding: 16px 16px 14px; border-radius: 16px; background: var(--p-glass-strong); box-shadow: inset 0 0 0 1px var(--p-line); }
.pk-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 16px; }
.pk-row strong { font-weight: 700; font-variant-numeric: proportional-nums; }
.pk-row strong { flex: none; white-space: nowrap; }
.pk-row.is-next { margin-top: 4px; font-size: 14.5px; color: var(--p-ink-2); }
.pk-row.is-next span { min-width: 0; }
.pk-row.is-next strong { color: var(--p-ink); }
.pk-row-sub { margin: 4px 0 8px; font-size: 14.5px; color: var(--p-ink-2); }
.pk-big { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pk-big strong { font-size: 34px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; font-variant-numeric: proportional-nums; }
.pk-more { padding: 3px 12px; border-radius: 999px; background: linear-gradient(var(--p-attn-bg), var(--p-attn-bg)), var(--p-surface); color: var(--p-attn); font-size: 14px; font-weight: 650; white-space: nowrap; }
.pk-more.is-less { background: linear-gradient(var(--p-success-bg), var(--p-success-bg)), var(--p-surface); color: var(--p-success); }
.pk-panel .po-h { margin: 22px 0 12px; font-size: 13.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--p-ink-3); }
.pk-confirm { margin-top: 20px; min-height: 52px; font-size: 16px; }
.pk-lock { margin: 10px 0 14px; text-align: center; font-size: 14px; color: var(--p-ink-2); }
.pk-panel .form-error { margin-top: 14px; }

/* the phone: the panel moves below the choices, and a bar keeps the plan in view */
.pk-bar { display: none; }
@container page (max-width: 980px) {
  .picker { grid-template-columns: minmax(0, 1fr); padding-bottom: 8px; }
  .pk-panel { position: static; }
}
@container page (max-width: 760px) {
  .plan-choices { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .svc-choices { grid-template-columns: minmax(0, 1fr); }
  /* a plan is one row on a phone: its name and price, the line about it underneath */
  .po-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 16px 16px 16px 18px; }
  .po-title { grid-column: 1; padding-right: 0; font-size: 18px; }
  .po-cost { grid-column: 2; grid-row: 1; justify-self: end; margin-right: 42px; }
  .po-cost strong { font-size: 24px; }
  .po-mark { top: 14px; right: 14px; }
  .po-blurb { grid-column: 1 / -1; font-size: 14.5px; }
  .po-card .chip-now, .po-card .btn { grid-column: 1 / -1; justify-self: start; margin-top: 6px; }
  .pk-deadline { grid-template-columns: auto minmax(0, 1fr); padding: 18px 20px; }
  .pk-deadline .days-left { grid-column: 1 / -1; justify-self: start; grid-auto-flow: column; align-items: baseline; gap: 8px; padding: 8px 16px; }
  .po-card { padding: 18px; }
  .web-opt { margin-left: 20px; }
}
@media (max-width: 760px) {
  .pk-bar {
    position: fixed; left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 35;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 18px;
    border-radius: 22px; background: #1D1A16; color: #F4F1EC;
    box-shadow: var(--p-shadow-pop);
  }
  html[data-theme="dark"] .pk-bar { background: #F1EFEA; color: #14100C; }
  .pk-bar-name { font-size: 15.5px; font-weight: 700; line-height: 1.25; }
  .pk-bar-sub { font-size: 13.5px; opacity: 0.78; }
  .pk-bar .btn { flex: none; min-height: 44px; }
  .page-change { padding-bottom: 76px; }
}
@media (prefers-reduced-motion: reduce) {
  .plan-opt:hover .po-card { transform: none; }
}
@media (forced-colors: active) {
  .po-card, .svc-opt, .pk-now, .pk-from, .pcf-box { border: 1px solid CanvasText; }
  .pk-input:checked + .po-card, .svc-opt.is-on, .pk-from { outline: 3px solid Highlight; }
}

/* ================================================================ css/40-pages.css */
/*
 * Page touches for the plan release (2026-10-13): Work's usage and its muted "not in this month's plan" cards, Settings
 * (locked always-sent emails, the connected-account rows, the look picker), Help (the questions), Messages (the thread,
 * the composer and the view-only demo) and the limit check inside "Ask for a change". Tokens only, so dark follows.
 * Design pass 2026-10-13 ("pages"): one clear thing per card, a quiet second tier, a whisper third; 8px rhythm;
 * locked switches that read as locked, not broken; a read-only composer that reads as calm, not disabled by accident.
 */

/* A small lock, drawn in the colour of whatever carries it (a mask, so it follows the tokens). */
html { --pg-lock: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='4.5' y='10.5' width='15' height='10' rx='2.5'/><path d='M8 10.5V7.5a4 4 0 0 1 8 0v3'/></svg>"); }

.svc-opt.is-fixed .pk-input { cursor: default; }

/* ------------------------------------------------------------------ Work */

.work-usage { display: grid; gap: 12px; margin: 14px 0 4px; padding: 16px 18px; border-radius: 16px; background: var(--p-well); }
.svc-off { margin-top: 16px; padding: 22px 26px; background: var(--p-glass-soft); }
.svc-off .svc-head h2 { font-size: 20px; color: var(--p-ink-2); }
.svc-off p { margin-top: 10px; max-width: 70ch; color: var(--p-ink-2); }

/* ------------------------------------------------------------------ Settings */

/* The stack: four cards, one job each, 24px apart; each card's title is the one clear thing. */
.page-settings .settings-stack { gap: 24px; }
.page-settings .set-card { padding: 26px 28px 24px; }
.page-settings .set-card h2 { margin-bottom: 4px; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
.page-settings .set-card > p { max-width: 66ch; font-size: 16px; line-height: 1.5; color: var(--p-ink-2); }
.page-settings .set-card > p.meta { font-size: 14.5px; color: var(--p-ink-3); }
.page-settings .set-card .sec-head { margin-bottom: 2px; }
.page-settings .set-count { font-size: 14.5px; font-weight: 600; font-variant-numeric: proportional-nums; color: var(--p-ink-2); }
.page-settings .set-actions { gap: 10px; margin-top: 16px; }

/* Connected accounts: name, what it does, when it last spoke; the health word on the right, the one button after it. */
.page-settings .sources { margin-top: 10px; }
.page-settings .src-row { gap: 6px 18px; padding: 14px 0; }
.page-settings .src-row > div { min-width: 0; }
.page-settings .src-name { font-size: 16px; font-weight: 650; line-height: 1.35; }
.page-settings .src-about { margin-top: 1px; font-size: 14.5px; line-height: 1.45; color: var(--p-ink-2); }
.page-settings .src-row > div > .meta { margin-top: 3px; font-size: 13.5px; line-height: 1.45; }
.page-settings .src-row .badge { justify-self: end; }
.page-settings .src-row .btn-glass { justify-self: end; }
.src-off { color: var(--p-ink-2); }
.src-off:hover { color: var(--p-crit); }

/* Folds: the quiet summary is the whole hit area, a pill on hover, 44px on touch. */
.page-settings .fold > summary { gap: 8px; min-height: 40px; margin: 0 -6px; padding: 0 6px; border-radius: 10px; font-size: 15px; transition: background-color var(--m-fast) var(--ease), color var(--m-fast) var(--ease); }
.page-settings .fold > summary:hover { background: var(--p-hover); color: var(--p-ink); }
.page-settings .fold > summary:focus-visible { outline: 2px solid var(--p-focus); outline-offset: 0; }
.page-settings .fold > summary .i { width: 18px; height: 18px; color: var(--p-ink-3); }
.page-settings .fold-sources > .meta { margin: 4px 0 2px; font-size: 14px; }
.page-settings .fold-sources > .sources { margin-top: 6px; }
.page-settings .fold-look > summary { width: auto; min-height: 44px; margin: -6px -6px; padding: 0 6px; }
.page-settings .fold-look > summary h2 { margin: 0; }
.page-settings .fold-look > summary .i { width: 20px; height: 20px; }
.page-settings .fold-look[open] > summary { margin-bottom: 10px; }

/* Who can sign in: the login request is a sub-task, so it sits in its own well. */
.page-settings .ask-form { margin-top: 18px; padding: 18px 20px 20px; border-radius: 16px; background: var(--p-well); }
.page-settings .ask-form > p:first-child { margin-bottom: 0; font-size: 15.5px; color: var(--p-ink); }
.page-settings .ask-form > .meta { margin-top: -4px; }
.page-settings .ask-form .form-foot { margin-top: 4px; padding-top: 14px; border-top-color: var(--p-line-2); }

/* Emails: the label is the clear thing, the sentence under it the second tier; the chip sits beside the label and wraps
   under it on a narrow phone instead of hanging in the air. */
.page-settings .toggles { margin-top: 12px; }
.page-settings .toggles.is-always { margin-top: 10px; }
.page-settings .toggle-row { gap: 4px 16px; padding: 14px 0; }
.page-settings .toggle-label { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 16px; font-weight: 650; line-height: 1.35; }
.page-settings .toggle-text { font-size: 14.5px; line-height: 1.45; color: var(--p-ink-2); }
.chip-always { display: inline-flex; align-items: center; margin: 0; padding: 2px 10px; border-radius: 999px; background: linear-gradient(var(--p-neutral-bg), var(--p-neutral-bg)), var(--p-surface); color: var(--p-ink-2); font-size: 12.5px; font-weight: 650; line-height: 1.5; letter-spacing: 0.01em; white-space: nowrap; }
.toggle-row.is-always label { cursor: default; }
/* A locked switch is on at full strength, with a small lock on its knob: on and not yours to turn off, never "broken". */
.toggle-row.is-always .switch, .toggle-row.is-always .switch:disabled { opacity: 1; cursor: default; }
.toggle-row.is-always .switch::before { content: ""; position: absolute; z-index: 1; top: 3px; left: 21px; width: 22px; height: 22px; background: var(--p-switch-on); -webkit-mask: var(--pg-lock) center / 11px 11px no-repeat; mask: var(--pg-lock) center / 11px 11px no-repeat; }
.fold-emails { margin-top: 8px; }
.page-settings .fold-emails > #notify-form { margin-top: 2px; }
.page-settings .form-foot .btn { min-width: 150px; }
.link-btn:disabled { color: var(--p-ink-3); text-decoration: none; cursor: not-allowed; opacity: 0.7; }

/* How it looks: two choices per question, the chosen one framed in ink. */
.page-settings .pick-legend { margin-bottom: 10px; font-size: 14.5px; font-weight: 700; letter-spacing: 0.01em; color: var(--p-ink-2); }
.page-settings .theme-pick { gap: 12px; margin-top: 8px; }
.page-settings .theme-opt { padding: 14px 16px; transition: border-color var(--m-fast) var(--ease), background-color var(--m-fast) var(--ease), box-shadow var(--m-fast) var(--ease); }
.page-settings .theme-opt:hover { border-color: var(--p-ink-3); background: var(--p-surface); }
.page-settings .theme-opt:has(input:checked) { border-color: var(--p-ink); background: var(--p-surface); box-shadow: 0 0 0 1px var(--p-ink); }
.page-settings .theme-opt strong { font-size: 15.5px; font-weight: 650; line-height: 1.3; }
.page-settings .theme-opt .meta { margin-top: 1px; font-size: 13.5px; line-height: 1.4; }
.page-settings .theme-swatch { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5); }

@container page (max-width: 560px) {
  .page-settings .set-card { padding: 22px 20px 20px; }
  .page-settings .settings-stack { gap: 18px; }
  /* The row stacks: the words first, then the health word and the button side by side. */
  .page-settings .src-row { grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; }
  .page-settings .src-row > div { grid-column: 1 / -1; }
  .page-settings .src-row .badge { grid-column: 1; grid-row: 2; justify-self: start; }
  .page-settings .src-row .btn { grid-column: 2; grid-row: 2; justify-self: end; margin: 0; }
  .page-settings .ask-form { padding: 16px 16px 18px; }
  .page-settings .theme-opt { padding: 12px 14px; }
}
@media (pointer: coarse) {
  .page-settings .fold > summary { min-height: 44px; }
}

/* ------------------------------------------------------------------ Help */

.page-help .sec { margin-top: 24px; }
.page-help .sec-title { margin-bottom: 12px; }
/* The questions: one row each, a pill on hover, the open one in heavier ink with its answer set in a comfortable measure. */
.page-help .faq { padding: 6px 26px; }
.page-help .faq summary { gap: 16px; min-height: 58px; margin: 0 -12px; padding: 14px 12px; border-radius: 12px; font-size: 16.5px; font-weight: 600; line-height: 1.35; color: var(--p-ink); transition: background-color var(--m-fast) var(--ease); }
.page-help .faq summary:hover { background: var(--p-hover); }
.page-help .faq summary:focus-visible { outline: 2px solid var(--p-focus); outline-offset: -2px; border-radius: 12px; }
.page-help .faq summary .i { flex: none; width: 20px; height: 20px; color: var(--p-ink-3); transition: transform var(--m) var(--ease), color var(--m-fast) var(--ease); }
.page-help .faq details[open] > summary { font-weight: 700; }
.page-help .faq details[open] > summary .i { color: var(--p-ink); }
.page-help .faq details > p { max-width: 68ch; padding: 0 0 20px; font-size: 16px; line-height: 1.55; color: var(--p-ink-2); }
.page-help .faq .promise-list { padding: 2px 0 14px; }
.page-help .promise-list li { grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 7px 0; font-size: 16px; line-height: 1.5; color: var(--p-ink-2); }
.page-help .promise-list .i { width: 18px; height: 18px; margin-top: 3px; }
/* Still stuck: one sentence and the one button. */
.page-help .help-contact { margin-top: 24px; padding: 26px 28px; }
.help-contact-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px 24px; }
.help-contact-row > div { flex: 1 1 360px; min-width: 0; }
.help-contact h2 { margin-bottom: 4px; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
.help-contact p { margin-top: 4px; max-width: 58ch; font-size: 16px; line-height: 1.5; color: var(--p-ink-2); }
.help-contact .btn { flex: none; }

@container page (max-width: 560px) {
  .page-help .faq { padding: 4px 18px; }
  .page-help .faq summary { min-height: 54px; margin: 0 -8px; padding: 12px 8px; font-size: 16px; }
  .page-help .faq details > p { padding-bottom: 18px; font-size: 15.5px; }
  .page-help .help-contact { padding: 22px 20px; }
  .help-contact .btn { width: 100%; }
}

/* ------------------------------------------------------------------ Messages */

/* The thread: the team's bubbles on glass with a hairline, the client's in ink; day pills and the New line quiet. */
.page-messages .msg-card { margin-top: 24px; }
.page-messages .msg-scroll { padding: 22px 22px 16px; }
.page-messages .msg-list { gap: 12px; }
.page-messages .msg-bubble { padding: 11px 15px; }
.page-messages .msg.is-team .msg-bubble { box-shadow: inset 0 0 0 1px var(--p-line), 0 1px 2px rgba(34, 40, 70, 0.05); }
.page-messages .msg.is-mine .msg-bubble { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.page-messages .msg-meta { margin-top: 5px; gap: 0 7px; font-size: 13px; }
.page-messages .msg-day { margin: 14px 0 2px; padding: 3px 12px; font-size: 12.5px; font-weight: 650; letter-spacing: 0.01em; color: var(--p-ink-2); }
.page-messages .msg-list > .msg-day:first-child { margin-top: 2px; }
.page-messages .msg-new { margin-top: 6px; font-size: 12.5px; letter-spacing: 0.02em; }
/* A change request: a dashed card on the client's side, its state as a small pill in plain words. */
.page-messages .msg-req { padding: 12px 16px 13px; }
.page-messages .msg-req-h { font-size: 12.5px; font-weight: 700; letter-spacing: 0.01em; color: var(--p-ink-2); }
.page-messages .msg-req .msg-text { margin-top: 5px; }
.page-messages .msg-req-status { display: inline-flex; align-items: center; margin-top: 9px; padding: 2px 10px; border-radius: 999px; background: linear-gradient(var(--p-info-bg), var(--p-info-bg)), var(--p-surface); color: var(--p-info); font-size: 13px; font-weight: 650; line-height: 1.5; }
.page-messages .msg-req-status:is([data-status="done"], [data-status="complete"]) { background: linear-gradient(var(--p-success-bg), var(--p-success-bg)), var(--p-surface); color: var(--p-success); }
.page-messages .msg-req-status[data-status="declined"] { background: linear-gradient(var(--p-neutral-bg), var(--p-neutral-bg)), var(--p-surface); color: var(--p-neutral); }
/* Nothing yet: a soft mark and one sentence, centred. */
.msg-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 220px; padding: 24px; color: var(--p-ink-2); font-size: 16px; line-height: 1.5; text-align: center; }
.msg-empty-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--p-well); color: var(--p-ink-2); box-shadow: inset 0 0 0 1px var(--p-line); }
.msg-empty-icon .i { width: 22px; height: 22px; }
.msg-empty p { max-width: 36ch; margin: 0; }
/* The composer sits on a soft strip, so the box you write in is the brightest thing on it. */
.page-messages .msg-compose { gap: 10px; padding: 14px 18px 16px; background: var(--p-well); }
.page-messages .msg-compose textarea { min-height: 68px; transition: border-color var(--m-fast) var(--ease), box-shadow var(--m-fast) var(--ease); }
.page-messages .msg-compose textarea:hover { border-color: var(--p-ink-3); }
.page-messages .msg-compose textarea:focus-visible { outline: none; border-color: var(--p-focus); box-shadow: 0 0 0 3px rgba(29, 26, 22, 0.14); }
html[data-theme="dark"] .page-messages .msg-compose textarea:focus-visible { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18); }
.page-messages .msg-compose-foot { gap: 8px 16px; }
.page-messages .msg-keys { font-size: 14px; }

/* View-only, in the public demo: the same strip, read-only on purpose. The box is a quiet dashed outline, the topic

.msg-card.is-view-only .msg-compose { opacity: 1; gap: 10px; }
.msg-card.is-view-only textarea, .msg-card.is-view-only textarea:hover { min-height: 56px; border: 1px dashed var(--p-line-2); background: transparent; color: var(--p-ink-3); box-shadow: none; cursor: default; resize: none; }
.msg-card.is-view-only textarea::placeholder { color: var(--p-ink-3); }
.msg-card.is-view-only .msg-about-toggle { display: none; }
.msg-card.is-view-only .msg-keys { display: inline-flex; align-items: center; gap: 7px; margin: 0 auto 0 0; color: var(--p-ink-2); font-size: 14.5px; font-weight: 600; }
.msg-card.is-view-only .msg-keys::before { content: ""; flex: none; width: 15px; height: 15px; background: currentColor; -webkit-mask: var(--pg-lock) center / contain no-repeat; mask: var(--pg-lock) center / contain no-repeat; }
.msg-card.is-view-only .msg-send, .msg-card.is-view-only .msg-send:disabled { margin-left: auto; opacity: 1; border-color: var(--p-line-2); background: var(--p-neutral-bg); background-image: none; color: var(--p-ink-3); box-shadow: none; cursor: not-allowed; }
@media (hover: none) {

}
@media (max-width: 760px) {

}

/* ------------------------------------------------------------------ Ask for a change: how it fits this month */

.dlg-form.is-ask { gap: 18px; }
.ask-qty { display: grid; grid-template-columns: minmax(0, 1fr) 136px; gap: 0 16px; }

.ask-n input { font-variant-numeric: proportional-nums; }

.ask-note { display: grid; grid-template-columns: 20px minmax(0, 1fr); align-items: start; gap: 6px 12px; padding: 16px 18px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; font-variant-numeric: proportional-nums; color: var(--p-ink); }

@media (max-width: 760px) {

/* ------------------------------------------------------------------ comfort and access */

/* A chosen theme or look card stays a card: a 2px ink border and a small ink tick in the corner (2026-10-14, the one selected look). */

.theme-opt:has(input:checked)::before { content: ""; position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--p-sel); pointer-events: none; }

/* ================================================================ css/45-work.css */
/*
 * Work, the premium pass (2026-10-13): each service's card (its state at the top right, the "Right now" line, the usage
 * well in two columns, the steps) and the quiet cards for the services not in this month's plan. Every rule sits under
 * .page-work. Tokens only.
 */

/* ------------------------------------------------------------------ a service's card */

.page-work .svc-section { margin-top: 20px; padding: 26px 28px 24px; }
.page-work .svc-section:first-of-type { margin-top: 24px; }
.page-work .svc-simple > * + * { margin-top: 20px; }
/* The name at the left, its state at the right: one glance says where each service stands. */
.page-work .svc-head { gap: 10px 14px; }
.page-work .svc-head h2 { font-size: 22px; line-height: 1.25; }
.page-work .svc-head h2 .i { width: 23px; height: 23px; }
.page-work .svc-head > .badge { margin-left: auto; }
.page-work .svc-head + .svc-now { margin-top: 14px; }
.page-work .svc-now { font-size: 18px; line-height: 1.45; text-wrap: pretty; }

/* The usage well: a soft recess inside the card. Two limits to a row, so a bar is never the width of the page; the day
   it resets runs along the foot. */
.page-work .work-usage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 36px; margin: 18px 0 0; padding: 16px 20px 14px; border-radius: 16px; background: var(--p-well); --p-fill-ok: var(--p-chart); }
.page-work .work-usage .usage { gap: 7px; }
.page-work .work-usage .usage-line { font-size: 15px; line-height: 1.45; }
.page-work .work-usage .usage-word { font-size: 13px; }
.page-work .work-usage .usage-reset { grid-column: 1 / -1; margin-top: 2px; font-size: 13.5px; }
.page-work .work-usage .chip-sample { padding: 0 8px; border: 1px dashed var(--p-line-2); border-radius: 999px; background: none; color: var(--p-ink-3); font-size: 12px; font-weight: 600; line-height: 1.5; vertical-align: 1px; }
.page-work .work-usage + .notice, .page-work .work-usage + .svc-wait { margin-top: 16px; }

/* The steps: the list sits close under its heading, the done steps fold right under the list. */
.page-work .svc-simple > .steps-head + .steps { margin-top: 6px; }
.page-work .svc-simple > .steps + .steps-earlier, .page-work .svc-simple > .steps-head + .steps-earlier { margin-top: 6px; }
.page-work .step { padding: 11px 0; }
.page-work .steps-earlier > .steps { margin-top: 2px; }

/* ------------------------------------------------------------------ not in this month's plan */

/* Quiet on purpose: a smaller card, lighter glass, the icon tile and the words in the second and third inks, the three

.page-work .svc-off { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: start; gap: 14px; margin-top: 24px; padding: 18px 22px 18px 20px; background: var(--p-glass-soft); }
.page-work .svc-off + .svc-off { margin-top: 10px; }

.page-work .svc-off .svc-ico .i { width: 20px; height: 20px; }
.page-work .off-body { min-width: 0; }
.page-work .svc-off .svc-head { gap: 6px 12px; min-height: 40px; }
.page-work .svc-off .svc-head h2 { font-size: 18px; color: var(--p-ink-2); }
.page-work .svc-off .svc-head .badge { margin-left: auto; padding: 3px 10px; font-size: 13px; font-weight: 600; }
.page-work .svc-off p { margin-top: 4px; max-width: 70ch; font-size: 15px; line-height: 1.5; color: var(--p-ink-2); }
.page-work .svc-off .link { color: var(--p-ink); }

@container svc (max-width: 640px) {

}
@container page (max-width: 560px) {

  .page-work .svc-section:not(.svc-off) > .svc-head > .badge { margin-left: 0; }
  .page-work .svc-head h2 { font-size: 21px; }
  .page-work .svc-now { font-size: 17px; }
  .page-work .svc-off { grid-template-columns: 36px minmax(0, 1fr); gap: 12px; margin-top: 20px; padding: 16px; }
  .page-work .svc-off .svc-ico { width: 36px; height: 36px; border-radius: 11px; }
  .page-work .svc-off .svc-head { min-height: 36px; }
  .page-work .svc-off .svc-head .badge { margin-left: 0; }
}
@media (forced-colors: active) {
  .page-work .work-usage .chip-sample { border: 1px solid CanvasText; }
  .page-work .work-usage { border: 1px solid CanvasText; }
}

/* ================================================================ css/60-results.css */
/*
 * Results (2026-10-13): the range bar, the checked summary, the groups of result cards, the daily chart card, the folds,
 * the ads list and the notices. The cards themselves and the "Where these numbers come from" table are in 10-trust.css.
 * Tokens only, so the dark set follows.
 */

/* On Scenes the fold pills ("Show daily website visits", "See your 3 ads") sit straight on the sky and are glass, so they
   keep the glass inks (the same rule the freshness line uses in 10-trust.css). */
html[data-variant="18h"] .page-results :is(.fold-chart, .fold-ads) > summary {
  --p-ink: var(--k-ink); --p-ink-2: var(--k-ink-2); --p-ink-3: var(--k-ink-3);
  --p-focus: var(--k-focus); --p-line: var(--k-line); --p-line-2: var(--k-line-2);
  color: var(--p-ink-2); text-shadow: none;
}
/* Over the deep sky (Scenes, light) the group's source line carries the same soft shadow as the words beside it. */
html[data-variant="18h"][data-scene="scenes"]:not([data-theme="dark"]) .page-results .group-src { text-shadow: 0 1px 14px rgba(8, 10, 30, 0.5); }

/* ------------------------------------------------------------------ the top: range, freshness, summary */

.page-results .range-bar { gap: 10px 14px; margin-top: 20px; }
.page-results .range-text { flex: 1 1 100%; margin: -2px 0 0 2px; font-size: 14px; font-variant-numeric: proportional-nums; }
.page-results #results-body > :first-child { margin-top: 24px; }
.page-results .page-fresh + * { margin-top: 20px; }
.page-results .page-fresh + .group { margin-top: 32px; }
.page-results .ai-summary { margin-top: 20px; padding: 22px 24px 20px; border-style: solid; border-color: var(--p-glass-edge); background: var(--p-glass); }
.ai-summary .sec-head { align-items: center; gap: 8px 16px; margin-bottom: 10px; }
.checked-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px 3px 9px; border-radius: 999px;
  background: linear-gradient(var(--p-success-bg), var(--p-success-bg)), var(--p-surface); color: var(--p-success);
  font-size: 13px; font-weight: 650; line-height: 1.5; white-space: nowrap;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 18%, transparent);
}
.checked-chip .i { width: 14px; height: 14px; }
.ai-summary .ai-text { max-width: 70ch; font-size: 17px; line-height: 1.55; color: var(--p-ink); }
.ai-summary .ai-label { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding: 0; border-radius: 0; background: none; color: var(--p-ink-3); font-size: 13.5px; font-weight: 500; }
.ai-summary .ai-label .i { width: 14px; height: 14px; color: var(--p-appr); }
.ai-big { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--p-line); font-size: 15.5px; line-height: 1.5; color: var(--p-ink-2); }
.ai-big strong { font-weight: 650; color: var(--p-ink); }

/* ------------------------------------------------------------------ a group: heading, what it is, where from */

.page-results .group { margin-top: 40px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 14px; }
.group-head h2 { margin-right: auto; }
.group-head .sec-meta { order: 1; flex-basis: 100%; font-size: 15px; color: var(--p-ink-2); }
.group-head .group-src { flex: 0 1 auto; margin: 0; font-size: 13.5px; line-height: 1.4; text-align: right; color: var(--p-ink-3); }
.group-src .fresh { display: inline; }
.group-src .fresh .i { margin-right: 3px; vertical-align: -0.2em; }
.group-src .sep { margin: 0 8px; }
.page-results .group .notice { margin-top: var(--p-gap); }
.page-results .group > .error-state { margin-top: 0; }

/* ------------------------------------------------------------------ the daily chart */

.page-results .chart-fig { margin-top: var(--p-gap); padding: 20px 22px 14px; }
.chart-cap { align-items: center; gap: 6px 16px; margin-bottom: 12px; }
.chart-title { font-size: 15.5px; font-weight: 650; }
.legend { font-size: 13.5px; }
.page-results .c-y, .page-results .c-x { font-variant-numeric: proportional-nums; }
.page-results .chart-table { margin-top: 6px; }
.page-results .chart-table summary { font-size: 14px; color: var(--p-ink-2); }
.page-results .chart-table summary:hover { color: var(--p-ink); }
.page-results .chart-table .table-wrap { margin-top: 10px; }

/* ------------------------------------------------------------------ the folds: a quiet glass pill, the card under it */

.page-results :is(.fold-chart, .fold-ads) { margin-top: 14px; }
.page-results :is(.fold-chart, .fold-ads) > summary {
  gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid var(--p-line); border-radius: 999px;
  background: var(--p-glass-soft); box-shadow: inset 0 1px 0 var(--p-glass-hi);
  font-size: 14px; font-weight: 600; color: var(--p-ink-2);
  transition: background-color var(--m-fast) var(--ease), color var(--m-fast) var(--ease), border-color var(--m-fast) var(--ease);
}
.page-results :is(.fold-chart, .fold-ads) > summary:hover { border-color: var(--p-line-2); background: var(--p-glass-strong); color: var(--p-ink); }
.page-results :is(.fold-chart, .fold-ads) > summary:active { background: var(--p-active); }
.page-results :is(.fold-chart, .fold-ads)[open] > summary { margin-bottom: 12px; }
.page-results .fold-chart > .chart-fig, .page-results .fold-ads > .campaigns { margin-top: 0; }

/* ------------------------------------------------------------------ the ads */

.page-results .campaigns { padding: 6px 22px 8px; }
.campaigns li { align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--p-line); }
.campaigns li:first-child { border-top: 0; }
.camp-name { font-size: 15.5px; font-weight: 650; }
.campaigns .meta { margin-top: 2px; font-size: 13.5px; }

/* ------------------------------------------------------------------ phones */

@container page (max-width: 640px) {

@media (forced-colors: active) {

/* ================================================================ css/70-viewas.css */
/*
 * View as client (2026-10-14): the agency console shows this dashboard live and read only in a frame of its own.
 * The line at the very top of every page, in the demo chip's look (dashed edge, eye, a bold line and a quiet one) on the
 * cream and orange tokens, and room made for it so the sidebar and the phone bar sit under it. Nobody signs out here.
 */
.viewas-bar { display: none; }
html[data-viewas] { --va-h: 40px; }
html[data-viewas] .viewas-bar {
  position: sticky; top: 0; z-index: 90;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  height: var(--va-h); padding: 0 16px;
  background: var(--p-attn-bg); color: var(--p-ink);
  border-bottom: 1px dashed var(--p-accent);
  font-size: 14px; line-height: 1.2; overflow: hidden;
}
html[data-viewas] .viewas-bar[hidden] { display: none; }
.viewas-bar .i { flex: none; width: 18px; height: 18px; color: var(--p-accent-ink); }
.viewas-bar .va-text { display: flex; align-items: baseline; gap: 4px 10px; min-width: 0; white-space: nowrap; }
.viewas-bar .va-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.viewas-bar .va-sub { font-weight: 500; color: var(--p-ink-2); overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .viewas-bar .va-sub { display: none; } }
/* The sidebar and the phone bar start below the line. */
html[data-viewas] .side { top: calc(16px + var(--va-h)); height: calc(100vh - 32px - var(--va-h)); }
@media (max-width: 760px) {
  html[data-viewas] .topbar { top: var(--va-h); }
}
html[data-viewas] .nav-signout, html[data-viewas] [data-action="sign-out"] { display: none !important; }

/* ================================================================ css/80-touch.css */
/*
 * Phone tap targets (2026-10-14): at 600px and under every button, tab, summary row, switch and icon button is at least 44px
 * tall, and inline links get a padded hit area that does not change how their words look. Desktop sizes are untouched.
 */
@media (max-width: 600px) {
  /* buttons, tabs and segmented controls */
  .btn, .btn-sm, .btn-text, .link-btn, .work-tab, .seg span, .icon-btn, .topbar-brand { min-height: 44px; }
  .main button.lg-dock-min, button.lg-dock-min { width: 44px; height: 44px; }
  /* fields */
  .main input:not([type="checkbox"]):not([type="radio"]), .main select { min-height: 44px; }
  /* folds: every summary line is a 44px row (the page rules above set 36 and 40 on a desktop) */
  .main summary, .main .fold > summary, .page-billing .banner .fold > summary, .page-settings .fold > summary, .update-more > summary, .steps-earlier > summary { min-height: 44px; }
  /* the switch: the same 46 by 28 track and knob, inside a 44px tall box so a thumb lands on it. The extra height is a clear
     border above and below; the fill, the inset ring, the knob and the lock all stay inside the padding box (the track). */
  .switch { height: 44px; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-radius: 14px / 22px; background-clip: padding-box; }
  /* inline links keep their look; the hit area grows above and below the words */
  .main a.link:not(.link-more):not(.crumb .link), .run-name a, .main p > a:not(.btn):not(.badge), .main li > a:not(.btn):not(.badge), .main td a:not(.btn) { padding-top: 13px; padding-bottom: 13px; }
  .run-name a { padding-top: 12px; padding-bottom: 12px; }
  .crumb .link { min-height: 44px; margin-top: -11px; margin-bottom: -11px; }
  .link-more { min-height: 44px; margin-top: 5px; margin-bottom: -11px; }
}
@media (max-width: 600px) and (forced-colors: active) {
  .switch { border-color: transparent; border-width: 8px 0; box-shadow: inset 0 0 0 1px CanvasText; }
}

/* ================================================================ shared Liquid Glass layer */
/*
 * Liquid Glass primitives shared by 16A to 16J. Each variant decides where to use them.
 *
 * The glass level. The "Liquid glass" slider (liquid.js) sets --lg-level from 0 (no glass) to 1
 * (too much), and --lg-default to the design's own level. The build's glass pass
 * (tools/glass.js) makes every glass fill, backdrop blur and saturation follow the multipliers
 * below; the rims and highlights here follow them directly. At the default level a design looks
 * exactly as designed.
 *
 * - --lg-edge-light: the rim of a thick pane: a bright top-left edge, a softer bottom-right edge
 *   and a faint inner glow.
 * - --lg-depth: the thickness of a slab: a lit top face, a shaded lower inside edge.
 * - --lg-ring: a hairline of light around the rim, brightest at ten and four o'clock, where a
 *   curved edge catches the light (used on ::after when the variant asks for rings).
 * - --lg-spec: a highlight that follows the pointer (liquid.js sets --mx and --my).
 * - .has-lens (Chromium): url(#lg-edge), url(#lg-edge-strong), url(#lg-zoom) and each element's
 *   own url(#lgf-N) (as --lg-lens) bend what is behind the glass.
 * Motion: glass controls swell a little when pressed, like a drop of liquid, and settle back.
 */

@property --lg-top { syntax: '<length>'; inherits: false; initial-value: 0px; }
@property --lg-bot { syntax: '<length>'; inherits: false; initial-value: 0px; }

html[data-variant] {
  --lg-level: 0.5;
  --lg-default: 0.5;
  --lg-t1: min(var(--lg-level) / var(--lg-default), 1);
  --lg-t2: max((var(--lg-level) - var(--lg-default)) / (1 - var(--lg-default)), 0);
  --lg-k: calc(var(--lg-t1) + 1.6 * var(--lg-t2));
  --lg-kb: calc(var(--lg-t1) + 0.5 * var(--lg-t2));

  --lg-rim: rgba(255, 255, 255, calc(0.92 * var(--lg-k)));
  --lg-rim-2: rgba(255, 255, 255, calc(0.42 * var(--lg-k)));
  --lg-glow: rgba(255, 255, 255, calc(0.2 * var(--lg-k)));
  --lg-drop: 0 14px 34px -14px rgba(24, 28, 48, 0.3);
  --lg-edge-light: inset 1.5px 1.5px 0 -0.5px var(--lg-rim), inset -1px -1px 0 -0.5px var(--lg-rim-2), inset 0 0 22px var(--lg-glow);
  --lg-depth: inset 0 1px 0 rgba(255, 255, 255, calc(0.9 * var(--lg-k))), inset 0 -1px 0 rgba(255, 255, 255, calc(0.3 * var(--lg-k))), inset 0 -16px 26px -20px rgba(60, 40, 20, calc(0.2 * var(--lg-k))), inset 0 14px 24px -18px rgba(255, 255, 255, calc(0.55 * var(--lg-k)));
  --lg-ring-w: calc(1px + 0.5px * var(--lg-k));
  --lg-ring: conic-gradient(from 45deg, rgba(255, 255, 255, calc(0.16 * var(--lg-k))) 0deg, rgba(255, 255, 255, calc(0.7 * var(--lg-k))) 90deg, rgba(255, 255, 255, calc(0.16 * var(--lg-k))) 180deg, rgba(255, 255, 255, calc(1 * var(--lg-k))) 270deg, rgba(255, 255, 255, calc(0.16 * var(--lg-k))) 360deg);
  --lg-spec: radial-gradient(240px circle at var(--mx, 22%) var(--my, -40%), rgba(255, 255, 255, calc(0.42 * var(--lg-k))), rgba(255, 255, 255, 0) 62%);
  --lg-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --lg-dock-y: 16px;
}
html[data-variant][data-theme="dark"] {
  --lg-rim: rgba(255, 255, 255, calc(0.34 * var(--lg-k)));
  --lg-rim-2: rgba(255, 255, 255, calc(0.1 * var(--lg-k)));
  --lg-glow: rgba(255, 255, 255, calc(0.05 * var(--lg-k)));
  --lg-drop: 0 16px 40px -14px rgba(0, 0, 0, 0.72);
  --lg-depth: inset 0 1px 0 rgba(255, 255, 255, calc(0.22 * var(--lg-k))), inset 0 -1px 0 rgba(255, 255, 255, calc(0.06 * var(--lg-k))), inset 0 -16px 26px -20px rgba(0, 0, 0, calc(0.5 * var(--lg-k))), inset 0 14px 24px -18px rgba(255, 255, 255, calc(0.12 * var(--lg-k)));
  --lg-ring: conic-gradient(from 45deg, rgba(255, 255, 255, calc(0.05 * var(--lg-k))) 0deg, rgba(255, 255, 255, calc(0.24 * var(--lg-k))) 90deg, rgba(255, 255, 255, calc(0.05 * var(--lg-k))) 180deg, rgba(255, 255, 255, calc(0.4 * var(--lg-k))) 270deg, rgba(255, 255, 255, calc(0.05 * var(--lg-k))) 360deg);
  --lg-spec: radial-gradient(240px circle at var(--mx, 22%) var(--my, -40%), rgba(255, 255, 255, calc(0.14 * var(--lg-k))), rgba(255, 255, 255, 0) 62%);
}

/* No glass at all: at 0% nothing bends or blurs (the fills are already opaque). */
html[data-variant][data-lg-off] *, html[data-variant][data-lg-off] *::before, html[data-variant][data-lg-off] *::after { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }

/* Pressing a glass control swells it slightly, then it settles: the liquid response. */
html[data-variant] .btn:active:not(:disabled),
html[data-variant] .nav-link:active,
html[data-variant] .tab:active,
html[data-variant] .preview-chip:active { transform: scale(1.04); transition: transform var(--m-fast) var(--lg-spring); }

/* ---- rings of light (variants that ask for them) ------------------------------------------- */

html.lg-rings :is(.card, .metric-card, .caught-up, .skel-card, .empty, .error-state, .banner, .signin-card, .preview-chip.is-bar, .segmented, .acct-grid) { position: relative; }
html.lg-rings :is(.side, .card, .metric-card, .act-card, .caught-up, .skel-card, .empty, .error-state, .banner, .signin-card, .tabbar, .topbar, .account-menu, .dlg, .preview-chip, .lg-dock, .btn-glass, .btn-outline, .segmented, .acct-grid, .lg-toolbar)::after {
  content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  border-radius: inherit; padding: var(--lg-ring-w);
  background: var(--lg-ring);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
html.lg-rings :is(.card, .caught-up) :is(.empty, .error-state)::after { content: none; }

/* ---- the liquid capsule (variants that ask for it) ------------------------------------------
   The capsule behind the current page stretches toward the new page, leading edge first, and
   the trailing edge follows, like a drop of liquid. liquid.js marks the direction. */

html.lg-goo .side .nav-list::before {
  --lg-top: var(--ind-y, 0px);
  --lg-bot: var(--ind-y, 0px);
  transform: translateY(min(var(--lg-top), var(--lg-bot)));
  height: calc(var(--ind-h, 44px) + max(var(--lg-top) - var(--lg-bot), var(--lg-bot) - var(--lg-top)));
}
html.lg-goo .portal[data-ind] .side .nav-list::before { transition: --lg-top 320ms cubic-bezier(0.3, 0.7, 0.2, 1), --lg-bot 320ms cubic-bezier(0.3, 0.7, 0.2, 1), opacity var(--m-fast) var(--ease); }
html.lg-goo .portal[data-ind] .side .nav-list[data-dir="down"]::before { transition: --lg-bot 230ms cubic-bezier(0.3, 0.8, 0.2, 1), --lg-top 480ms cubic-bezier(0.55, 0, 0.2, 1), opacity var(--m-fast) var(--ease); }
html.lg-goo .portal[data-ind] .side .nav-list[data-dir="up"]::before { transition: --lg-top 230ms cubic-bezier(0.3, 0.8, 0.2, 1), --lg-bot 480ms cubic-bezier(0.55, 0, 0.2, 1), opacity var(--m-fast) var(--ease); }

/* ---- the "Liquid glass" slider ---------------------------------------------------------------- */

.lg-dock {
  position: fixed; right: var(--lg-dock-x, 16px); bottom: var(--lg-dock-y); z-index: 56;
  width: 318px; padding: 6px 8px 4px 16px; border-radius: 24px;
  border: 1px solid var(--p-glass-edge);
  background-color: var(--p-glass-strong); background-image: var(--lg-spec);
  box-shadow: var(--lg-edge-light), var(--lg-drop);
  -webkit-backdrop-filter: var(--p-glass-blur); backdrop-filter: var(--p-glass-blur);
  color: var(--p-ink); font-size: 14px; line-height: 1.3;
}
.lg-dock-head { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.lg-dock-head > .i { width: 18px; height: 18px; color: var(--p-ink-2); }
.lg-dock-title { font-size: 14.5px; font-weight: 650; white-space: nowrap; }
.lg-dock-val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lg-dock-min { display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--p-ink-2); cursor: pointer; }
.lg-dock-min:hover { background: var(--p-hover); color: var(--p-ink); }
.lg-dock-min .i { width: 18px; height: 18px; transition: rotate var(--m) var(--ease); }
.lg-dock-min[aria-expanded="false"] .i { rotate: 180deg; }
.lg-dock-body { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0; }
.lg-dock-end { flex: none; font-size: 12.5px; font-weight: 600; color: var(--p-ink-2); white-space: nowrap; }
.lg-dock-track { position: relative; flex: 1; min-width: 0; }
.lg-range { --lg-pct: 50%; display: block; width: 100%; height: 36px; margin: 0; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
.lg-range::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--p-ink) 0 var(--lg-pct), var(--p-line-2) var(--lg-pct) 100%); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.14); }
.lg-range::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--p-ink) 0 var(--lg-pct), var(--p-line-2) var(--lg-pct) 100%); }
.lg-range::-webkit-slider-thumb {
  width: 28px; height: 28px; margin-top: -10px; border: 0; border-radius: 50%; -webkit-appearance: none; appearance: none;
  background: radial-gradient(circle at 34% 28%, #FFFFFF 0 22%, rgba(255, 255, 255, 0.78) 46%, rgba(236, 240, 248, 0.6) 100%);
  box-shadow: inset 1.5px 1.5px 0 -0.5px #FFFFFF, inset -1px -1px 0 -0.5px rgba(255, 255, 255, 0.5), 0 0 0 1px rgba(20, 22, 30, 0.22), 0 6px 14px -4px rgba(20, 24, 40, 0.42);
}
.lg-range::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #FFFFFF 0 22%, rgba(255, 255, 255, 0.78) 46%, rgba(236, 240, 248, 0.6) 100%); box-shadow: 0 0 0 1px rgba(20, 22, 30, 0.22), 0 6px 14px -4px rgba(20, 24, 40, 0.42); }
.lg-range:focus-visible { outline: 2px solid var(--p-focus); outline-offset: 2px; border-radius: 8px; }
/* A notch on the track at the design's own level. */
.lg-dock-mark { position: absolute; top: 6px; left: calc(14px + (100% - 28px) * var(--at) / 100); width: 2px; height: 6px; margin-left: -1px; border-radius: 1px; background: var(--p-ink-2); pointer-events: none; }
.lg-dock-reset { margin-left: auto; min-height: 30px; padding: 2px 8px; border: 0; border-radius: 999px; background: none; color: var(--p-ink); font-size: 13px; font-weight: 650; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--p-line-2); cursor: pointer; }
.lg-dock-reset:hover { background: var(--p-hover); text-decoration-color: currentColor; }
.lg-dock-reset:disabled { color: var(--p-ink-2); font-weight: 600; text-decoration: none; cursor: default; background: none; }
.lg-dock-calm { flex-basis: 100%; margin: 0 0 6px; font-size: 13px; color: var(--p-ink-2); }
.lg-dock-body:has(.lg-dock-calm) { flex-wrap: wrap; }
/* The prism switch (D8VARIANT.prismToggle): a row of its own under the slider. */
.lg-dock-body:has(.lg-dock-switch) { flex-wrap: wrap; row-gap: 4px; padding-bottom: 6px; }
.lg-dock-switch { position: relative; flex-basis: 100%; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 2px; font-size: 13.5px; font-weight: 600; color: var(--p-ink); cursor: pointer; }
.lg-dock-switch input { position: absolute; left: 2px; width: 34px; height: 20px; margin: 0; opacity: 0; cursor: pointer; }
.lg-switch { position: relative; flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--p-line-2); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.14); transition: background-color var(--m-fast) var(--ease); }
.lg-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(20, 22, 30, 0.16), 0 2px 5px -1px rgba(20, 24, 40, 0.4); transition: transform var(--m-fast) var(--ease); }
.lg-dock-switch input:checked + .lg-switch { background: conic-gradient(from 20deg, #E5484D, #E8A21A, #2F9E6B, #3A7FE0, #8A5CF0, #E5484D); }
.lg-dock-switch input:checked + .lg-switch::after { transform: translateX(14px); }
.lg-dock-switch input:focus-visible + .lg-switch { outline: 2px solid var(--p-focus); outline-offset: 2px; }
.lg-switch-note { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--p-ink-2); }
.lg-dock:not([data-open]) { width: auto; padding-right: 4px; border-radius: 999px; }
.lg-dock:not([data-open]) .lg-dock-body, .lg-dock:not([data-open]) .lg-dock-reset { display: none; }
.lg-dock:not([data-open]) .lg-dock-min { margin-left: 2px; }
html[data-variant] .toasts { bottom: calc(var(--lg-dock-y) + 104px); }
.portal.is-auth ~ .lg-dock { bottom: 16px; }

/* Toolbars and ornaments injected by some variants start hidden on phones. */
@media (max-width: 760px) {
  html[data-variant] .lg-toolbar, html[data-variant] .lg-ornament { display: none !important; }
  .lg-dock { right: 12px; bottom: calc(92px + env(safe-area-inset-bottom)); width: min(296px, calc(100vw - 24px)); }
  html[data-variant] .toasts { bottom: calc(150px + env(safe-area-inset-bottom)); }
  html[data-variant] .main { padding-bottom: calc(164px + env(safe-area-inset-bottom)); }
}
@media (pointer: coarse) {
  .lg-dock-min { width: 44px; height: 44px; }
  .lg-dock-reset { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  html[data-variant] .btn:active:not(:disabled), html[data-variant] .nav-link:active, html[data-variant] .tab:active { transform: none; }
}
/* Less transparency asked for: the glass is off whatever the slider says. */
@media (prefers-reduced-transparency: reduce) {
  html[data-variant] { --lg-level: 0 !important; }
  html[data-variant] .lg-toolbar, html[data-variant] .lg-ornament { background: var(--p-surface) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@media (forced-colors: active) {
  .lg-dock { border: 1px solid CanvasText; }
  html.lg-rings :is(.side, .card, .metric-card, .act-card, .caught-up, .tabbar, .topbar, .dlg, .preview-chip, .lg-dock, .btn-glass, .segmented)::after { display: none; }
}

/* ================================================================ shared heavy glass (16F to 16J) */
/*
 * Heavy Liquid Glass, shared by 16F to 16J (variant.json "heavy": true). Every glass surface is a
 * thick pane: its own refraction lens (liquid.js draws one for each size: the rim bends what is
 * behind it, the middle is frosted for reading), a lit top face and a shaded lower edge
 * (--lg-depth), a ring of light on the rim, a highlight that follows the pointer and a soft drop
 * shadow. Each variant brings the world behind the glass, the tint, the lens strength and its
 * own take on the left-hand navigation. All of it follows the "Liquid glass" slider.
 */

/* ---- the panes -------------------------------------------------------------------------------- */

html.lg-heavy :is(.card, .metric-card, .act-card, .caught-up, .skel-card, .banner, .signin-card, .error-state, .empty) {
  border-color: var(--p-glass-edge);
  background-color: var(--p-glass);
  background-image: var(--lg-spec);
  box-shadow: var(--lg-depth), var(--lg-edge-light), var(--lg-drop);
}
html.lg-heavy :is(.card, .caught-up) :is(.empty, .error-state) { border: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
html.lg-heavy .act-card.sev-critical { background-image: var(--lg-spec), linear-gradient(100deg, var(--p-crit-bg), transparent 55%); border-color: var(--p-crit-line); }
html.lg-heavy .banner { background-image: var(--lg-spec), linear-gradient(100deg, var(--p-crit-bg), transparent 70%); border-color: var(--p-crit-line); }
html.lg-heavy .acct-grid { background-color: var(--p-glass-soft); box-shadow: var(--lg-depth), var(--lg-edge-light), var(--lg-drop); }
html.lg-heavy :is(.side, .topbar, .tabbar, .dlg, .account-menu, .preview-chip, .lg-dock, .rail-tip) {
  border-color: var(--p-glass-edge);
  background-color: var(--p-glass-strong);
  background-image: var(--lg-spec);
  box-shadow: var(--lg-depth), var(--lg-edge-light), var(--lg-drop);
}
@media (hover: hover) {
  html.lg-heavy .is-link:hover,
  html.lg-heavy .act-card:hover { box-shadow: var(--lg-depth), var(--lg-edge-light), var(--p-shadow-lift); }
}

/* Real refraction (Chromium): each pane bends what is behind it through its own lens. */
html.has-lens.lg-heavy :is(.side, .card, .metric-card, .act-card, .caught-up, .skel-card, .banner, .signin-card, .acct-grid, .topbar, .tabbar, .dlg, .account-menu, .preview-chip, .lg-dock, .btn-glass, .btn-outline, .status-chip, .jump-link, .segmented) {
  -webkit-backdrop-filter: var(--lg-lens, blur(calc(14px * var(--lg-kb)))) saturate(calc(100% + 75% * var(--lg-k)));
  backdrop-filter: var(--lg-lens, blur(calc(14px * var(--lg-kb)))) saturate(calc(100% + 75% * var(--lg-k)));
}
html.has-lens.lg-heavy :is(.card, .caught-up) :is(.empty, .error-state) { -webkit-backdrop-filter: none; backdrop-filter: none; }

/* ---- the current page: a thick capsule that magnifies what is under it ------------------------ */

html.lg-heavy .nav-list::before {
  border-radius: 999px;
  background: var(--p-active);
  box-shadow: var(--lg-depth), var(--lg-edge-light), 0 8px 18px -10px rgba(24, 28, 48, 0.4);
}
html.has-lens.lg-heavy .nav-list::before { backdrop-filter: url(#lg-zoom) url(#lg-edge-strong) saturate(calc(100% + 70% * var(--lg-k))); }
html.lg-heavy .nav-link { border-radius: 999px; }
html.lg-heavy .identity { border-radius: 999px; box-shadow: var(--lg-edge-light); }
html.lg-heavy .identity-avatar { border-radius: 50%; background-image: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 50%); box-shadow: var(--lg-edge-light), inset 0 0 0 1px var(--p-line), 0 6px 14px -8px rgba(24, 28, 48, 0.4); }

/* ---- controls: capsules of glass ------------------------------------------------------------- */

html.lg-heavy :is(.btn, .btn-sm, .btn-text, .status-chip, .jump-link, .src-chip, .sev-chip) { border-radius: 999px; }
html.lg-heavy :is(.btn-glass, .btn-outline, .jump-link) {
  background-color: var(--p-glass-strong); background-image: var(--lg-spec);
  border-color: var(--p-glass-edge);
  box-shadow: var(--lg-depth), var(--lg-edge-light), 0 6px 16px -8px rgba(24, 28, 48, 0.3);
}
html.lg-heavy .btn-primary {
  background-image: var(--lg-spec), linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0) 55%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65), inset 0 -10px 16px -12px rgba(120, 30, 0, 0.4), 0 10px 22px -10px rgba(255, 91, 31, 0.65);
}
html.lg-heavy .btn-tint { background-image: var(--lg-spec); box-shadow: var(--lg-depth), var(--lg-edge-light), 0 8px 18px -10px rgba(99, 88, 230, 0.45); }
html.lg-heavy .btn-solid { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.26), 0 8px 18px -10px rgba(0, 0, 0, 0.5); }
html.lg-heavy .status-chip { box-shadow: var(--lg-edge-light), inset 0 0 0 1px var(--p-conn-line); }
html.lg-heavy .act-icon { border-radius: 50%; background-image: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 48%); box-shadow: var(--lg-edge-light), inset 0 0 0 1px var(--sev-line, var(--p-line)), 0 6px 14px -8px rgba(24, 28, 48, 0.4); }
html.lg-heavy .segmented { border-radius: 999px; background-color: var(--p-glass-soft); box-shadow: var(--lg-depth), var(--lg-edge-light); }
html.lg-heavy .seg span { border-radius: 999px; }
html.lg-heavy .seg input:checked + span { background: var(--p-active); box-shadow: var(--lg-depth), var(--lg-edge-light), 0 6px 14px -6px rgba(24, 28, 48, 0.35), inset 0 0 0 1.5px var(--p-ink); }
html.has-lens.lg-heavy .seg input:checked + span { backdrop-filter: url(#lg-zoom) saturate(calc(100% + 60% * var(--lg-k))); }
html.lg-heavy .preview-chip.is-float { border-style: solid; border-radius: 999px; }
html.lg-heavy .dlg { border-radius: 30px; }
html.lg-heavy .account-menu { border-radius: 22px; }

/* In the dark, the lit faces dim and the panes keep their depth. */
html.lg-heavy[data-theme="dark"] .identity-avatar,
html.lg-heavy[data-theme="dark"] .act-icon { background-image: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 48%); }

/* ---- phones: the tab bar is one thick capsule with a lens that slides to the page ------------- */

@media (max-width: 760px) {
  html.lg-heavy .topbar { border-width: 0 0 1px; border-radius: 0 0 26px 26px; }
  html.lg-heavy .tabbar { border-radius: 999px; }
  html.lg-heavy .tabbar::before {
    content: ""; position: absolute; top: 6px; bottom: 6px; left: 0; z-index: 0;
    width: var(--tab-w, 0); transform: translateX(var(--tab-x, 0)); opacity: var(--tab-o, 0);
    border-radius: 999px; background: var(--p-active);
    box-shadow: var(--lg-depth), var(--lg-edge-light), 0 4px 12px -6px rgba(20, 24, 40, 0.35);
  }
  html.lg-heavy .portal[data-ind] .tabbar::before { transition: transform var(--m-slow) var(--lg-spring), width var(--m) var(--ease), opacity var(--m-fast) var(--ease); }
  html.has-lens.lg-heavy .tabbar::before { backdrop-filter: url(#lg-zoom) saturate(calc(100% + 60% * var(--lg-k))); }
  html.lg-heavy .tab { z-index: 1; border-radius: 999px; }
  html.lg-heavy .tab[aria-current="page"] { background: none; box-shadow: none; }
}

/* ---- the world behind the glass -------------------------------------------------------------- */

/* ================================================================ shared living flow (18A to 18E) */
/*
 * Living flow: shared by 18A to 18E (variant.json "flow": true). Two things Karan asked for on
 * every one of them:
 * 1. The sidebar is fixed on the left with everything together (Home, Work, Results, Updates,
 *    Billing, then Settings, Help and Sign out directly under them), so Settings and Sign out
 *    are always in reach without scrolling the page. It is a compact floating panel, as tall as
 *    its contents; a base variant that centres its rail (16B, 16J) is brought back to the top
 *    unless the variant decides otherwise.
 * 2. The world behind the glass moves, and changes with the page: app.js writes the page's name
 *    to html[data-page] (home, work, results, updates, billing, settings, help, sign-in,
 *    notFound), and each variant composes its .lg-world per page. Elements crossfade and drift
 *    between pages rather than snapping. Motion stops for anyone who asks for less of it.
 */

html.lg-flow { --lg-dock-y: 16px; }

/* ---- the sidebar: fixed, compact, everything together --------------------------------------- */

@media (min-width: 761px) {
  html.lg-flow .side {
    position: fixed; top: 16px; left: 16px; bottom: auto; z-index: 22;
    height: auto; max-height: calc(100vh - 32px); margin: 0;
    transform: none; translate: none;

/* ---- the world: moving, and different on every page --------------------------------------------- */

html.lg-flow body::before { display: none; }

html.lg-flow .lg-world > i {

  transition: opacity 1.4s var(--ease), left 1.4s var(--ease), top 1.4s var(--ease), right 1.4s var(--ease), bottom 1.4s var(--ease), width 1.4s var(--ease), height 1.4s var(--ease), background-color 1.4s var(--ease), filter 1.4s var(--ease);
}
/* Anything a page does not use fades out rather than vanishing. */
html.lg-flow .lg-world > i.is-off { opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  html.lg-flow .lg-world, html.lg-flow .lg-world * { animation: none !important; transition: none !important; }
}
@media (forced-colors: active) {
  html.lg-flow .lg-world { display: none; }
}

/* ================================================================ 18H Scenes */
/*
 * 18H Scenes, the final design of the client portal, self-contained. The build reads this file first
 * and then every other stylesheet here in name order, each a layer this design was built from, with
 * its selectors already written for 18H:
 *   1-16j-flow.css            16J Flow: the heavy clear glass and the liquid rail
 *   2-18d-flow.css            18D Flow: the fixed panel with labels, the current of colour (now unused)
 *   3-18f-skylight.css        18F Skylight: the skies (Scenes), the sky inks, one drop for the panel
 *   4-18f-skylight-results.css  18F's Results sky, the northern lights (made by an archived tool)
 *   5-18h-scenes.css          18H: the dot grid (Static), the dot sliders, Scenes / Static in Settings
 * The scripts follow the same order (1-, 2-, 3-, then variant.js), each run in its own script block.
 */

/* 18h-scenes/1-16j-flow.css */
/*
 * 16J Flow. Very clear glass over flowing colour, and controls that behave like liquid. Behind
 * the portal, large pools of orange, rose, amber, lilac and peach drift and swell slowly; the
 * glass is the clearest of the five (the least frost), so the colour moves through every pane
 * and bends hard at the rims. Navigation: a floating capsule of icons on the left, centred in
 * the window, with labels beside the icons on hover; the current page sits in a drop of glass
 * that stretches toward a new page, and a second drop follows the pointer, pulling away from
 * it on a thread of liquid before it snaps free. Dark: the same colours glowing in the dark.
 */

html[data-variant="18h"] {
  --p-bg: #F6EEE6;
  --p-amb-warm: rgba(255, 170, 110, 0.3);
  --p-amb-cool: rgba(255, 255, 255, 0);
  --p-amb-peach: rgba(255, 255, 255, 0);
  --p-glass: rgba(255, 255, 255, calc(1 - 0.58 * var(--lg-t1) - 0.189 * var(--lg-t2)));
  --p-glass-strong: rgba(255, 255, 255, calc(1 - 0.48 * var(--lg-t1) - 0.234 * var(--lg-t2)));
  --p-glass-soft: rgba(255, 255, 255, calc(1 - 0.66 * var(--lg-t1) - 0.153 * var(--lg-t2)));
  --p-glass-edge: rgba(255, 255, 255, calc(0.76 * var(--lg-k)));
  --p-active: rgba(255, 255, 255, 0.88);
  --p-ink-2: #4A443D;
  --p-ink-3: #4F4942;
  --p-accent-ink: #9A3208;
  /* The colour at its lightest (cream between the pools) and deepest (the rose pool). */
  --p-env-light: #FFF7EE;
  --p-env-dark: #FF78A0;
  --p-env-veil: rgba(250, 244, 238, 0.4);
  --p-r-lg: 28px;
  --p-r-xl: 34px;
  --j-1: 255, 122, 61;
  --j-2: 255, 120, 160;
  --j-3: 255, 194, 74;
  --j-4: 168, 150, 255;
  --j-5: 255, 170, 130;
  --j-a: 0.9;
}
html[data-variant="18h"][data-theme="dark"] {
  --p-bg: #120F16;
  --p-amb-warm: rgba(255, 120, 60, 0.14);
  --p-glass: rgba(18, 15, 24, calc(1 - 0.38 * var(--lg-t1) - 0.279 * var(--lg-t2)));
  --p-glass-strong: rgba(17, 14, 22, calc(1 - 0.3 * var(--lg-t1) - 0.315 * var(--lg-t2)));
  --p-glass-soft: rgba(28, 24, 36, calc(1 - 0.48 * var(--lg-t1) - 0.234 * var(--lg-t2)));
  --p-glass-edge: rgba(255, 255, 255, calc(0.14 * var(--lg-k)));
  --p-active: rgba(255, 255, 255, 0.14);
  --p-ink-2: #D3CEC6;
  --p-ink-3: #C0BBB3;
  --p-accent-ink: #FFA57F;
  --p-env-light: #8D6122;
  --p-env-dark: #0E0B12;
  --p-env-veil: rgba(10, 8, 12, 0.38);
  --j-1: 255, 110, 50;
  --j-2: 220, 70, 130;
  --j-3: 205, 140, 40;
  --j-4: 110, 90, 230;
  --j-5: 200, 110, 80;
  --j-a: 0.66;
}

/* ---- the flowing colour ------------------------------------------------------------------------- */

html[data-variant="18h"] .lg-world > i { border-radius: 50%; will-change: transform; animation-duration: 38s; animation-timing-function: steps(285); animation-iteration-count: infinite; animation-direction: alternate; }
html[data-variant="18h"] .w-b1 { left: -14vmax; top: -20vmax; width: 64vmax; height: 64vmax; background: radial-gradient(closest-side, rgba(var(--j-1), var(--j-a)) 0 62%, rgba(var(--j-1), 0) 74%); animation-name: j-1; }

html[data-variant="18h"] .w-b4 { right: 4vw; bottom: -14vmax; width: 40vmax; height: 40vmax; background: radial-gradient(closest-side, rgba(var(--j-4), var(--j-a)) 0 62%, rgba(var(--j-4), 0) 74%); animation-name: j-4; animation-duration: 34s; }

@keyframes j-2 { 50% { transform: translate(-12vw, 14vh) scale(0.92); } to { transform: translate(-4vw, 30vh) scale(1.06); } }

/* ---- the liquid rail ------------------------------------------------------------------------------ */

@media (min-width: 761px) {
  html[data-variant="18h"] .side {
    position: fixed; left: 18px; top: 50%; translate: 0 -50%; z-index: 22;

/* 18h-scenes/2-18d-flow.css */
/*
 * 18D Flow. Built from 16J: the clearest glass of the series, and navigation that behaves like
 * liquid. Two things change. The rail becomes a compact fixed panel with labels beside the
 * icons, pinned to the top left, all eight items together, and the liquid layer still draws the
 * capsule behind the current page and the drop that follows the pointer. And the world is no
 * longer a set of pools that drift about: it is a current. Pools travel steadily in one
 * direction and come round again, each page with its own palette and its own direction of flow:
 * Home rises to the right, Work runs right, Results rises, Updates runs left, Billing sinks slowly
 * to the right, Settings barely drifts, Help turns in a slow swirl. Dark: the same currents
 * glowing in the dark.
 */

html[data-variant="18h"] {
  --p-bg: #F7EFE7;
  /* The cream between the pools, and the deepest pool (Results' indigo at full strength). */
  --p-env-light: #FFF8F0;
  --p-env-dark: #8F89EF;
  --p-env-veil: rgba(250, 244, 238, 0.42);
  --p-side-full: 236px;
  --d-a: 0.9;
  /* The palettes, one pair per page. */
  --d-peach: 255, 170, 120;
  --d-rose: 255, 128, 162;
  --d-teal: 96, 172, 166;
  --d-amber: 255, 178, 78;
  --d-indigo: 132, 126, 240;
  --d-sage: 156, 194, 148;
  --d-apricot: 255, 168, 112;
  --d-lavender: 180, 158, 242;
  --d-gold: 240, 196, 92;
  --d-stone: 198, 184, 166;
  --d-blue: 156, 194, 236;
  --d-blush: 255, 176, 194;
  --d-peach-2: 255, 194, 148;
}
html[data-variant="18h"][data-theme="dark"] {
  --p-bg: #120F16;
  --p-env-light: #AE6D47;
  --p-env-dark: #0E0B12;
  --p-env-veil: rgba(10, 8, 12, 0.38);
  --p-side-full: 236px;
  --d-a: 0.72;
  --d-peach: 235, 125, 70;
  --d-rose: 225, 75, 130;
  --d-teal: 45, 150, 145;
  --d-amber: 220, 145, 40;
  --d-indigo: 105, 90, 235;
  --d-sage: 85, 150, 100;
  --d-apricot: 230, 125, 70;
  --d-lavender: 135, 105, 230;
  --d-gold: 215, 155, 45;
  --d-stone: 135, 120, 105;
  --d-blue: 75, 125, 200;
  --d-blush: 225, 105, 135;
  --d-peach-2: 235, 145, 90;
}

/* ---- the current ---------------------------------------------------------------------------- */

/* Each pool is a positioned box (its place, size and colour belong to one page) that carries two
   copies of the same travelling pool, half a cycle apart, so one is always on screen while the
   other fades out at the end of its path and comes round again. Pages crossfade their sets. */
html[data-variant="18h"] .lg-world > i {
  --play: paused; --wc: auto; --ph: 0; --dur: 50s; --tf: steps(600);
  opacity: 0; visibility: hidden; border-radius: 0; animation: none; will-change: auto;
  transition: opacity 1.4s var(--ease), left 1.4s var(--ease), top 1.4s var(--ease), right 1.4s var(--ease), bottom 1.4s var(--ease), width 1.4s var(--ease), height 1.4s var(--ease), background-color 1.4s var(--ease), filter 1.4s var(--ease), visibility 0s linear 1.4s;
}
html[data-variant="18h"] .lg-world > i::before,
html[data-variant="18h"] .lg-world > i::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; will-change: var(--wc);
  background: radial-gradient(closest-side, rgba(var(--c), var(--d-a)) 0 42%, rgba(var(--c), 0) 74%);
  animation: var(--path) var(--dur) var(--tf) infinite;
  animation-delay: calc(var(--dur) * var(--ph) * -1);
  animation-play-state: var(--play);
}
html[data-variant="18h"] .lg-world > i::after { animation-delay: calc(var(--dur) * (var(--ph) + 0.5) * -1); }

@keyframes d-up-right { 0% { transform: translate(-30vw, 34vh); opacity: 0; } 18% { opacity: 1; } 82% { opacity: 1; } 100% { transform: translate(30vw, -34vh); opacity: 0; } }
@keyframes d-right { 0% { transform: translate(-58vw, 0); opacity: 0; } 18% { opacity: 1; } 82% { opacity: 1; } 100% { transform: translate(58vw, 0); opacity: 0; } }

html[data-variant="18h"] .w-h1 { --c: var(--d-peach); left: -12vw; top: 28vh; width: 62vmax; height: 62vmax; --path: d-up-right; --dur: 50s; --tf: steps(600); }
html[data-variant="18h"] .w-h2 { --c: var(--d-rose); left: 44vw; top: -28vh; width: 56vmax; height: 56vmax; --path: d-up-right; --dur: 56s; --tf: steps(672); --ph: 0.3; }
html[data-variant="18h"] .w-h3 { --c: var(--d-peach); left: 26vw; top: 56vh; width: 38vmax; height: 38vmax; --path: d-up-right; --dur: 46s; --tf: steps(552); --ph: 0.65; }

html[data-variant="18h"] .w-k3 { --c: var(--d-teal); left: 58vw; top: 12vh; width: 34vmax; height: 34vmax; --path: d-right; --dur: 46s; --tf: steps(552); --ph: 0.7; }

html[data-variant="18h"] .w-g1 { --c: var(--d-lavender); left: -8vw; top: -32vh; width: 62vmax; height: 62vmax; --path: d-down-right; --dur: 58s; --tf: steps(696); }
html[data-variant="18h"] .w-g2 { --c: var(--d-gold); left: 48vw; top: 26vh; width: 54vmax; height: 54vmax; --path: d-down-right; --dur: 60s; --tf: steps(720); --ph: 0.35; }
html[data-variant="18h"] .w-g3 { --c: var(--d-lavender); left: 28vw; top: 58vh; width: 36vmax; height: 36vmax; --path: d-down-right; --dur: 54s; --tf: steps(648); --ph: 0.7; }
/* Settings: stone and pale blue, a slow drift. */

/* 18h-scenes/3-18f-skylight.css */
/*
 * 18F Skylight. Built from 18D Flow: the same clear glass, the same fixed panel of labelled
 * navigation and the same liquid behaviour, under a sky instead of a current of colour.
 * The sky: four hours from 18A Window (Work late morning, Updates dusk, Billing evening with the
 * lights coming on, Settings night with the moon and stars) and three new places: Home is blue hour
 * above the clouds, a sea of slate cloud drifting under a fading crescent while dawn warms the
 * horizon; Results is the northern lights, curtains of green and violet swaying over a dark ridge;
 * Help is dawn on a lake, mist drifting over still water. Sign-in and not found share Home. Dark:
 * the same places after dark.
 * The page sits straight on the sky, as 18D's does on its current: cards and controls are glass,
 * and the page's own words (its title, introduction, headings and notes) sit on the sky itself. On
 * the two light skies (Work, Help) they are dark; over the five deep ones they turn light and the
 * cards are frosted thickly, so the content stands out and text keeps 4.5:1 on every page.
 * The panel: one drop of liquid for every button in it (18D's covered the five main pages).
 * The account team is drawn with the horizontal mark, not the vertical "8".
 * Prism rims: a preview switch in the glass dock (liquid.js) splits the colours at every rim and
 * turns each ring of light into a spectrum, as on 18C.
 */

/* ---- tokens --------------------------------------------------------------------------------- */

/* The grounds: the sky itself, measured where text can sit by tools/skycheck.js (every page, both
   themes, desktop and phone, five moments each). The light pair is Work's and Help's, the two light
   skies where the words are dark; the five deep skies are checked by skycheck against their own
   light words (see "text straight on the sky"). After dark: the darkest and brightest spots of all
   seven. The veil is zero: nothing lies between the sky and the page. */
html[data-variant="18h"] {
  --p-bg: #E9ECF2;
  --p-env-light: #FDFEFF;
  --p-env-dark: #B2C1C6;
  --p-env-veil: rgba(246, 242, 236, 0);
}
html[data-variant="18h"][data-theme="dark"] {
  --p-bg: #0E0F18;
  --p-env-light: #764560;
  --p-env-dark: #0C1121;
  --p-env-veil: rgba(14, 13, 20, 0);
}

/* ---- the sky --------------------------------------------------------------------------------- */

/* 18D's current is switched off: its pools hang off every piece of the world as ::before and
   ::after, so the pseudo-elements go and each piece is shown plainly. */
html[data-variant="18h"] .lg-world > i {
  opacity: 1; visibility: visible; border-radius: 0; animation: none; will-change: auto;
  transition: opacity 1.4s var(--ease), left 1.4s var(--ease), top 1.4s var(--ease), right 1.4s var(--ease), bottom 1.4s var(--ease), width 1.4s var(--ease), height 1.4s var(--ease), background-color 1.4s var(--ease), filter 1.4s var(--ease);
}

html[data-variant="18h"] .lg-world > i::after { content: none; }

   Home is the default (sign-in and not found share it). Solid colours transition (flow.css);

/* Over the five deep skies (light theme; after dark every page already has light text) the page's
   words turn light and the cards are frosted thickly: the content stands out, and dark text on the
   cards reads even with the glass slider at 100%. Home's sky also covers sign-in and not found. */
html[data-variant="18h"]:not([data-theme="dark"]):is(:not([data-page]), [data-page="home"], [data-page="sign-in"], [data-page="notFound"], [data-page="results"], [data-page="updates"], [data-page="billing"], [data-page="settings"]) {
  --k-sky-ink: #FAF8F5; --k-sky-ink-2: #F1EEF8; --k-sky-ink-3: #E9E5F4;
  --k-sky-accent: #FFE4D4; --k-sky-focus: #FAF8F5; --k-sky-line: rgba(255, 255, 255, 0.3); --k-sky-line-2: rgba(255, 255, 255, 0.5);
  --p-glass: rgba(255, 255, 255, calc(1 - 0.22 * var(--lg-t1) - 0.351 * var(--lg-t2)));
  --p-glass-strong: rgba(250, 250, 252, calc(1 - 0.16 * var(--lg-t1) - 0.378 * var(--lg-t2)));
  --p-glass-soft: rgba(255, 255, 255, calc(1 - 0.24 * var(--lg-t1) - 0.342 * var(--lg-t2)));
}
/* The page body is never seen (the sky covers it), but accessibility checkers read it as the ground of
   the words on the sky, because the sky takes no pointer events and so is invisible to them. On each
   deep sky it takes the lightest broad colour of that sky, so the check is against a real, strict ground. */

html[data-variant="18h"]:not([data-theme="dark"])[data-page="billing"] body { background-color: #5C5A98; }
html[data-variant="18h"]:not([data-theme="dark"])[data-page="settings"] body { background-color: #545899; }

/* Over the deep skies the words on the sky carry a soft dark shadow instead of the family's light

html[data-variant="18h"]:not([data-theme="dark"]):is(:not([data-page]), [data-page="home"], [data-page="sign-in"], [data-page="notFound"], [data-page="results"], [data-page="updates"], [data-page="billing"], [data-page="settings"]) :is(.page-head h1, .page-head .lede, .fresh-line, .sec-head h2, .sec-title, .sec-meta, .band-title, .range-text, .feed-month h2, .bill-help) { text-shadow: 0 1px 14px rgba(8, 10, 30, 0.5); }

/* ---- one drop of liquid for the whole panel ---------------------------------------------------- */

/* 16J's layer drew the capsule and the pointer drop over the five main pages only; Settings, Help,
   Sign out and Collapse had an ordinary capsule and no drop. variant.js draws one layer across the
   panel: the capsule reaches any current page, and the drop follows the pointer (or keyboard
   focus) over every button, pulling away from the capsule on a neck of liquid and snapping free. */
@media (min-width: 761px) {
  html[data-variant="18h"] .side .nav-list::before { display: none; }
  html[data-variant="18h"] .side .nav-link,
  html[data-variant="18h"] .side .nav-link:hover,
  html[data-variant="18h"] .side .nav-link[aria-current="page"] { background: none; }
  html[data-variant="18h"] .side .nav-link[aria-current="page"] .i { color: var(--p-accent-ink); }
  html[data-variant="18h"] .side > .k-goo { position: absolute; top: 0; left: 0; width: 100%; height: var(--goo-h, 100%); z-index: -1; pointer-events: none; filter: url(#lg-goo-l); }
  html[data-variant="18h"][data-theme="dark"] .side > .k-goo { filter: url(#lg-goo-d); }
  html[data-variant="18h"] .k-goo > i { position: absolute; top: 0; left: 0; display: block; border-radius: 999px; background: #FFFFFF; }
  /* The console's look: the current page and the pointer each get a glass pill, moved by springs in
     the script (no liquid filter, no stretching). */
  html[data-variant="18h"] .side > .k-goo { filter: none !important; }
  html[data-variant="18h"] .k-goo > .goo-cur {
    width: 44px; height: 44px; opacity: 0; transition: none !important; will-change: transform, width, height;
    background: rgba(255, 255, 255, 0.72);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), 0 4px 14px rgba(20, 20, 40, 0.1);
  }
  html[data-variant="18h"][data-theme="dark"] .k-goo > .goo-cur { background: rgba(255, 255, 255, 0.11); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 4px 14px rgba(0, 0, 0, 0.3); }
  /* The drop (collapsed) and the tab (expanded) are moved by a spring in variant.js, frame by frame,
     which sets their size, transform and opacity; nothing here animates them. */
  html[data-variant="18h"] .k-goo > .goo-hov { width: 44px; height: 44px; opacity: 0; will-change: transform; }
  html[data-variant="18h"] .side > .k-tab {
    position: absolute; top: 0; left: 0; z-index: -1; pointer-events: none; opacity: 0; will-change: transform;
    width: 200px; height: 44px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.5);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.85), 0 4px 14px rgba(20, 20, 40, 0.08);
  }
  html[data-variant="18h"][data-theme="dark"] .side > .k-tab {
    background: rgba(255, 255, 255, 0.07);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 4px 14px rgba(0, 0, 0, 0.3);
  }
}
@media (max-width: 760px) {
  html[data-variant="18h"] .side > .k-tab { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html[data-variant="18h"] .k-goo > .goo-hov { display: none; }
}
@media (forced-colors: active) {
  html[data-variant="18h"] .side > .k-goo, html[data-variant="18h"] .side > .k-tab { display: none; }
}

/* ---- prism rims (the preview switch in the glass dock) ------------------------------------------- */

/* With the switch on, liquid.js splits the colours at every rim (each lens has a prism strength)
   and the ring of light round every pane becomes a spectrum, as on 18C. */
html[data-variant="18h"].lg-prism {
  --lg-ring: conic-gradient(from 20deg, rgba(255, 90, 90, calc(0.55 * var(--lg-k))), rgba(255, 200, 70, calc(0.5 * var(--lg-k))), rgba(80, 220, 150, calc(0.45 * var(--lg-k))), rgba(80, 160, 255, calc(0.55 * var(--lg-k))), rgba(190, 110, 255, calc(0.5 * var(--lg-k))), rgba(255, 90, 90, calc(0.55 * var(--lg-k))));
  --lg-ring-w: calc(1px + 0.6px * var(--lg-k));
}
html[data-variant="18h"].lg-prism[data-theme="dark"] {

/* 18h-scenes/4-18f-skylight-results.css */
/*
 * 18F Skylight: the Results sky, kept in its own file (tools/build.js includes every *.css beside
 * variant.css, after it). The page's words over this sky are light and its cards frosted (the lists in
 * variant.css under "text straight on the sky"); override those here if this sky changes its depth.
 * This file is generated: edit tools/aurora/template.css or tools/aurora/params.js and run
 * node tools/aurora/generate.js (the curtains are SVG images drawn from the params).
 */

html[data-variant="18h"][data-page="results"] .lg-world {
  /* The northern lights: soft curtains of green light rising into teal and violet over a deep blue
     night, a dark ridge at the foot, stars. No clouds, and the flat ground gives way to the ridge.
     --aur-a switches the lights on (it is 0 on every other page, so a page change crossfades them);
     --aur-i is their strength, kept low enough behind the content column for the light words; --aur-f is
     the strength of their bright left end, which only shows where text never sits. */
  --sky-up: #1F2B55; --sky-low: #1F3058; --low-top: 46%;
  --ground: #232D52; --ground-a: 0; --hz: #2F7A78; --hz-a: 0.32;
  --sea-a: 0;
  --lo-a: 0; --lo-ga: 0;
  --hi-a: 0;
  --aur-a: 1; --aur-i: 0.6; --aur-f: 0.9;
  --cloud: #2C3A66; --cloud-a: 0;
  --stars: 0.9;
}

html[data-variant="18h"][data-theme="dark"][data-page="results"] .lg-world {
  --sky-up: #0A1022; --sky-low: #10233A; --ground: #080C18; --hz: #1D5A58;
  --aur-i: 0.7; --aur-f: 1;
  --stars: 1;
}

/* The northern lights (Results). Each curtain is an image: rays rising from a gently wavy lower edge,
   each brightest at its own foot and fading out at its own top, green into teal and then violet, over a
   faint veil (so the rays never read as stripes) and a soft glow along the edge. Every image fades out on
   all four sides inside its own box, so no box edge ever shows. A vertical shear (skewY) tilts a curtain
   up to the right without leaning its rays; each sways, stretches and tilts on its own slow cycle, and a
   second layer of rays moves over the main curtain at another pace, so its light seems to flicker along
   it. Each keeps its middle shear as its resting shape, for reduced motion. */
html[data-variant="18h"] .lg-world > .k-aur {
  opacity: calc(var(--aur-a) * var(--aur-i, 1) * var(--aur-k, 1));
  background-position: center; background-size: 100% 100%; background-repeat: no-repeat;
  transform-origin: 50% 75%;
}
