  /**
   * In the public demo every page says so, at the top: the names and numbers are made up (2026-10-13). Never in a real portal.
   * @param {string} [name] the sample restaurant
   */
  function SampleChip(name) {
    const who = name || (D8.account && D8.account.business ? D8.account.business.name : '');
    return D8.data.MODE === 'demo' ? `<p class="sample-chip"><strong>Sample data</strong><span>${who ? esc(who) + ' is not a real restaurant' : 'names and numbers are examples'}</span></p>` : '';
  }

  /** @param {{title: string, intro?: string, introHtml?: boolean, cls?: string, after?: string, aside?: string, sample?: string}} o */
  function PageHeader(o) {
    const sample = SampleChip(o.sample);
    const aside = (sample || o.aside) ? `<div class="page-aside">${o.aside || ''}${sample}</div>` : '';
    return `<header class="page-head${o.cls ? ' ' + o.cls : ''}"><div class="page-head-text"><h1 id="page-title" tabindex="-1">${esc(o.title)}</h1>${o.intro ? `<p class="lede">${o.introHtml ? o.intro : esc(o.intro)}</p>` : ''}${o.after || ''}</div>${aside}</header>`;
  }

  /* ---- freshness, verification and usage (2026-10-13) --------------------------------------------------------- */

  /**
   * The line under every page header: when the page was last updated (the restaurant's own clock), where it comes
   * from, and whether it is up to date. A page that could not refresh says it is showing the last checked version.
   * @param {{updatedAt?: string|null, source: string, status?: 'ok'|'checking'|'delayed'|'kept', zone?: string, label?: string, okLabel?: string, note?: string, extra?: string}} o
   */
  function PageFresh(o) {
    const st = o.status || 'ok';
    const chip = {
      ok: ['is-ok', o.okLabel || 'Up to date'],
      checking: ['is-checking', o.label || 'Being checked'],
      delayed: ['is-delayed', o.label || 'Source delayed'],
      kept: ['is-checking', o.label || 'Showing the last checked update']
    }[st];
    const when = o.updatedAt ? (String(o.updatedAt).length > 10 ? `${F.dateTime12(o.updatedAt)}${o.zone ? ' ' + o.zone : ''}` : F.date(o.updatedAt)) : '';
    return `<div class="page-fresh is-${st}">
      ${when ? `<span class="pf-part"><strong>Last updated</strong> ${esc(when)}</span>` : ''}
      <span class="pf-part"><strong>Source:</strong> ${esc(o.source)}</span>
      <span class="pf-chip ${chip[0]}"><span class="pf-dot" aria-hidden="true"></span>${esc(chip[1])}</span>
      ${o.extra ? `<span class="pf-part pf-extra">${esc(o.extra)}</span>` : ''}
      ${o.note ? `<p class="pf-note">${icon('clock')}<span>${esc(o.note)}</span></p>` : ''}
    </div>`;
  }

  /**
   * Whether a number was checked, in one small pill: Verified, Being checked (a newer number is waiting), Source delayed,
   * or Kept last checked. Words and a dot, never colour alone. @param {'verified'|'checking'|'delayed'|'kept'} status
   */
  function VerifyBadge(status) {
    const s = { verified: ['is-verified', 'Verified'], checking: ['is-checking', 'Being checked'], delayed: ['is-delayed', 'Source delayed'], kept: ['is-checking', 'Kept last checked'] }[status] || ['is-delayed', 'Not checked yet'];
    return `<span class="vbadge ${s[0]}"><span class="vb-dot" aria-hidden="true"></span>${s[1]}</span>`;
  }

  /**
   * One usage bar: what is used of one limit this month. Orange while there is room, amber from 85 percent, a calm ink bar
   * saying "Limit reached" at the limit, and red saying "Over by N" only past it, and the same in words. Home draws a
   * compact row (name, figure); Work (plain) draws a sentence.
   * @param {{name: string, used: number, cap: number, pct: number, tone: string, tail: string, usedText: string, weeklyHint?: string|null, atOnce?: boolean}} l
   * @param {{chip?: string, plain?: boolean}} [o]
   */
  function UsageBar(l, o = {}) {
    const word = l.tone === 'over' ? `Over by ${l.used - l.cap}` : l.tone === 'full' ? 'Limit reached' : l.tone === 'warn' ? 'Almost used' : '';
    const m = /^(\d+ of \d+)(.*)$/.exec(l.usedText);
    const sentence = m ? `<strong>${esc(m[1])}</strong>${esc(m[2])}${l.atOnce ? '' : ' this month'}${l.weeklyHint ? ` <span class="usage-hint">(${esc(l.weeklyHint)})</span>` : ''}` : esc(l.usedText);
    const head = o.plain
      ? `<p class="usage-line">${sentence}${o.chip ? ' ' + o.chip : ''}</p>`
      : `<p class="usage-row"><span class="usage-name">${esc(l.name)}</span>${o.chip || ''}<span class="usage-fig">${esc(l.tail)}</span></p>`;
    return `<div class="usage is-${l.tone}">
      ${head}
      <div class="bar" role="meter" aria-label="${esc(l.usedText)}${l.weeklyHint ? ` (${esc(l.weeklyHint)})` : ''}" aria-valuemin="0" aria-valuemax="${l.cap}" aria-valuenow="${Math.min(l.used, l.cap)}"><span style="width:${l.pct}%"></span></div>
      ${word ? `<p class="usage-word">${word}</p>` : ''}
    </div>`;
  }

  /**
   * A number as a card: its value, the period it covers, where it came from and whether it was checked. For Home's three
   * numbers, the Results page and the demo alike. @param {any} t a tile from the data layer @param {number} now
   * @param {{compact?: boolean, delta?: boolean, days?: number}} [o]
   */
  function ResultTile(t, now, o = {}) {
    const label = metricLabel(t.label);
    // The same five rows in every state (name, figure, period, anything extra, source), so cards in a row line up (10-trust.css).
    if (t.state === 'pending') return `<article class="card rtile is-pending"><header class="rt-head"><p class="rt-label">${esc(label)}</p></header><p class="rt-empty">${icon('linkoff')}Not connected yet</p><p class="rt-note">${esc(t.text)}</p></article>`;
    if (t.state === 'error') return `<article class="card rtile is-error"><header class="rt-head"><p class="rt-label">${esc(label)}</p></header><p class="rt-empty">${icon('alert')}Couldn't load just now</p><p class="rt-note">${esc(t.text)} The other numbers are fine.</p><button class="btn-text" type="button" data-action="retry" data-section="${o.compact ? 'strip' : 'results'}">${icon('refresh')}Try again</button></article>`;
    const m = t.metric;
    const period = t.periodStart && t.periodEnd ? periodText(t.periodStart, t.periodEnd) : '';
    const read = t.readAt ? `read ${F.date(t.readAt)}` : '';
    const value = t.value === null || t.value === undefined || Number.isNaN(Number(t.value)) ? 'None' : F.num(t.value);
    const delta = o.delta && m ? Delta(m, o.days || 30) + NewBadge(m, o.days || 30) : '';
    const note = o.delta && m ? ComparisonNote(m, o.days || 30) : '';
    const more = `${t.newer ? `<p class="rt-check">${icon('clock')}<span>We are checking a newer number before we show it. This is the last number we checked.</span></p>` : ''}${note ? `<p class="rt-note">${note}</p>` : ''}`;
    return `<article class="card rtile${o.compact ? ' is-compact is-link' : ''}${t.badge ? ' is-' + t.badge : ''}">
      <header class="rt-head"><p class="rt-label">${esc(label)}</p>${VerifyBadge(t.badge)}</header>
      <p class="rt-value"><span class="fig">${esc(value)}</span>${t.unit && !o.compact ? `<span class="rt-unit">${esc(t.unit)}</span>` : ''}${delta}</p>
      ${period ? `<p class="rt-period">${esc(period)}</p>` : ''}
      ${more ? `<div class="rt-more">${more}</div>` : ''}
      ${t.source ? `<p class="rt-source"><strong>Source:</strong> ${esc(t.source)}${read ? ` <span class="rt-read">${esc(read)}</span>` : ''}</p>` : ''}
      ${o.compact ? `<a class="card-link" href="#/results"><span class="sr-only">${esc(label)}: see it in Results</span></a>` : ''}
    </article>`;
  }
  /** "1 Sep to 30 Sep 2026" for a period: the year once, at the end. @param {string} a @param {string} b */
  function periodText(a, b) {
    const same = String(a).slice(0, 4) === String(b).slice(0, 4);
    return `${F.date(a, { weekday: false, year: !same })} to ${F.date(b, { weekday: false, year: true })}`;
  }
  /**
   * "Where these numbers come from": one row per number, with its period, its source, whether it was checked and when.
   * @param {any[]} items
   */
  function SourcesTable(items) {
    const rows = items.filter((x) => x.state === 'ok').map((t) => `<tr>
        <th scope="row">${esc(metricLabel(t.label))}</th>
        <td>${t.periodStart && t.periodEnd ? esc(periodText(t.periodStart, t.periodEnd)) : ''}</td>
        <td>${esc(t.source || '')}</td>
        <td>${VerifyBadge(t.badge)}</td>
        <td>${t.verifiedAt ? `Domin8te team, ${esc(F.date(t.verifiedAt))}` : D8.data.MODE === 'demo' ? 'Sample data' : ''}</td>
      </tr>`).join('');
    if (!rows) return '';
    return `<section class="card sources-card" aria-labelledby="h-where">
      <div class="sec-head"><h2 id="h-where">Where these numbers come from</h2></div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Where each number comes from"><table class="sources-table"><thead><tr><th scope="col">Number</th><th scope="col">Period</th><th scope="col">Source</th><th scope="col">Status</th><th scope="col">Checked</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>`;
  }

  /** @param {string} id heading id @param {string} titleHtml already-escaped title @param {string} [extra] */
  function SectionHead(id, titleHtml, extra) {
    return `<div class="sec-head"><h2 id="${esc(id)}">${titleHtml}</h2>${extra || ''}</div>`;
  }

  /* ---- metrics ------------------------------------------------------------------------ */

  /** A 30-day line drawn from the metric's real daily figures. Decorative: the number says it. */
  function Sparkline(values) {
    const v = (values || []).map((x) => (x === null ? null : Number(x)));
    const nums = /** @type {number[]} */ (v.filter((x) => x !== null));
    if (nums.length < 2) return '';
    const max = Math.max(...nums);
    const min = Math.min(...nums);
    const span = max - min || 1;
    const W = 120;
    const H = 32;
    let d = '';
    let pen = false;
    v.forEach((x, i) => {
      if (x === null) { pen = false; return; }
      const px = (i / (v.length - 1)) * W;
      const py = H - 3 - ((x - min) / span) * (H - 6);
      d += (pen ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1);
      pen = true;
    });
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="${d}"/></svg>`;
  }

  /** @param {any} m @param {number} now @param {number} days @param {{sources?: boolean}} [o] sources: false leaves out where it came from (Home) */
  function MetricCard(m, now, days, o = {}) {
    const label = metricLabel(m.label);
    const link = `<a class="card-link" href="#/results"><span class="sr-only">${esc(label)}: see it in Results</span></a>`;
    if (m.state === 'pending') {
      return `<article class="metric-card is-pending"><p class="metric-label">${esc(label)}</p><p class="metric-empty">${icon('linkoff')}Not connected yet</p><p class="metric-meta">${esc(m.text)}</p></article>`;
    }
    if (m.state === 'error') {
      return `<article class="metric-card is-error"><p class="metric-label">${esc(label)}</p><p class="metric-empty">${icon('alert')}Couldn't load just now</p><p class="metric-meta">${esc(m.text)} The other numbers are fine.</p><button class="btn-text" type="button" data-action="retry" data-section="strip">${icon('refresh')}Try again</button></article>`;
    }
    const note = ComparisonNote(m, days);
    return `<article class="metric-card is-link">
      <p class="metric-label">${esc(label)}</p>
      <p class="metric-value"><span class="fig">${m.value === null ? 'None' : F.num(m.value)}</span>${Delta(m, days)}${NewBadge(m, days)}</p>
      ${m.spark ? Sparkline(m.spark) : ''}
      ${note ? `<p class="metric-note">${note}</p>` : ''}
      ${o.sources === false ? '' : `<p class="metric-src">${m.sources.map((s) => SourceChip(s, now)).join('')}</p>`}
      ${link}
    </article>`;
  }

  /**
   * The performance strip: no more than four figures tied to the client's goals, each its own card.
   * Home asks for three (o.max), leaves some out (o.skip, metric ids) and drops the source lines (o.sources).
   * @param {any} strip @param {number} now @param {{max?: number, skip?: string[], sources?: boolean}} [o]
   */
  function MetricStrip(strip, now, o = {}) {
    const w = strip.window;
    const max = o.max || 4;
    const list = strip.metrics.filter((/** @type {any} */ m) => !(o.skip || []).includes(m.id)).slice(0, max);
    const cells = list.map((/** @type {any} */ m) => MetricCard(m, now, w.days, o)).join('');
    return `<div class="strip${max === 3 ? ' is-3' : ''}">${cells}</div>`;
  }

  /* ---- needs your attention ------------------------------------------------------------ */

  /** The primary button's weight follows the severity: solid orange only for the urgent one. */
  const PRIMARY_STYLE = { critical: 'btn btn-primary', approval: 'btn btn-tint', connection: 'btn btn-glass', scheduled: 'btn btn-glass' };

  /**
   * An approval answers on the card itself (2026-10-16, Karan: one tap to approve, one to ask for changes): Approve
   * saves after a short Undo window, Ask for changes opens the item with the note box ready. Anything else keeps its
   * one button.
   */
  function actionPrimary(a, cls) {
    if (a.primary.does !== 'approval') return `<button class="${cls}" type="button" data-action="external" data-kind="${esc(a.primary.does)}">${esc(a.primary.label)}</button>`;
    const yes = /^confirm/i.test(a.primary.label) ? a.primary.label : 'Approve';
    return `<button class="${cls}" type="button" data-action="quick-approve" data-id="${esc(a.approvalId)}">${icon('check')}${esc(yes)}<span class="sr-only">: ${esc(a.title)}</span></button>
      <button class="btn btn-glass" type="button" data-action="approve" data-note="1" data-id="${esc(a.approvalId)}">Ask for changes<span class="sr-only">: ${esc(a.title)}</span></button>`;
  }
  /** "See it first": the full item (the posts, the hours) in the review window. */
  const seeFirst = (a) => (a.primary.does === 'approval'
    ? `<button class="link-btn act-see" type="button" data-action="approve" data-id="${esc(a.approvalId)}">See it first<span class="sr-only">: ${esc(a.title)}</span></button>`
    : '');

  /**
   * One thing the client needs to do: what, why it matters, the deadline or consequence, one
   * primary action, and a "View details" disclosure. Clicking anywhere else on the card opens
   * the details too.
   */
  function ActionNeededItem(a, now) {
    const kindIcon = a.icon || { billing: 'card', connection: 'linkoff', approval: 'check' }[a.kind] || 'alert';
    let when = '';
    if (a.deadline && a.deadline.kind === 'grace') {
      when = `<span class="due tone-overdue">${icon('calendar')}Everything keeps running until ${esc(F.date(a.deadline.date))}</span>`;
    } else if (a.deadline) {
      const d = F.due(a.deadline.date, now);
      when = `<span class="due tone-${d.tone}">${icon('calendar')}${esc(d.text)}</span>`;
    } else if (a.since) {
      when = `<span class="due tone-later">${icon('pause')}Paused since ${esc(F.date(a.since))}</span>`;
    }
    const moreId = 'more-' + esc(a.id);
    const more = (a.more && a.more.length) || (a.link && /^(#\/|https:\/\/)/.test(String(a.link.href || '')))
      ? `<div class="act-more" id="${moreId}" hidden>${(a.more || []).map((p) => `<p>${esc(p)}</p>`).join('')}${a.link && /^(#\/|https:\/\/)/.test(String(a.link.href || '')) ? `<a class="link link-more" href="${esc(a.link.href)}">${esc(a.link.label)}${icon('arrow-right')}</a>` : ''}</div>`
      : '';
    const toggle = more ? `<button class="link-btn act-toggle" type="button" data-action="toggle-more" aria-expanded="false" aria-controls="${moreId}">See details<span class="sr-only">: ${esc(a.title)}</span></button>` : '';
    // No severity chip (2026-10-09): the order (red first), the red tint and the icon carry it.
    return `<li class="act-card sev-${esc(a.severity)}" data-row="${esc(a.id)}"${a.approvalId ? ` data-approval="${esc(a.approvalId)}"` : ''}>
      <span class="act-icon">${icon(kindIcon)}</span>
      <div class="act-main">
        <h3 class="act-title">${esc(a.title)}</h3>
        <p class="act-detail">${esc(a.detail)}</p>
        ${when || toggle || seeFirst(a) ? `<p class="act-when">${when}${seeFirst(a)}${toggle}</p>` : ''}
        ${more}
      </div>
      <div class="act-do">${actionPrimary(a, PRIMARY_STYLE[a.severity] || 'btn btn-glass')}</div>
    </li>`;
  }

  function ActionNeededList(items, now) {
    return `<ol class="act-list">${items.map((a) => ActionNeededItem(a, now)).join('')}</ol>`;
  }

  /**
   * The payoff state when nothing needs the client: a calm status orb, what is planned next,
   * the latest win, and a gentle way into the results. Every fact comes from the services.
   */
  function CaughtUp(h) {
    const svc = (id) => (D8.data.SERVICES[id] ? D8.data.SERVICES[id].label : '');
    const facts = [];
    if (h && h.next) facts.push(`<div><dt>Next planned</dt><dd>${esc(h.next.title)}, ${esc(F.date(h.next.date))}<span class="cu-svc">${esc(svc(h.next.service))}</span></dd></div>`);
    if (h && h.win) facts.push(`<div><dt>Latest win</dt><dd>${esc(h.win.text)}, ${esc(day(h.win.date))}<span class="cu-svc">${esc(svc(h.win.service))}</span></dd></div>`);
    return `<div class="caught-up">
      <span class="orb" aria-hidden="true">${icon('check')}</span>
      <div class="cu-body">
        <h3 class="cu-title">You're all caught up</h3>
        <p class="cu-text">Nothing is waiting for you. If something comes up, it shows here first and we email you.</p>
        ${facts.length ? `<dl class="cu-facts">${facts.join('')}</dl>` : ''}
        <a class="btn btn-glass" href="#/results">See your results${icon('arrow-right')}</a>
      </div>
    </div>`;
  }

  /**
   * Coming up: the next few dates on record, each with whose move it is. A calendar-style date,
   * the thing, then who (you, Domin8te, or you and your account team) and the service.
   */
  function UpcomingList(items, now) {
    if (!items.length) return EmptyState({ icon: 'calendar', title: 'Nothing planned in the next few weeks.', text: 'New dates show here once they are set.' });
    const T = D8.time;
    const who = { client: 'You', team: 'Domin8te', both: 'You and Domin8te' };
    return `<ol class="upcoming">${items.map((i) => {
      const gap = T.dayNum(i.date) - T.dayNum(now);
      const day = gap === 0 ? 'Today' : gap === 1 ? 'Tomorrow' : F.longDate(i.date).split(' ')[0];
      const [d, m] = F.date(i.date, { weekday: false }).split(' ');
      const owner = i.owner === 'team' && i.waiting ? 'Domin8te, waiting on you' : who[i.owner] || who.team;
      const when = i.time ? `${day}, ${esc(i.time)}${i.length ? `, ${esc(i.length)}` : ''}` : day;
      return `<li class="up-item is-${esc(i.kind)}${i.owner === 'client' || i.waiting ? ' is-yours' : ''}">
        <time class="up-date" datetime="${esc(i.date)}"><span class="up-day">${esc(d)}</span><span class="up-mon">${esc(m)}</span></time>
        <div class="up-main"><p class="up-title">${esc(i.title)}</p><p class="up-meta"><span class="up-when">${when}</span><span class="up-who">${esc(owner)}</span>${i.service ? ServiceTag(i.service) : ''}</p></div>
      </li>`;
    }).join('')}</ol>`;
  }

  /* ---- current work --------------------------------------------------------------------- */

  /**
   * "You: confirm your autumn opening hours by Tue 29 Sep" or "Us: final check of both ad versions". When the next
   * step is the client's and linked to something waiting for them, it carries that thing's due date.
   * @param {any} next @param {any} [action] the linked Waiting for you item, when there is one
   */
  function nextStep(next, action) {
    const mine = next.who === 'client';
    const by = mine && action && action.deadline && action.deadline.kind === 'due' ? ` by ${day(action.deadline.date)}` : '';
    return `<strong>${mine ? 'You' : 'Us'}:</strong> ${esc(F.lcFirst(next.text))}${esc(by)}`;
  }
  /** The go-live line: "Opening hours updated across the site, Thu 1 Oct". @param {any} s */
  const comingLine = (s) => `${esc(s.expected.text || 'Ready')}, ${esc(day(s.expected.date))}`;

  /**
   * A concise service card in the same four lines as the Work page: Right now, Next, Coming, Last done.
   * @param {any} s @param {any[]} [actions] what is waiting for the client, to date their next step
   */
  function ServiceWorkCard(s, actions) {
    const svc = D8.data.SERVICES[s.id];
    const act = s.next && s.next.actionId ? (actions || []).find((a) => a.id === s.next.actionId) : null;
    return `<article class="card work-card is-link" aria-labelledby="wc-${esc(s.id)}">
      <header class="work-head"><h3 id="wc-${esc(s.id)}">${icon(svc.icon)}${esc(svc.label)}</h3>${StatusBadge(s.status)}</header>
      <dl class="facts work-facts">
        <div><dt>Right now</dt><dd>${esc(s.now || 'Getting started')}</dd></div>
        ${s.next && s.next.text ? `<div><dt>Next</dt><dd>${s.next.who === 'client' && act ? 'Waiting for you' : nextStep(s.next, act)}</dd></div>` : ''}
        ${s.expected && s.expected.date ? `<div><dt>Coming</dt><dd>${comingLine(s)}</dd></div>` : ''}
        ${s.proof && s.proof.text ? `<div><dt>Last done</dt><dd>${esc(s.proof.text)}, ${esc(day(s.proof.date))}</dd></div>` : ''}
      </dl>
      <a class="link link-more card-link-text" href="#/work/${esc(s.id)}">See details<span class="sr-only"> for ${esc(svc.label)}</span>${icon('arrow-right')}</a>
    </article>`;
  }

  /**
   * Home's services: one card, one row per service (icon, name, status, what we are doing right now), each row
   * a link to that service on Work. A step that is the client's reads "Waiting for you", in plain text.
   * @param {any[]} list @param {any[]} [actions] what is waiting for the client
   */
  function ServiceRows(list, actions) {
    const rows = list.map((s) => {
      const svc = D8.data.SERVICES[s.id];
      const act = s.next && s.next.actionId ? (actions || []).find((a) => a.id === s.next.actionId) : null;
      const yours = (act && s.next.who === 'client') || s.status === 'waiting';
      const status = yours ? '<span class="svc-row-wait">Waiting for you</span>' : StatusBadge(s.status);
      return `<li><a class="svc-row" href="#/work/${esc(s.id)}">
        <span class="svc-row-icon">${icon(svc.icon)}</span>
        <span class="svc-row-text"><span class="svc-row-name">${esc(svc.label)}</span><span class="svc-row-now">${esc(s.now || 'Getting started')}</span></span>
        <span class="svc-row-status">${status}</span>${icon('chevron-right', 'svc-row-go')}
      </a></li>`;
    }).join('');
    return `<div class="card svc-rows"><ul class="svc-row-list">${rows}</ul></div>`;
  }

  /* ---- insight and updates --------------------------------------------------------------- */

  function InsightCard(ins, now) {
    const head = SectionHead('h-insight', 'Biggest change this month');
    if (ins.state === 'error') return `<div class="card insight">${head}${ErrorState({ title: 'Nothing to compare right now.', text: ins.text, retry: 'insight' })}</div>`;
    if (ins.state === 'none') return `<div class="card insight">${head}<p class="insight-detail">${esc(ins.text)}</p><a class="link link-more" href="#/results">See all results${icon('arrow-right')}</a></div>`;
    return `<article class="card insight" aria-labelledby="h-insight">
      ${head}
      <p class="insight-lead">${esc(ins.headline)}</p>
      <p class="insight-detail">${esc(ins.detail)}</p>
      <p class="meta insight-src">${icon('shield')}${sourceLine(ins.sources, now)}</p>
      <a class="link link-more" href="#/results">See all results${icon('arrow-right')}</a>
    </article>`;
  }

  /** An update sent on its own (an app stopped working) carries a small tag; the account team's carry none. */
  function author(u) {
    return u.author === 'automatic' ? `<span class="tag-auto" title="Sent automatically when an app stopped working">${icon('refresh')}Automatic notice</span>` : '';
  }

  /**
   * One agency update: the date, the service, the title and what we did. Next, anything different, the result and
   * why it matters sit behind "See details" (2026-10-09). Compact shows the title with everything behind See details,
   * and a link to all updates.
   */
  function UpdateCard(u, o = {}) {
    const main = o.compact ? [] : [['What we did', u.completed]];
    const extra = (o.compact ? [['What we did', u.completed]] : []).concat([['Next', u.next], ['Anything different', u.changed], ['Result', u.result], ['Why it matters', u.why]]);
    const dl = (/** @type {any[]} */ rows) => `<dl class="facts facts-wide">${rows.filter((r) => r[1]).map((r) => `<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>`;
    const more = extra.filter((r) => r[1]);
    const tag = o.headingLevel || 'h3';
    const foot = o.compact ? `<footer class="update-foot"><a class="link link-more" href="#/updates">See all updates${icon('arrow-right')}</a></footer>` : '';
    return `<article class="card update${o.compact ? ' is-compact' : ''}"${o.id ? ` id="${esc(o.id)}"` : ''}>${o.lead || ''}
      <header class="update-head"><p class="update-date"><time datetime="${esc(u.date)}">${esc(day(u.date))}</time></p>${ServiceTag(u.service)}${author(u)}</header>
      <${tag} class="update-title">${esc(u.title)}</${tag}>
      ${main.some((r) => r[1]) ? dl(main) : ''}
      ${more.length ? `<details class="update-more"><summary>See details${icon('chevron-down')}</summary>${dl(more)}</details>` : ''}
      ${foot}
    </article>`;
  }

  /* ---- controls -------------------------------------------------------------------------- */

  function DateRangeSelector(days) {
    const opts = [[7, 'Last 7 days'], [30, 'Last 30 days'], [90, 'Last 90 days']];
    return `<fieldset class="segmented"><legend class="sr-only">Date range</legend>${opts.map(([d, l]) =>
      `<label class="seg"><input type="radio" name="range" value="${d}"${d === days ? ' checked' : ''} data-change="range"><span>${l}</span></label>`).join('')}</fieldset>`;
  }

  /** @param {Array<[string, string]>} options value, label @param {string} value @param {string} name */
  function FilterChips(options, value, name, legend) {
    return `<fieldset class="segmented is-chips"><legend class="sr-only">${esc(legend)}</legend>${options.map(([v, l]) =>
      `<label class="seg"><input type="radio" name="${esc(name)}" value="${esc(v)}"${v === value ? ' checked' : ''} data-change="${esc(name)}"><span>${esc(l)}</span></label>`).join('')}</fieldset>`;
  }

  /** @param {any} inv @param {{problemShown?: boolean}} [o] */
  function InvoiceRow(inv, o = {}) {
    const st = {
      paid: ['Paid', 'success', 'check'],
      failed: ['Payment failed', 'error', 'alert'],
      open: ['Due', 'attention', 'clock']
    }[inv.status] || ['Unknown', 'neutral', 'info'];
    // One line per invoice: "September, BAY-0009", the amount only when the record has one (live invoices carry
    // it; the demo's do not), and its status. A failed one's note repeats the banner above, so it is left out.
    const month = inv.issued ? F.monthYear(inv.issued).split(' ')[0] : 'Invoice';
    let amount = '';
    if (inv.amountMinor !== undefined && inv.amountMinor !== null && inv.currency) {
      try { amount = new Intl.NumberFormat('en-GB', { style: 'currency', currency: String(inv.currency).toUpperCase() }).format(Number(inv.amountMinor) / 100); } catch (e) { amount = ''; }
    }
    const note = inv.status === 'failed' && o.problemShown ? '' : inv.note ? `<p class="meta">${esc(inv.note)}</p>` : '';
    return `<li class="invoice">
      <div class="inv-main"><p class="inv-num">${esc(month)}, ${esc(inv.number)}${amount ? `, ${esc(amount)}` : ''}</p>${note}</div>
      <span class="badge tone-${st[1]}">${icon(st[2])}${st[0]}</span>
      <button class="btn btn-glass btn-sm" type="button" data-action="external" data-kind="invoice" data-id="${esc(inv.id)}" data-number="${esc(inv.number)}"${inv.url && /^https:\/\//.test(String(inv.url)) ? ` data-url="${esc(inv.url)}"` : ''}>See invoice<span class="sr-only"> ${esc(inv.number)} on Stripe</span>${icon('external')}</button>
    </li>`;
  }

  /**
   * Changes the address without adding a history entry. Sandboxed previews (the design-system
   * card) can refuse this; the page has already changed, so it is safe to skip.
   * @param {string} url a hash, or a query and hash
   */
  function replaceHash(url) {
    try {
      root.history.replaceState(null, '', url);
    } catch (e) { /* sandboxed preview: keep the old address */ }
  }

  D8.ui = {
    replaceHash,
    icon, day, span, metricLabel, replyLine, fromSource, sourceAbout, comingLine,
    StatusBadge, ServiceTag, HealthBadge, FreshnessIndicator, SourceChip, StatusChip, Delta, NewBadge, ComparisonNote, sourceLine,
    EmptyState, ErrorState, Skeleton, PageHeader, SectionHead,
    Sparkline, MetricCard, MetricStrip, ActionNeededItem, ActionNeededList, CaughtUp, UpcomingList, ServiceWorkCard, ServiceRows, nextStep,
    SampleChip, PageFresh, VerifyBadge, UsageBar, ResultTile, SourcesTable, periodText,
    InsightCard, UpdateCard, DateRangeSelector, FilterChips, InvoiceRow
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/plan.js */
// @ts-check
/*
 * The plan, as the client sees it (2026-10-13): the pieces Home and Work show (what runs this month and how much of it is
 * used, what is coming, what changes next month) and the helpers the other plan files share. Billing is in
 * plan-billing.js, the picker in plan-picker.js and the limit check inside "Ask for a change" in plan-ask.js. Every number comes from D8.planModel
 * (data/plan-model.js); these files only draw it. No price is written in them: prices come from the database and only show
 * in the signed-in portal.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const UI = D8.ui;
  const esc = F.esc;
  const icon = UI.icon;
  const day = (/** @type {string} */ x) => F.date(x);
  const svc = (/** @type {string} */ id) => D8.data.SERVICES[id] || { label: id, icon: 'layers' };

  /** A plan's price ("$12.50"), or nothing: only when the database gave one (never in the public demo). @param {any} c */
  const price = (c) => (c && c.priceMinor !== null && c.priceMinor !== undefined ? F.money(c.priceMinor, c.currency) : '');
  /** The same price with its rhythm: "$12.50 a month". @param {any} c */
  const perMonth = (c) => (price(c) ? `${price(c)} a month` : '');
  /** In the public demo the limits are samples, and say so. */
  const sample = () => (D8.data.MODE === 'demo' ? '<span class="chip-sample">sample limit</span>' : '');
  /** @param {string} id */
  const ico = (id) => `<span class="svc-ico is-${esc(id)}">${icon(svc(id).icon)}</span>`;

  /** What each service is, in a few plain words. */
  const ABOUT = {
    advertising: 'Facebook, Instagram and Google ads',
    social: 'Posts for Facebook and Instagram',
    website: 'Hosting, care and updates',
    local: 'Google and Apple Maps, reviews, search',
    email: 'Email campaigns and automatic emails, with a welcome email'
  };
  /** What comes with each plan besides its services: change it here. No calls or video walkthroughs on any plan (Karan, 14 Oct 2026). */
  // The dashboard line (2026-10-16, dashboard usage plan step 8): said once, here, never on Home; no price is named.
  const DASHBOARD_LINE = 'Your dashboard is included: approvals, updates and your numbers in one place';
  const INCLUDED = {
    starter: [DASHBOARD_LINE, 'A monthly summary in your dashboard'],
    growth: [DASHBOARD_LINE, 'A monthly summary in your dashboard'],
    domin8te: [DASHBOARD_LINE, 'A monthly summary in your dashboard']
  };
  /** Ad spend is separate from the plan fee (release default 18): change the sentence here. */
  const AD_SPEND = 'Ad spend is paid to Meta and Google directly and is not part of your plan.';
  /** A small number as a word ("two"), for the plan lines. @param {number} n */
  const numWord = (n) => ['no', 'one', 'two', 'three', 'four', 'five'][n] || String(n);
  /** What a plan is, in a line: "Ads, plus two services you choose". @param {any} p a menu plan */
  function blurb(p) {
    const n = p.rule.choose;
    const some = n === 1 ? 'one service' : `${numWord(n)} services`;
    if (p.rule.fixed.length) return `${F.list(p.rule.fixed.map((/** @type {string} */ x) => svc(x).label))}, plus ${some} you choose`;
    return `Any ${some} you choose`;
  }
  /** @param {string[]} picks */
  const chips = (picks) => `<ul class="chips">${picks.map((/** @type {string} */ id) => `<li class="chip">${esc(svc(id).label)}</li>`).join('')}</ul>`;
  /** @param {string} iso a day */
  const stamp = (iso) => `${day(iso)}, 11:59 PM`;

  /* ---- a staff-written section, when staff made one visible ---------------------------------------------------- */

  /** What staff wrote for a part of Home: a title, a few lines, a short list. @param {any} sec */
  function staffNote(sec) {
    if (!sec || !sec.content) return '';
    const c = sec.content;
    if (!c.title && !c.body && !(c.items && c.items.length)) return '';
    return `<div class="staff-note">${c.title ? `<h3>${esc(c.title)}</h3>` : ''}${c.body ? `<p>${esc(c.body)}</p>` : ''}${c.items && c.items.length ? `<ul>${c.items.map((/** @type {string} */ x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}<p class="pc-source">Source: ${esc(sec.source || 'Domin8te console')}</p></div>`;
  }

  /* ---- Home ------------------------------------------------------------------------------------------------------ */

  /**
   * Nothing is waiting for the client: one calm banner that says where the plan stands. A change they chose says so.
   * @param {any} m the plan model @param {{staff?: any, facts?: string}} [o]
   */
  function banner(m, o = {}) {
    const c = m.now;
    const n = m.next;
    const changing = m.confirmed && m.changes.differs;
    let title;
    let text;
    if (changing) {
      title = m.changes.planChanged ? `Your new plan starts ${day(m.bill)}` : `Your services change on ${day(m.bill)}`;
      text = `You chose ${m.changes.planChanged ? n.name : 'your new services'}${n.confirmedAt ? ` on ${day(n.confirmedAt)}` : ''}. Nothing to do. ${F.list(c.services.map((/** @type {any} */ s) => s.label))} keep running until then.`;
    } else {
      title = 'All running as normal';
      const p = price(n || c);
      text = `You're on ${c.name}. ${p ? `Next bill ${p} on ${day(m.bill)}.` : `Your next bill is on ${day(m.bill)}.`} Nothing to do.`;
    }
    const staff = o.staff && o.staff.content && (o.staff.content.title || o.staff.content.body) ? o.staff.content : null;
    return `<div class="card plan-banner${changing ? ' is-change' : ''}">
      <span class="pb-icon" aria-hidden="true">${icon('check')}</span>
      <div class="pb-body">
        <h3 class="pb-title">${esc(staff && staff.title ? staff.title : title)}</h3>
        <p class="pb-text">${esc(staff && staff.body ? staff.body : text)}</p>
        ${o.facts || ''}
      </div>
      <a class="btn btn-glass pb-go" href="#/billing">See billing${icon('arrow-right')}</a>
    </div>`;
  }

  /**
   * The plan's services with what is used of each this month: the left card on Home.
   * @param {any} m the plan model @param {{summary?: any[], actions?: any[], staff?: any}} [o]
   */
  function runningNow(m, o = {}) {
    const c = m.now;
    const sum = new Map((o.summary || []).map((/** @type {any} */ s) => [s.id, s]));
    const rows = c.services.map((/** @type {any} */ s) => {
      const w = sum.get(s.id);
      const act = w && w.next && w.next.actionId ? (o.actions || []).find((/** @type {any} */ a) => a.id === w.next.actionId) : null;
      const yours = w && ((act && w.next.who === 'client') || w.status === 'waiting');
      const status = !w ? '' : yours ? '<span class="svc-row-wait">Waiting for you</span>' : UI.StatusBadge(w.status);
      return `<li class="run-svc">
        ${ico(s.id)}
        <div class="run-main">
          <div class="run-top"><h3 class="run-name"><a href="#/work/${esc(s.id)}">${esc(s.label)}<span class="sr-only">: see the work</span></a></h3>${status}</div>
          ${w && w.now ? `<p class="run-now">${esc(w.now)}</p>` : ''}
          ${s.lines.length ? `<div class="run-usage">${s.lines.map((/** @type {any} */ l) => UI.UsageBar(l, { chip: sample() })).join('')}</div>` : ''}
        </div>
      </li>`;
    }).join('');
    return `<section class="card plan-card plan-running" aria-labelledby="h-running">
      <header class="pc-head">
        <div><h2 id="h-running">Running now</h2><p class="pc-sub">This month: ${esc(day(c.start))} to ${esc(day(m.lastDay))}${D8.data.MODE === 'demo' ? ' · sample usage' : ''}</p></div>
        <span class="plan-chip">${esc(c.name)}</span>
      </header>
      ${staffNote(o.staff)}
      <ul class="run-list">${rows}</ul>
      ${o.staff ? '' : '<p class="pc-source">Source: Domin8te console</p>'}
    </section>`;
  }

  /** @param {{state: string, title: string, text: string}[]} items */
  function timeline(items) {
    return `<ol class="tl">${items.map((x) => `<li class="tl-item is-${x.state}"><span class="tl-dot" aria-hidden="true">${x.state === 'done' ? icon('check') : ''}</span><div><p class="tl-title">${x.title}</p>${x.text ? `<p class="tl-text">${x.text}</p>` : ''}</div></li>`).join('')}</ol>`;
  }

  /** What is coming: the month that started, the last day to change, the reminders, the next bill. @param {any} m @param {any} [staff] @param {string} [email] */
  function comingUp(m, staff, email) {
    const c = m.now;
    const p = price(m.next || c);
    // Only dates still ahead, and only when there is an address to send to: the line must not promise a reminder that cannot happen.
    const ahead = (m.reminders || []).filter((/** @type {any} */ r) => !r.past).map((/** @type {any} */ r) => esc(day(r.date)));
    const reminder = email && ahead.length ? ` We email you on ${F.list(ahead)}.` : '';
    const items = [
      { state: 'done', title: `${esc(day(c.start))}: month started`, text: `Your ${esc(c.name)} services are running.` },
      m.open
        ? { state: 'todo', title: `${esc(day(m.lastDay))}: last day to change next month`, text: `Do nothing and it stays the same.${reminder}` }
        : { state: 'todo', title: 'Next month is set', text: 'The last day to change it has passed. Message us if something is wrong.' },
      { state: 'todo', title: `${esc(day(m.bill))}: next bill`, text: p ? `Next bill: ${esc(p)}.` : `${esc((m.next || c).name)} renews for another month.` }
    ];
    return `<section class="card plan-card plan-coming" aria-labelledby="h-coming">
      <header class="pc-head"><div><h2 id="h-coming">Coming up</h2></div></header>
      ${staffNote(staff)}
      ${timeline(items)}
    </section>`;
  }

  /** What changes next month: each service stays, arrives or stops. @param {any} m @param {any} [staff] */
  function whatChanges(m, staff) {
    const c = m.now;
    const n = m.next;
    const p = price(n);
    const was = price(c);
    const order = D8.planModel.ORDER;
    const ids = order.filter((/** @type {string} */ id) => m.changes.keeps.includes(id) || m.changes.adds.includes(id) || m.changes.stops.includes(id));
    const rows = ids.map((/** @type {string} */ id) => {
      const s = svc(id);
      const kind = m.changes.adds.includes(id) ? 'adds' : m.changes.stops.includes(id) ? 'stops' : 'keeps';
      const ns = n.services.find((/** @type {any} */ x) => x.id === id);
      const text = kind === 'keeps' ? 'No change' : kind === 'adds' ? `New: ${(ns && ns.summary ? F.lcFirst(ns.summary) : 'getting started')}` : `Paused after ${day(m.lastDay)}. Saved, not deleted.`;
      const word = { keeps: 'Keeps', adds: 'Adds', stops: 'Stops' }[kind];
      return `<li class="chg-row is-${kind}">${ico(id)}<div><p class="chg-name">${esc(s.label)}</p><p class="chg-text">${esc(text)}</p></div><span class="chg-tag">${word}</span></li>`;
    }).join('');
    return `<section class="card plan-card plan-changes" aria-labelledby="h-changes">
      <header class="pc-head"><div><h2 id="h-changes">What changes on ${esc(day(m.bill))}</h2><p class="pc-sub">${esc(n.name)}${p ? ` · ${esc(p)} a month${was && was !== p ? ` (now ${esc(was)})` : ''}` : ''}</p></div></header>
      ${staffNote(staff)}
      <ul class="chg-list">${rows}</ul>
      <p class="pc-foot">Picked the wrong thing? <a class="link" href="#/messages">Message Karan</a>${m.open ? ` before ${esc(day(m.lastDay))}` : ''}.</p>
    </section>`;
  }

  /**
   * Home, Billing and the picker, when no month of a plan is running. A new client whose first month is chosen but starts
   * later (its first bill date is ahead) sees that plan and the day it starts, and nothing is counted until then.
   * @param {any} [m] the plan model
   */
  function notSetUp(m) {
    const u = m && m.state === 'upcoming' ? m.upcoming : null;
    if (u) {
      const names = F.list(u.services.map((/** @type {any} */ s) => s.label));
      return `<section class="card plan-card plan-none plan-upcoming" aria-labelledby="h-upcoming">
      <div class="empty">${icon('calendar', 'empty-icon')}<div><h2 id="h-upcoming" class="empty-title">Your plan starts on ${esc(day(u.start))}.</h2><p class="empty-text">${esc(u.name)}${names ? `: ${esc(names)}` : ''}. Nothing is counted until it starts.</p><a class="btn btn-glass btn-sm" href="#/messages">${icon('message')}Message us</a></div></div>
    </section>`;
    }
    return `<section class="card plan-card plan-none" aria-labelledby="h-none">
      <div class="empty">${icon('card', 'empty-icon')}<div><h2 id="h-none" class="empty-title">Your plan is not set up yet.</h2><p class="empty-text">Message us and we will sort it out. Nothing is lost.</p><a class="btn btn-glass btn-sm" href="#/messages">${icon('message')}Message us</a></div></div>
    </section>`;
  }

  /* ---- Work ------------------------------------------------------------------------------------------------------- */

  /** A service's usage on the Work page: a bar for each limit and when it resets. @param {any} s a service with usage @param {any} m */
  function workUsage(s, m) {
    if (!s.usage || !s.usage.length) return '';
    return `<div class="work-usage"><h3 class="sr-only">Used this month</h3>${s.usage.map((/** @type {any} */ l) => UI.UsageBar(l, { chip: sample(), plain: true })).join('')}<p class="usage-reset">Resets ${esc(day(m.bill))}</p></div>`;
  }
  /**
   * A service that is not in this month's plan: one quiet card (its icon tile, its name, the word that says so, and the
   * way to add it), the same row shape as Running now on Home so it reads as a service at rest, not a broken one.
   * @param {{id: string, label: string}[]} off @param {any} m
   */
  function offCards(off, m) {
    if (!off.length) return '';
    return off.map((s) => `<section class="card svc-off" aria-labelledby="off-${esc(s.id)}">
      ${ico(s.id)}
      <div class="off-body">
        <header class="svc-head"><h2 id="off-${esc(s.id)}">${esc(s.label)}</h2><span class="badge tone-neutral">Not in this month's plan</span></header>
        <p>Your work is saved. ${m && m.open ? `You can add ${esc(s.label)} for the month that starts ${esc(day(m.bill))} from <a class="link" href="#/billing/change">Billing</a>.` : `You can add ${esc(s.label)} from Billing for a later month.`}</p>
      </div>
    </section>`).join('');
  }


  D8.plan = { price, perMonth, sample, ico, ABOUT, INCLUDED, AD_SPEND, blurb, chips, stamp, timeline, staffNote, banner, runningNow, comingUp, whatChanges, notSetUp, workUsage, offCards };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/plan-billing.js */
// @ts-check
/*
 * The plan on Billing (2026-10-13): the plan card with what each service allows, "You're all set" once next month is
 * chosen, the card and the Stripe line, and the bills table. Shared helpers come from plan.js. No price is written here.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const UI = D8.ui;
  const esc = F.esc;
  const icon = UI.icon;
  const day = (/** @type {string} */ x) => F.date(x);
  const svc = (/** @type {string} */ id) => D8.data.SERVICES[id] || { label: id, icon: 'layers' };
  const { price, perMonth, sample, ico, ABOUT, INCLUDED, AD_SPEND, blurb, chips, stamp, timeline } = D8.plan;

  /* ---- Billing ---------------------------------------------------------------------------------------------------- */

  /** The services of one month with what each allows. @param {any} c a month of the plan */
  function serviceList(c) {
    return `<ul class="svc-list">${c.services.map((/** @type {any} */ s) => `<li>${ico(s.id)}<div><p class="sl-name">${esc(s.label)}</p><p class="sl-about">${esc(/** @type {any} */ (ABOUT)[s.id] || '')}</p>${s.lines.length ? `<ul class="sl-lines">${s.lines.map((/** @type {any} */ l) => `<li>${esc(l.capText)}${l.weeklyHint ? ` <span class="sl-hint">(${esc(l.weeklyHint)})</span>` : ''} ${sample()}</li>`).join('')}</ul>` : ''}${s.id === 'advertising' ? `<p class="sl-fine">${esc(AD_SPEND)}</p>` : ''}</div></li>`).join('')}</ul>`;
  }
  /** What comes with the plan besides the services: a summary, a call. @param {any} c a month of the plan */
  function included(c) {
    const ls = /** @type {any} */ (INCLUDED)[c.planId] || [];
    return ls.length ? `<h3 class="po-h po-h-more">Also included</h3><ul class="po-included">${ls.map((/** @type {string} */ x) => `<li>${icon('check')}<span>${esc(x)}</span></li>`).join('')}</ul>` : '';
  }
  /** This month, next bill, last day to change. @param {any} m */
  function facts(m) {
    const c = m.now;
    const p = price(m.next || c);
    return `<dl class="facts-lite">
      <div><dt>This month</dt><dd>${esc(day(c.start))} to ${esc(day(m.lastDay))}</dd></div>
      <div><dt>Next bill</dt><dd>${p ? `${esc(p)} on ` : ''}${esc(day(m.bill))}</dd></div>
      ${m.open ? `<div><dt>Change by</dt><dd>${esc(stamp(m.lastDay))} ${esc(m.zone)}</dd></div>` : ''}
    </dl>`;
  }
  /** The days left to change, as a small figure. @param {any} m */
  function daysLeft(m) {
    if (!m.open) return '';
    const n = m.daysLeft;
    return `<p class="days-left"><strong>${n === 0 ? 'Today' : n}</strong><span>${n === 0 ? 'is the last day' : F.plural(n, 'day left', 'days left')}</span></p>`;
  }

  /**
   * The plan card on Billing. With nothing chosen for next month it shows the services and the way to change them;
   * with a change confirmed it shrinks to this month and the confirmation takes over (confirmed()).
   * @param {any} m the plan model @param {{compact?: boolean}} [o]
   */
  function overview(m, o = {}) {
    const c = m.now;
    const changing = m.confirmed && m.changes.differs;
    const eyebrow = changing || o.compact ? 'Your plan this month' : 'Your plan';
    const status = m.confirmed && m.changes.differs ? '' : `<span class="badge tone-success">${icon('check')}Active · no changes coming</span>`;
    const head = `<header class="po-head"><div><p class="eyebrow">${eyebrow}</p><h2 class="po-name" id="h-plan">${esc(c.name)}${perMonth(c) ? `<span class="po-price"> · ${esc(perMonth(c))}</span>` : ''}</h2>${chips(c.picks)}</div>${o.compact ? '' : status}</header>`;
    if (o.compact || changing) {
      return `<section class="card plan-overview is-compact" aria-labelledby="h-plan">${head}<div class="po-facts">${facts(m)}</div></section>`;
    }
    const note = m.open
      ? `<p class="po-note">${icon('info')}<span>Do nothing and your plan stays the same next month. Want something different? Pick by ${esc(day(m.lastDay))}.</span></p>`
      : `<p class="po-note">${icon('info')}<span>Next month is set: the last day to change it has passed. Message us if something is wrong.</span></p>`;
    return `<section class="card plan-overview" aria-labelledby="h-plan">${head}
      <div class="rule-rainbow" aria-hidden="true"></div>
      <div class="po-grid">
        <div><h3 class="po-h">Your services each month</h3>${serviceList(c)}${included(c)}</div>
        <div class="po-side"><h3 class="po-h">Billing</h3>${facts(m)}<div class="po-when">${daysLeft(m)}${note}</div>
          <div class="po-actions">${m.open ? `<a class="btn btn-solid btn-block" href="#/billing/change">Change my services${icon('arrow-right')}</a>` : ''}<a class="btn btn-glass btn-block" href="#bills">See past bills</a></div>
        </div>
      </div>
    </section>`;
  }

  /**
   * "You're all set": what the client chose for next month, what changes and when, and how to fix a wrong pick.
   * @param {any} m the plan model @param {string} email where the copy goes
   */
  function confirmed(m, email) {
    const c = m.now;
    const n = m.next;
    const was = price(c);
    const will = price(n);
    const items = [
      { state: 'done', title: `${esc(F.date(n.confirmedAt || m.today))}: confirmed`, text: 'Your choice is saved. You can see it here any time.' },
      { state: 'todo', title: `Until ${esc(day(m.lastDay))}`, text: `${esc(F.list(c.services.map((/** @type {any} */ s) => s.label)))} keep running as normal.` },
      { state: 'todo', title: `${esc(day(m.bill))}: ${m.changes.planChanged ? 'new plan starts' : 'new services start'}`, text: `${will ? `Your bill is ${esc(will)}. ` : ''}Locked until ${esc(day(m.lock.to))}.` }
    ];
    const stops = m.changes.stops.map((/** @type {string} */ id) => svc(id).label);
    return `<section class="card plan-confirmed" aria-labelledby="h-set">
      <header class="pcf-head">
        <span class="pcf-ok" aria-hidden="true">${icon('check')}</span>
        <div><p class="eyebrow is-green">You're all set</p><h2 id="h-set">${esc(n.name)} ${m.changes.planChanged ? 'starts' : 'services start'} ${esc(day(m.bill))}</h2></div>
        ${n.confirmedAt ? `<p class="lock-chip">${icon('lock')}Confirmed ${esc(F.dateTime12(n.confirmedAt))}</p>` : ''}
      </header>
      <p class="pcf-lede">Your choice is saved. Nothing is charged today.</p>
      <div class="rule-rainbow" aria-hidden="true"></div>
      <div class="pcf-versus">
        <div class="pcf-box"><p class="eyebrow">Now</p><p class="pcf-plan">${esc(c.name)}</p>${was ? `<p class="pcf-price"><strong>${esc(was)}</strong>/month</p>` : ''}<p class="pcf-svcs">${esc(F.list(c.services.map((/** @type {any} */ s) => s.label)))}</p></div>
        <span class="pcf-arrow" aria-hidden="true">${icon('arrow-right')}</span>
        <div class="pcf-box is-next"><p class="eyebrow">From ${esc(day(m.bill))}</p><p class="pcf-plan">${esc(n.name)}</p>${will ? `<p class="pcf-price"><strong>${esc(will)}</strong>/month</p>` : ''}<p class="pcf-svcs">${esc(F.list(n.services.map((/** @type {any} */ s) => s.label)))}</p></div>
      </div>
      <div class="pcf-grid">
        <div><h3 class="po-h">Your services from ${esc(day(m.bill))}</h3>${serviceList(n)}
          ${stops.length ? `<p class="po-note">${icon('info')}<span><strong>${esc(F.list(stops))} ${stops.length === 1 ? 'stops' : 'stop'} after ${esc(day(m.lastDay))}.</strong> Your work is saved. You can add ${stops.length === 1 ? 'it' : 'them'} back next month.</span></p>` : ''}
        </div>
        <div><h3 class="po-h">What happens next</h3>${timeline(items)}</div>
      </div>
      ${m.open ? `<p class="pcf-warn">${icon('info')}<span><strong>Picked the wrong thing?</strong> Change it any time until ${esc(day(m.lastDay))}, or <a class="link" href="#/messages">message Karan</a>. No charge for changing your mind.</span></p>` : ''}
      <div class="pcf-actions">${m.open ? `<a class="btn btn-solid" href="#/billing/change">Change my picks</a>` : ''}<a class="btn btn-glass" href="#/messages">${icon('message')}Message Karan</a><a class="btn btn-glass" href="#bills">See past bills</a></div>
    </section>`;
  }

  /**
   * The card and the Stripe line: how they pay, and a way to change it. Secured by Stripe, as before.
   * @param {any} b the billing record
   */
  function payment(b) {
    const pm = b.paymentMethod || {};
    const problem = b.subscription && b.subscription.status === 'past_due';
    return `<section class="card pay-card" aria-labelledby="h-pay">
      <div class="sec-head"><h2 id="h-pay">Payment</h2></div>
      ${pm.last4 ? `<p class="pay-line">${icon('card')}<span>${esc(pm.brand || 'Card')} ending ${esc(pm.last4)}</span></p>` : '<p class="meta">No card is on file yet.</p>'}
      ${!problem && pm.problem ? `<p class="due tone-overdue">${icon('alert')}${esc(pm.problem.text)}</p>` : ''}
      <p class="secure-line">${icon('lock')}<span><strong>Secured by Stripe</strong>, trusted by millions of businesses. Your card details stay with Stripe; we never see your full card number.</span></p>
      ${problem ? '' : `<button class="btn btn-glass btn-sm" type="button" data-action="external" data-kind="billing-portal">Change card${icon('external')}</button>`}
    </section>`;
  }

  /**
   * Your bills: each with its number, amount, status, due date and the Stripe link staff approved. A bill whose link is not
   * approved shows no button. In the demo the buttons explain what they would do.
   * @param {any[]} list @param {any} m the plan model (for today)
   */
  function bills(list, m) {
    const demo = D8.data.MODE === 'demo';
    const hasAmount = list.some((i) => i.amountMinor !== undefined && i.amountMinor !== null && i.currency);
    const SHOWN = 6;
    const status = {
      paid: ['Paid', 'success', 'check'], failed: ['Payment failed', 'error', 'alert'], overdue: ['Overdue', 'error', 'alert'], due: ['Due', 'info', 'clock']
    };
    const row = (/** @type {any} */ i) => {
      const st = /** @type {any} */ (status)[i.state] || ['Unknown', 'neutral', 'info'];
      const month = i.issued ? F.monthYear(i.issued) : '';
      let amount = '';
      if (hasAmount && i.amountMinor !== undefined && i.amountMinor !== null && i.currency) {
        try { amount = new Intl.NumberFormat('en-US', { style: 'currency', currency: String(i.currency).toUpperCase(), currencyDisplay: 'narrowSymbol' }).format(Number(i.amountMinor) / 100) + ' ' + String(i.currency).toUpperCase(); } catch (e) { amount = ''; }
      }
      const link = i.url && /^https:\/\//.test(String(i.url));
      const canOpen = link || demo;
      const pay = (i.state === 'due' || i.state === 'overdue') && canOpen;
      const btn = canOpen
        ? `<button class="btn ${pay ? 'btn-primary' : 'btn-glass'} btn-sm" type="button" data-action="external" data-kind="invoice" data-id="${esc(i.id)}" data-number="${esc(i.number)}"${link ? ` data-url="${esc(i.url)}"` : ''}>${pay ? 'Pay on Stripe' : 'See bill'}<span class="sr-only"> ${esc(i.number)} on Stripe</span>${icon('external')}</button>`
        : '<span class="meta">Being checked</span>';
      return `<tr>
        <th scope="row"><span class="bill-num">${esc(i.number)}</span><span class="bill-month">${esc(month)}</span></th>
        ${hasAmount ? `<td class="bill-amt">${esc(amount)}</td>` : ''}
        <td class="bill-st"><span class="badge tone-${st[1]}">${icon(st[2])}${st[0]}</span></td>
        <td class="bill-due">${i.due ? esc(day(i.due)) : ''}${i.paid ? `<span class="bill-paid">Paid ${esc(day(i.paid))}</span>` : ''}</td>
        <td class="bill-act">${btn}</td>
      </tr>`;
    };
    const head = `<tr><th scope="col">Bill</th>${hasAmount ? '<th scope="col">Amount</th>' : ''}<th scope="col">Status</th><th scope="col">Due date</th><th scope="col"><span class="sr-only">Pay or see the bill</span></th></tr>`;
    const table = (/** @type {any[]} */ rows) => `<div class="table-wrap bills-wrap" tabindex="0" role="region" aria-label="Your bills"><table class="bills"><thead>${head}</thead><tbody>${rows.map(row).join('')}</tbody></table></div>`;
    if (!list.length) return `<section class="card bills-card" id="bills" tabindex="-1" aria-labelledby="h-bills"><div class="sec-head"><h2 id="h-bills">Your bills</h2></div>${UI.EmptyState({ icon: 'file', title: 'No bills yet.', text: 'Your first one shows here when Stripe sends it.' })}</section>`;
    return `<section class="card bills-card" id="bills" tabindex="-1" aria-labelledby="h-bills">
      <div class="sec-head"><h2 id="h-bills">Your bills</h2><p class="sec-meta">Newest first</p></div>
      ${table(list.slice(0, SHOWN))}
      ${list.length > SHOWN ? `<details class="fold fold-invoices"><summary>See older bills${icon('chevron-down')}</summary>${table(list.slice(SHOWN))}</details>` : ''}
      <p class="meta bills-foot">Links open Stripe, our payment service. A bill that is still being checked does not show here yet.</p>
    </section>`;
  }


  Object.assign(D8.plan, { overview, confirmed, payment, bills, daysLeft });
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ui/plan-picker.js */
// @ts-check
/*
 * Choosing next month (2026-10-13): the deadline card, the plan and service cards, the "Check your changes" panel and the
 * wiring that redraws them from the plan model. Nothing is saved until Confirm, and the database checks the rule again.
 * Shared helpers come from plan.js and plan-billing.js. No price is written here.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const UI = D8.ui;
  const esc = F.esc;
  const icon = UI.icon;
  const day = (/** @type {string} */ x) => F.date(x);
  const svc = (/** @type {string} */ id) => D8.data.SERVICES[id] || { label: id, icon: 'layers' };
  const { price, perMonth, sample, ico, ABOUT, blurb, chips, stamp, timeline } = D8.plan;
  const daysLeft = (/** @type {any} */ m) => D8.plan.daysLeft(m);

  /* ---- the picker for next month ------------------------------------------------------------------------------ */

  /** The radio cards for the plans. @param {any} m @param {{planId: string}} st */
  function planCards(m, st) {
    // The dearest plan first, as in the designs
    return m.menu.slice().reverse().map((/** @type {any} */ p) => {
      const pr = price(p);
      // A plan an owner locked, or one with a client limit that is full, takes nobody new: its card says so and cannot be chosen
      // (a client already on it sees the usual card and can pick it again)
      const shut = !p.current && (!!p.locked || !!p.full);
      const tag = p.current ? '<span class="chip-now">Your plan now</span>' : p.locked ? `<span class="chip-now">${icon('lock')}Locked right now</span>` : p.full ? '<span class="chip-now">Taken right now</span>' : '';
      return `<label class="plan-opt${shut ? ' is-shut' : ''}" data-plan="${esc(p.id)}"><input class="pk-input" type="radio" name="plan" value="${esc(p.id)}"${st.planId === p.id ? ' checked' : ''}${shut ? ' disabled' : ''}>
        <span class="po-card"><span class="po-mark" aria-hidden="true">${icon('check')}</span><span class="po-title">${esc(p.name)}</span>${pr ? `<span class="po-cost"><strong>${esc(pr)}</strong>/month</span>` : ''}<span class="po-blurb">${esc(blurb(p))}</span>${tag}</span></label>`;
    }).join('');
  }

  /** How many of the picks the client has made: Ads (and anything else the plan includes) is not a pick. @param {any} r a plan rule @param {string[]} picks */
  const pickedOf = (r, picks) => picks.filter((/** @type {string} */ x) => !r.fixed.includes(x)).length;
  /** The step's heading: only the picks are counted, Ads is shown as included. @param {any} r a plan rule */
  const stepTitle = (r) => `Step 2. Choose ${r.choose} ${r.choose === 1 ? 'service' : 'services'}`;

  /** The services to pick from, for the plan chosen. @param {any} m @param {{planId: string, picks: string[], option: string|null}} st */
  function serviceCards(m, st) {
    const plan = m.menu.find((/** @type {any} */ p) => p.id === st.planId);
    const r = plan.rule;
    const free = st.picks.filter((/** @type {string} */ x) => !r.fixed.includes(x)).length;
    const full = free >= r.choose;
    return D8.planModel.ORDER.map((/** @type {string} */ id) => {
      const s = plan.services.find((/** @type {any} */ x) => x.id === id);
      const fixed = r.fixed.includes(id);
      const on = fixed || st.picks.includes(id);
      const blocked = !on && full;
      const sum = s && s.summary;
      const now = m.now.picks.includes(id) ? '<span class="chip-now is-on">On now</span>' : '';
      // Starter's website time is one of two: a pair of pills, the radio over each so the whole pill is the control.
      const option = st.planId === 'starter' && id === 'website' && on
        ? `<fieldset class="web-opt"><legend>How do you want to use your website time?</legend><div class="web-choices">
            <label class="web-choice"><input class="pk-input" type="radio" name="web" value="page"${st.option === 'page' ? ' checked' : ''}><span class="web-pill">${icon('check')}1 new page a month</span></label>
            <label class="web-choice"><input class="pk-input" type="radio" name="web" value="edits"${st.option === 'edits' ? ' checked' : ''}><span class="web-pill">${icon('check')}2 website edits a month</span></label></div></fieldset>` : '';
      return `<div class="svc-opt${on ? ' is-on' : ''}${blocked ? ' is-blocked' : ''}${fixed ? ' is-fixed' : ''}" data-svc="${esc(id)}">
        <label class="so-main"><input class="pk-input" type="checkbox" name="svc" value="${esc(id)}"${on ? ' checked' : ''}${fixed || blocked ? ' disabled' : ''}>
          <span class="so-mark" aria-hidden="true">${icon('check')}</span>
          ${ico(id)}
          <span class="so-text"><span class="so-name">${esc(svc(id).label)}${now}${fixed ? '<span class="chip-now">Included</span>' : ''}</span><span class="so-about">${esc(/** @type {any} */ (ABOUT)[id] || '')}</span>
          ${sum ? `<span class="so-limit">${esc(sum)} ${sample()}</span>` : ''}
          ${blocked ? `<span class="so-block">You already picked ${r.choose}. Untick ${r.choose === 1 ? 'it' : 'one'} to choose this instead.</span>` : ''}</span>
        </label>${option}</div>`;
    }).join('');
  }

  /** "Check your changes": now, from, what stays, arrives and stops, today, what happens next, and the buttons. @param {any} m @param {any} pv a preview */
  function panel(m, pv, st) {
    const c = m.now;
    const d = pv && pv.draft;
    const was = price(c);
    if (!pv || !d) return '<p class="meta">Choose a plan to see what changes.</p>';
    const will = price(d);
    const rows = D8.planModel.ORDER.filter((/** @type {string} */ id) => pv.change.keeps.includes(id) || pv.change.adds.includes(id) || pv.change.stops.includes(id)).map((/** @type {string} */ id) => {
      const kind = pv.change.adds.includes(id) ? 'adds' : pv.change.stops.includes(id) ? 'stops' : 'keeps';
      const ds = d.services.find((/** @type {any} */ x) => x.id === id);
      const text = kind === 'keeps' ? 'No change. Same work, same team.' : kind === 'adds' ? (ds && ds.summary ? ds.summary : 'We start it next month.') : `Paused after ${day(m.lastDay)}. Your work is saved, not deleted.`;
      return `<li class="chg-row is-${kind}"><span class="chg-tag">${{ keeps: 'Keeps', adds: 'Adds', stops: 'Stops' }[kind]}</span><div><p class="chg-name">${esc(svc(id).label)}</p><p class="chg-text">${esc(text)}</p></div></li>`;
    }).join('');
    const more = pv.moreMinor !== null && pv.moreMinor !== undefined && pv.moreMinor !== 0 ? `<span class="pk-more${pv.moreMinor < 0 ? ' is-less' : ''}">${esc(F.money(Math.abs(pv.moreMinor), d.currency))} ${pv.moreMinor > 0 ? 'more' : 'less'}</span>` : '';
    const tl = timeline([
      { state: 'todo', title: 'Today: you confirm', text: `Your choice is saved. Nothing is charged today.` },
      { state: 'todo', title: `Until ${esc(day(m.lastDay))}`, text: `${esc(F.list(c.services.map((/** @type {any} */ s) => s.label)))} keep running as normal.` },
      { state: 'todo', title: esc(day(m.bill)), text: `${esc(d.name)} starts.${will ? ` Your bill is ${esc(will)}.` : ''}` }
    ]);
    const verb = pv.change.planChanged ? `Confirm: switch to ${d.name}` : `Confirm: keep ${d.name}`;
    const err = !pv.valid ? pv.error : '';
    return `<div class="pk-panel-in">
      <div class="pk-ph"><h2 id="h-check">Check your changes</h2><a class="link" href="#step1">Change</a></div>
      <div class="pk-now"><p class="eyebrow">Now</p><div class="pk-line"><div><p class="pk-name">${esc(c.name)}</p><p class="pk-svcs">${esc(F.list(c.services.map((/** @type {any} */ s) => s.label)))}</p></div>${was ? `<p class="pk-cost"><strong>${esc(was)}</strong>/month</p>` : ''}</div></div>
      <p class="pk-down" aria-hidden="true">${icon('arrow-right')}</p>
      <div class="pk-from"><p class="eyebrow">From ${esc(day(m.bill))}</p><div class="pk-line"><div><p class="pk-name">${esc(d.name)}</p><p class="pk-svcs">${esc(F.list(d.services.map((/** @type {any} */ s) => s.label)))}</p></div>${will ? `<p class="pk-cost"><strong>${esc(will)}</strong>/month</p>` : ''}</div></div>
      ${rows ? `<ul class="chg-list is-panel">${rows}</ul>` : '<p class="meta pk-same">This is the same as this month.</p>'}
      <div class="pk-today"><p class="pk-row"><span>Nothing today</span></p><p class="pk-row is-next"><span>${esc(day(m.bill))} and each month after</span>${will ? '' : `<strong>${esc(d.name)}</strong>`}</p>${will ? `<p class="pk-big"><strong>${esc(will)}</strong>${more}</p>` : ''}</div>
      <h3 class="po-h">What happens next</h3>${tl}
      <p class="form-error" id="pk-error" role="alert"${err ? '' : ' hidden'}>${err ? icon('alert') + '<span>' + esc(err) + '</span>' : ''}</p>
      <button class="btn btn-primary btn-block pk-confirm" type="button" data-pick="confirm"${pv.valid ? '' : ' disabled'}>${icon('lock')}${esc(verb)}</button>
      <p class="pk-lock">Locks your services for ${esc(day(m.lock.from))} to ${esc(day(m.lock.to))}.</p>
      ${pv.same ? '' : '<a class="btn btn-glass btn-block" href="#/billing">Keep my current plan</a>'}
    </div>`;
  }

  /**
   * Where the picker starts: what is already chosen for next month, or this month. A month from before the Ads-plus rules
   * (more services than the plan lets a client pick) is trimmed to Ads and the first services that fit. @param {any} m
   * @returns {{planId: string, picks: string[], option: string|null}}
   */
  function startState(m) {
    const start = m.next || m.now;
    const st = { planId: start.planId, picks: start.picks.slice(), option: start.websiteOption || null };
    fitState(m, st);
    return st;
  }
  /** Keeps the picks a plan allows when the plan or a pick changes: the fixed services first, no more than the plan lets them choose. @param {any} m @param {{planId: string, picks: string[], option: string|null}} st */
  function fitState(m, st) {
    const r = m.menu.find((/** @type {any} */ p) => p.id === st.planId).rule;
    st.picks = D8.planModel.ordered(st.picks);
    for (const f of r.fixed) if (!st.picks.includes(f)) st.picks.unshift(f);
    const free = st.picks.filter((/** @type {string} */ x) => !r.fixed.includes(x));
    st.picks = [...r.fixed, ...free.slice(0, r.choose)];
    if (!(st.planId === 'starter' && st.picks.includes('website'))) st.option = null;
    else if (!st.option) st.option = 'edits';
  }

  /** The banner above the picker: the last day to change, and what happens if they do nothing. @param {any} m */
  function deadline(m) {
    return `<section class="card pk-deadline" aria-labelledby="h-deadline">
      <span class="dl-ico" aria-hidden="true">${icon('calendar')}</span>
      <div class="dl-text"><h2 id="h-deadline">Make changes by ${esc(stamp(m.lastDay))} ${esc(m.zone)}</h2><p>Do nothing and your plan stays the same. Changes start on your next bill, ${esc(day(m.bill))}.</p></div>
      ${daysLeft(m)}
    </section>`;
  }

  /**
   * The whole picker: the two steps and the panel, from where the client starts. mountPicker keeps it up to date.
   * @param {any} m
   */
  function picker(m) {
    const st = startState(m);
    const pv = D8.planModel.preview(m, { planId: st.planId, picks: st.picks, websiteOption: st.option });
    const plan = m.menu.find((/** @type {any} */ p) => p.id === st.planId);
    const r = plan.rule;
    const total = r.choose;
    const have = pickedOf(r, st.picks);
    return `<div class="picker" id="picker">
      <div class="pk-main">
        <section class="pk-step" aria-labelledby="step1"><h2 class="step-h" id="step1" tabindex="-1">Step 1. Choose a plan</h2>
          <fieldset class="plan-choices"><legend class="sr-only">Your plan for next month</legend>${planCards(m, st)}</fieldset></section>
        <section class="pk-step" aria-labelledby="step2"><div class="step-head"><h2 class="step-h" id="step2">${stepTitle(r)}</h2><span class="pick-count${have === total ? ' is-done' : ''}" id="pick-count" aria-live="polite">${icon('check')}${have} of ${total} picked</span></div>
          <fieldset class="svc-choices" id="svc-choices"><legend class="sr-only">Services for next month</legend>${serviceCards(m, st)}</fieldset>
          <p class="pick-help">${icon('info')}<span>Not sure? <a class="link" href="#/messages">Message Karan</a> and we will help you choose. You can change your picks as many times as you like until ${esc(day(m.lastDay))}.</span></p></section>
      </div>
      <aside class="card pk-panel" id="pk-panel" aria-labelledby="h-check">${panel(m, pv, st)}</aside>
      <div class="pk-bar" id="pk-bar"><div><p class="pk-bar-name" id="pk-bar-name"></p><p class="pk-bar-sub" id="pk-bar-sub"></p></div><a class="btn btn-primary" href="#pk-panel">Review</a></div>
    </div>`;
  }

  /**
   * Wires the picker: choosing a plan or a service redraws the cards and the panel from the model, and Confirm saves.
   * Nothing changes until Confirm. @param {HTMLElement} el the page @param {any} ctx @param {any} m the plan model @param {(r: any) => void} done
   */
  function mountPicker(el, ctx, m, done) {
    const root_ = /** @type {HTMLElement|null} */ (el.querySelector('#picker'));
    if (!root_) return;
    const st = startState(m);
    const plan = () => m.menu.find((/** @type {any} */ p) => p.id === st.planId);
    const preview = () => D8.planModel.preview(m, { planId: st.planId, picks: st.picks, websiteOption: st.option });
    const html = (/** @type {string} */ sel) => /** @type {HTMLElement} */ (root_.querySelector(sel));
    let busy = false;

    /**
     * Redraws from the state. `just` names the card the client just touched: it alone gets the "is-just" class, so only
     * its mark pops (the picker is "is-live" after the first change, so nothing pops on load).
     * @param {string} [focus] @param {{kind: string, id: string}} [just]
     */
    function sync(focus, just) {
      fitState(m, st);
      const pv = preview();
      html('#svc-choices').innerHTML = serviceCards(m, st);
      html('#pk-panel').innerHTML = panel(m, pv, st);
      const r = plan().rule;
      const have = pickedOf(r, st.picks);
      const count = html('#pick-count');
      count.className = 'pick-count' + (have === r.choose ? ' is-done' : '');
      count.innerHTML = `${icon('check')}${have} of ${r.choose} picked`;
      html('#step2').textContent = stepTitle(r);
      root_.querySelectorAll('.plan-opt[data-plan]').forEach((n) => {
        n.classList.toggle('is-on', n.getAttribute('data-plan') === st.planId);
        n.classList.toggle('is-just', !!just && just.kind === 'plan' && n.getAttribute('data-plan') === just.id);
      });
      if (just && just.kind === 'svc') { const c = root_.querySelector(`.svc-opt[data-svc="${just.id}"]`); if (c) c.classList.add('is-just'); }
      if (just && just.kind === 'web') { const w = root_.querySelector(`.web-choice .pk-input[value="${just.id}"]`); if (w && w.parentElement) w.parentElement.classList.add('is-just'); }
      const d = pv && pv.draft;
      html('#pk-bar-name').textContent = d ? `${d.name}${price(d) ? ` · ${price(d)}/month` : ''}` : '';
      html('#pk-bar-sub').textContent = d ? `From ${day(m.bill)} · Nothing today` : '';
      // Focus follows the card, without scrolling the page to it: the client is already there.
      if (focus) { const f = /** @type {HTMLElement|null} */ (root_.querySelector(focus)); if (f) f.focus({ preventScroll: true }); }
    }
    root_.addEventListener('change', (e) => {
      const t = /** @type {HTMLInputElement} */ (e.target);
      if (!t || !t.name) return;
      root_.classList.add('is-live');
      if (t.name === 'plan') { st.planId = t.value; sync(`input[name="plan"][value="${t.value}"]`, { kind: 'plan', id: t.value }); }
      else if (t.name === 'svc') {
        st.picks = t.checked ? [...st.picks, t.value] : st.picks.filter((/** @type {string} */ x) => x !== t.value);
        if (t.value === 'website' && !t.checked) st.option = null;
        sync(`input[name="svc"][value="${t.value}"]`, { kind: 'svc', id: t.value });
      } else if (t.name === 'web') { st.option = t.value; sync(`input[name="web"][value="${t.value}"]`, { kind: 'web', id: t.value }); }
    });
    // The panel keeps Confirm in reach: beside the steps it is sticky, and when it is taller than the window it sticks
    // by its foot instead (the stylesheet reads its height from --pk-h). On a phone the bottom bar steps aside while
    // the panel itself is on screen.
    const aside = html('#pk-panel');
    const bar = html('#pk-bar');
    if (typeof root.ResizeObserver === 'function') new root.ResizeObserver(() => { aside.style.setProperty('--pk-h', `${aside.offsetHeight}px`); }).observe(aside);
    if (bar && typeof root.IntersectionObserver === 'function') {
      new root.IntersectionObserver((entries) => { bar.classList.toggle('is-away', entries.some((x) => x.isIntersecting)); }, { rootMargin: '0px 0px -120px 0px' }).observe(aside);
    }
    root_.addEventListener('click', (e) => {
      const b = /** @type {HTMLElement|null} */ ((/** @type {HTMLElement} */ (e.target)).closest('[data-pick="confirm"]'));
      if (!b || busy) return;
      const btn = /** @type {HTMLButtonElement} */ (b);
      const err = html('#pk-error');
      err.hidden = true;
      if (D8.data.READ_ONLY) { err.innerHTML = `${icon('alert')}<span>${esc(D8.data.DEMO_NOTE)}</span>`; err.hidden = false; return; }
      busy = true;
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Saving';
      D8.dialogs.slow(ctx.client.savePicks(st.planId, st.picks, st.option), 'Billing').then((r) => { busy = false; done(r); }).catch((/** @type {any} */ x) => {
        busy = false;
        btn.disabled = false;
        btn.innerHTML = label;
        err.innerHTML = `${icon('alert')}<span>${esc(x && x.code === 'slow' ? x.message : `We couldn't save that, so nothing changed. ${(x && x.message) || ''}`)}</span>`;
        err.hidden = false;
      });
    });
    sync();
  }

  Object.assign(D8.plan, { deadline, picker, mountPicker });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/plan-ask.js */
// @ts-check
/*
 * The limit check inside "Ask for a change" (2026-10-13): the note under the form that says how the request fits this
 * month's limit, or that an urgent fix never counts. The numbers come from D8.planModel.askPreview(). Shared helpers: plan.js.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const UI = D8.ui;
  const esc = F.esc;
  const icon = UI.icon;

  /**
   * The line under the form that says how the request fits this month's limit. @param {any} a an askPreview() result
   * @param {{urgent?: boolean}} [o]
   */
  function askNote(a, o = {}) {
    if (o.urgent) return `<div class="ask-note is-urgent">${icon('check')}<p>Changing hours, a closure, your phone number or a sold-out item? Those are urgent info fixes and <strong>never count toward your plan</strong>.</p></div>`;
    if (!a) return '';
    if (!a.known) return a.over ? `<div class="ask-note is-over">${icon('alert')}<p><strong>This is not part of your plan this month.</strong> Karan will reply with options before anything happens. Nothing is charged without your OK.</p></div>` : '';
    const unit = a.line.unit;
    const have = a.line.atOnce ? `You have ${a.used} of ${a.cap} ${esc(unit)}` : `You have used ${a.used} of ${a.cap} ${esc(unit)}${a.line.atOnce ? '' : ' this month'}`;
    if (a.over) {
      return `<div class="ask-note is-over">${icon('alert')}<div><p><strong>This is over your plan for this month.</strong> ${have}, so this would make ${a.would}. Karan will reply with options before anything happens. Nothing is charged without your OK.</p>
        <div class="bar is-full" role="img" aria-label="${a.would} of ${a.cap}"><span style="width:100%"></span></div><p class="ask-sum">${a.used} used + ${a.qty} asked = ${a.would} of ${a.cap} ${esc(unit)}</p></div></div>`;
    }
    return `<div class="ask-note is-ok">${icon('info')}<div><p>${have}. This would make ${a.would}.</p>
      <div class="bar" role="img" aria-label="${a.would} of ${a.cap}"><span style="width:${a.pct}%"></span></div></div></div>`;
  }

  Object.assign(D8.plan, { askNote });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/charts.js */
// @ts-check
/*
 * One chart type: a daily line for the chosen period, with the previous period as a dashed
 * line for comparison. Drawn at the element's real width (redrawn on resize) so the labels
 * stay legible on a phone. Hover shows the day's figures; the same figures are always
 * available as a table under the chart for keyboard and screen-reader users.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const T = D8.time;

  /** @param {number} v */
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }

  /** @param {HTMLElement} host */
  function draw(host) {
    const data = JSON.parse(host.getAttribute('data-points') || '[]');
    if (!data.length) return;
    const days = Number(host.getAttribute('data-days')) || data.length;
    const unit = host.getAttribute('data-unit') || '';
    const W = Math.max(260, Math.floor(host.clientWidth));
    if (host.getAttribute('data-w') === String(W)) return;
    host.setAttribute('data-w', String(W));
    const H = host.clientHeight || 200;
    const P = { l: 6, r: 44, t: 12, b: 28 };
    const iw = W - P.l - P.r;
    const ih = H - P.t - P.b;
    const vals = [];
    for (const p of data) { if (p.v !== null) vals.push(p.v); if (p.p !== null) vals.push(p.p); }
    const max = niceMax(Math.max(1, ...vals));
    const x = (i) => P.l + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
    const y = (v) => P.t + (1 - v / max) * ih;
    const path = (key) => {
      let d = '';
      let pen = false;
      data.forEach((p, i) => {
        if (p[key] === null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p[key]).toFixed(1);
        pen = true;
