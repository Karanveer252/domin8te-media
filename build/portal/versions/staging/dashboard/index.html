      });
      return d;
    };
    const idx = data.map((p, i) => (p.v === null ? -1 : i)).filter((i) => i >= 0);
    const area = idx.length > 1
      ? 'M' + x(idx[0]).toFixed(1) + ',' + y(0) + idx.map((i) => 'L' + x(i).toFixed(1) + ',' + y(data[i].v).toFixed(1)).join('') + 'L' + x(idx[idx.length - 1]).toFixed(1) + ',' + y(0) + 'Z'
      : '';
    const grid = [0, max / 2, max].map((t) =>
      `<line class="c-grid" x1="${P.l}" x2="${W - P.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="c-y" x="${W - P.r + 8}" y="${(y(t) + 4).toFixed(1)}">${F.num(Math.round(t * 10) / 10)}</text>`).join('');
    const marks = [0, Math.floor((data.length - 1) / 2), data.length - 1];
    const xl = marks.map((i, k) => `<text class="c-x" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${F.date(data[i].d)}</text>`).join('');
    const last = idx.length ? idx[idx.length - 1] : -1;
    const end = last >= 0 ? `<circle class="c-end" cx="${x(last).toFixed(1)}" cy="${y(data[last].v).toFixed(1)}" r="4.5"/>` : '';
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${grid}<path class="c-area" d="${area}"/><path class="c-prev" d="${path('p')}"/><path class="c-cur" d="${path('v')}"/>${end}<line class="c-cross" x1="0" x2="0" y1="${P.t}" y2="${P.t + ih}" visibility="hidden"/><circle class="c-dot-prev" r="3.5" visibility="hidden"/><circle class="c-dot" r="5" visibility="hidden"/>${xl}</svg><div class="chart-tip" aria-hidden="true" hidden></div>`;

    const svg = /** @type {SVGSVGElement} */ (host.querySelector('svg'));
    const tip = /** @type {HTMLElement} */ (host.querySelector('.chart-tip'));
    const cross = /** @type {SVGLineElement} */ (svg.querySelector('.c-cross'));
    const dot = /** @type {SVGCircleElement} */ (svg.querySelector('.c-dot'));
    const dotPrev = /** @type {SVGCircleElement} */ (svg.querySelector('.c-dot-prev'));
    const show = (i) => {
      const p = data[i];
      const px = x(i);
      cross.setAttribute('x1', px.toFixed(1));
      cross.setAttribute('x2', px.toFixed(1));
      cross.setAttribute('visibility', 'visible');
      if (p.v !== null) { dot.setAttribute('cx', px.toFixed(1)); dot.setAttribute('cy', y(p.v).toFixed(1)); dot.setAttribute('visibility', 'visible'); } else dot.setAttribute('visibility', 'hidden');
      if (p.p !== null) { dotPrev.setAttribute('cx', px.toFixed(1)); dotPrev.setAttribute('cy', y(p.p).toFixed(1)); dotPrev.setAttribute('visibility', 'visible'); } else dotPrev.setAttribute('visibility', 'hidden');
      const prevDay = T.isoDay(T.dayNum(p.d) - days);
      tip.innerHTML = `<strong>${F.date(p.d)}</strong><span>${p.v === null ? 'No numbers' : F.num(p.v) + ' ' + F.esc(unit)}</span><span class="tip-prev">${F.date(prevDay)}: ${p.p === null ? 'no numbers' : F.num(p.p)}</span>`;
      tip.hidden = false;
      const tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + 'px';
    };
    const hide = () => {
      tip.hidden = true;
      for (const el of [cross, dot, dotPrev]) el.setAttribute('visibility', 'hidden');
    };
    host.onpointermove = (e) => {
      const r = svg.getBoundingClientRect();
      const i = Math.round(((e.clientX - r.left - P.l) / iw) * (data.length - 1));
      show(Math.max(0, Math.min(data.length - 1, i)));
    };
    host.onpointerleave = hide;
  }

  const observer = typeof ResizeObserver !== 'undefined'
    ? new ResizeObserver((entries) => entries.forEach((e) => draw(/** @type {HTMLElement} */ (e.target))))
    : null;

  /** Draws every chart inside `scope` and keeps it sized to its container. @param {ParentNode} scope */
  function mountAll(scope) {
    scope.querySelectorAll('.chart[data-points]').forEach((el) => {
      const host = /** @type {HTMLElement} */ (el);
      host.removeAttribute('data-w');
      draw(host);
      if (observer) observer.observe(host);
    });
  }

  D8.charts = { mountAll };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/dialogs.js */
// @ts-check
/*
 * Dialogs and toasts. One native <dialog> is reused: it traps focus, closes on Escape
 * (except while saving) and hands focus back to the button that opened it.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const esc = F.esc;
  const icon = (n, c) => D8.ui.icon(n, c);

  const dlg = () => /** @type {HTMLDialogElement} */ (document.getElementById('dlg'));
  const inner = () => /** @type {HTMLElement} */ (document.getElementById('dlg-inner'));
  /** @type {HTMLElement|null} */
  let returnTo = null;
  /** @type {null|(() => void)} */
  let onClosed = null;

  /* ---- toasts ------------------------------------------------------------------------ */

  /** @param {string} text @param {{tone?: string}} [o] */
  function toast(text, o = {}) {
    const box = document.getElementById('toasts');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast' + (o.tone ? ' tone-' + o.tone : '');
    el.innerHTML = `${icon(o.tone === 'error' ? 'alert' : 'check')}<p>${esc(text)}</p><button class="icon-btn" type="button" aria-label="Dismiss">${icon('x')}</button>`;
    const btn = /** @type {HTMLElement} */ (el.querySelector('button'));
    const remove = () => el.remove();
    btn.addEventListener('click', remove);
    box.appendChild(el);
    setTimeout(remove, 6000);
  }

  /* ---- the shell ----------------------------------------------------------------------- */

  function head(title, sub) {
    return `<div class="dlg-head"><div><h2 id="dlg-title" tabindex="-1">${esc(title)}</h2>${sub ? `<p class="dlg-sub">${sub}</p>` : ''}</div><button class="icon-btn dlg-x" type="button" data-dlg-close aria-label="Close">${icon('x')}</button></div>`;
  }

  /** Opens the dialog with `html` and moves focus to its title. */
  /** Counts dialogs opened, so a slow answer for an old one cannot draw over a newer one. */
  let gen = 0;
  function open(html, trigger, closed) {
    gen++;
    const d = dlg();
    returnTo = trigger || /** @type {HTMLElement|null} */ (document.activeElement);
    onClosed = closed || null;
    inner().innerHTML = html;
    d.removeAttribute('data-busy');
    if (!d.open) d.showModal();
    focusTitle();
  }
  function focusTitle() {
    const t = /** @type {HTMLElement|null} */ (document.getElementById('dlg-title'));
    if (t) t.focus();
  }
  /**
   * Everything that happens after a dialog closes: clear it, hand focus back, run the
   * follow-up (for example reloading the page's data after an approval). It runs straight
   * from close(), because Chrome only delivers the dialog's own "close" event on the next
   * animation frame, which never comes in a background tab.
   */
  function finish() {
    const d = dlg();
    if (d.open) return; // a newer dialog is already showing
    const cb = onClosed;
    const back = returnTo;
    onClosed = null;
    returnTo = null;
    if (inner().innerHTML) inner().innerHTML = '';
    if (back && document.contains(back)) back.focus();
    if (cb) cb();
  }
  function close() {
    const d = dlg();
    if (d.hasAttribute('data-busy')) return;
    if (d.open) d.close();
    finish();
  }
  function wire() {
    const d = dlg();
    // Escape takes the same path as the close button, and does nothing while saving.
    d.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
    // Safety net for any other way the dialog closes; finish() only acts once.
    d.addEventListener('close', finish);
    // A click on the backdrop closes, but only when the press started there too: dragging a text selection out of
    // the note box and letting go outside must not throw the note away.
    let downOnBackdrop = false;
    d.addEventListener('pointerdown', (e) => { downOnBackdrop = e.target === d; });
    d.addEventListener('click', (e) => {
      const t = /** @type {HTMLElement} */ (e.target);
      if (t.closest('[data-dlg-close]')) close();
      else if (t === d && downOnBackdrop) close(); // a click on the backdrop
      downOnBackdrop = false;
    });
  }

  function setBusy(on, button, label) {
    const d = dlg();
    if (on) d.setAttribute('data-busy', '1');
    else d.removeAttribute('data-busy');
    inner().querySelectorAll('button, textarea, input, select').forEach((el) => {
      const b = /** @type {HTMLButtonElement} */ (el);
      if (b.hasAttribute('data-dlg-close') && !on) { b.disabled = false; return; }
      b.disabled = on;
    });
    if (button) {
      if (on) {
        button.setAttribute('data-label', button.innerHTML);
        button.innerHTML = `<span class="spinner" aria-hidden="true"></span>${esc(label)}`;
        button.classList.add('is-busy');
      } else if (button.hasAttribute('data-label')) {
        button.innerHTML = button.getAttribute('data-label') || '';
        button.classList.remove('is-busy');
      }
    }
  }

  /** A request that never answers must not lock the dialog for ever. @param {Promise<any>} p @param {string} where @param {number} [ms] */
  function slow(p, where, ms) {
    return new Promise((res, rej) => {
      const t = setTimeout(() => rej(Object.assign(new Error(`Still waiting for an answer. Check ${where} before trying again, in case it went through.`), { code: 'slow' })), ms || 25000);
      p.then((v) => { clearTimeout(t); res(v); }, (e) => { clearTimeout(t); rej(e); });
    });
  }
  /** In the view-only demo: a line up front, so nobody types a long note first. */
  const demoLine = () => (D8.data.READ_ONLY ? `<div class="notice">${icon('info')}<p>${esc(D8.data.DEMO_NOTE)}</p></div>` : '');

  function fieldError(field, msg) {
    const input = /** @type {HTMLElement|null} */ (inner().querySelector(`[name="${field}"]`));
    const err = /** @type {HTMLElement|null} */ (inner().querySelector(`#err-${field}`));
    if (!input || !err) return false;
    if (msg) {
      err.innerHTML = `${icon('alert')}${esc(msg)}`;
      err.hidden = false;
      input.setAttribute('aria-invalid', 'true');
      input.focus();
    } else {
      err.hidden = true;
      input.removeAttribute('aria-invalid');
    }
    return true;
  }

  function formError(msg) {
    const box = /** @type {HTMLElement|null} */ (inner().querySelector('.form-error'));
    if (!box) return;
    box.innerHTML = msg ? `${icon('alert')}<span>${esc(msg)}</span>` : '';
    box.hidden = !msg;
  }

  /* ---- approvals ------------------------------------------------------------------------ */

  function preview(p) {
    if (!p) return '';
    if (p.type === 'posts') {
      return `<ol class="posts">${(p.items || []).map((it) => `<li class="post"><div class="post-img">${icon('image')}<span>${esc(it.image)}</span></div><div class="post-body"><p class="post-when">${esc(it.day)} <span class="meta">on ${esc(it.channels)}</span></p><p class="post-text">${esc(it.text)}</p></div></li>`).join('')}</ol>`;
    }
    if (p.type === 'hours') {
      return `<table class="hours"><caption class="sr-only">Proposed opening hours</caption><tbody>${(p.rows || []).map((r) => `<tr><th scope="row">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>`;
    }
    // Added for the agency console: a plain list, and a link to the draft (only https addresses).
    if (p.type === 'list') {
      return `<ul class="apv-list">${(p.items || []).map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`;
    }
    if (p.type === 'link' && /^https:\/\//.test(String(p.url || ''))) {
      return `<p class="apv-link"><a class="btn btn-glass" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.label || 'Open the draft')}${icon('external')}</a></p>`;
    }
    return '';
  }

  function decided(a, rec, now) {
    const ok = rec.decision === 'approved';
    return `<div class="confirm-state" role="status">
      <span class="confirm-icon tone-${ok ? 'success' : 'info'}">${icon(ok ? 'check' : 'edit')}</span>
      <h3>${ok ? 'Approved' : 'Changes requested'}</h3>
      <p>${esc(ok ? a.approve.done : a.change.done)}</p>
      ${rec.comment ? `<blockquote class="your-note"><p class="meta">Your note</p><p>${esc(rec.comment)}</p></blockquote>` : ''}
      <p class="audit">${icon('clock')}${ok ? 'Approved' : 'Changes requested'} by ${esc(rec.by)} on ${esc(F.date(rec.at))} at ${esc(F.time(rec.at))}</p>
      <div class="dlg-actions"><button class="btn btn-solid" type="button" data-dlg-close>Done</button></div>
    </div>`;
  }

  /** Review an item and approve it or ask for changes, with an optional note. */
  /** @param {string} id @param {HTMLElement} trigger @param {any} ctx @param {{note?: boolean}} [o] note: open with the note box ready (Ask for changes) */
  function approval(id, trigger, ctx, o) {
    let changed = false;
    open(head('Loading', '') + `<div class="dlg-body">${D8.ui.Skeleton('text', 3)}</div>`, trigger, () => { if (changed) ctx.afterChange(); });
    const my = gen;
    ctx.client.getApproval(id).then((a) => {
      if (my !== gen) return; // another dialog opened while this one loaded
      const now = ctx.client.now();
      const svc = D8.data.SERVICES[a.service];
      const due = a.due ? F.due(a.due, now) : null;
      const label = esc(svc ? svc.label : '');
      const sub = due ? `${label} · <span class="due tone-${due.tone}">${esc(due.text)}</span>` : label;
      // Once answered, no "Due" or "Overdue" any more.
      if (a.decision) {
        inner().innerHTML = head(a.title, label) + `<div class="dlg-body">${decided(a, a.decision, now)}</div>`;
        focusTitle();
        return;
      }
      inner().innerHTML = head(a.title, sub) + `<div class="dlg-body">
        <p class="dlg-intro">${esc(a.intro)}</p>
        ${preview(a.preview)}
        <form class="dlg-form" novalidate>
          <div class="field">
            <label for="apv-comment">Note for us <span class="optional">(needed if you ask for changes)</span></label>
            <textarea id="apv-comment" name="comment" rows="3" maxlength="1000" aria-describedby="err-comment"></textarea>
            <p class="field-error" id="err-comment" hidden></p>
          </div>
          ${demoLine()}
          <p class="form-error" role="alert" hidden></p>
          <div class="dlg-actions">
            <button class="btn btn-tint" type="submit" value="approved">${esc(a.approve.label)}</button>
            <button class="btn btn-glass" type="submit" value="changes">${esc(a.change.label)}</button>
          </div>
        </form></div>`;
      focusTitle();
      const form = /** @type {HTMLFormElement} */ (inner().querySelector('form'));
      if (o && o.note) { const box = /** @type {HTMLTextAreaElement|null} */ (form.querySelector('#apv-comment')); if (box) box.focus(); }
      // Older Safari does not say which button sent the form; never guess "approved" from that.
      /** @type {HTMLButtonElement|null} */ let clicked = null;
      form.querySelectorAll('button[type=submit]').forEach((b) => b.addEventListener('click', () => { clicked = /** @type {HTMLButtonElement} */ (b); }));
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = /** @type {HTMLButtonElement} */ (/** @type {SubmitEvent} */ (e).submitter || clicked);
        if (!btn) return;
        const decision = btn.value === 'changes' ? 'changes' : 'approved';
        const comment = /** @type {HTMLTextAreaElement} */ (form.elements.namedItem('comment')).value;
        fieldError('comment', '');
        formError('');
        if (decision === 'changes' && !comment.trim()) { fieldError('comment', 'Tell us what to change so we can fix it.'); return; }
        if (D8.data.READ_ONLY) { formError(D8.data.DEMO_NOTE); return; }
        setBusy(true, btn, decision === 'approved' ? 'Saving' : 'Sending');
        slow(ctx.client.decide(id, decision, comment), 'Home').then((rec) => {
          changed = true;
          setBusy(false);
          inner().innerHTML = head(a.title, label) + `<div class="dlg-body">${decided(a, rec, ctx.client.now())}</div>`;
          focusTitle();
          toast(decision === 'approved' ? `${a.title}: approved.` : `${a.title}: changes requested.`);
        }).catch((err) => {
          setBusy(false, btn);
          if (err.code === 'already-decided' && err.previous) {
            changed = true;
            inner().innerHTML = head(a.title, label) + `<div class="dlg-body">${decided(a, err.previous, ctx.client.now())}</div>`;
            focusTitle();
          } else if (err.code === 'already-decided') {
            // Answered already, but the saved answer could not be read back: say so, do not say "nothing changed".
            changed = true;
            inner().innerHTML = head(a.title, label) + `<div class="dlg-body"><div class="notice">${icon('info')}<p>${esc(err.message)}</p></div><div class="dlg-actions"><button class="btn btn-solid" type="button" data-dlg-close>Done</button></div></div>`;
            focusTitle();
          } else if (err.field && fieldError(err.field, err.message)) {
            /* shown next to the field */
          } else if (err.code === 'slow') {
            formError(err.message);
          } else {
            formError(`We couldn't save your answer, so nothing changed. ${err.message || ''} Try again.`);
          }
        });
      });
    }).catch((err) => {
      if (my !== gen) return;
      inner().innerHTML = head('Something went wrong', '') + `<div class="dlg-body">${D8.ui.ErrorState({ title: "We couldn't open this.", text: err.message || 'Try again soon.' })}<div class="dlg-actions"><button class="btn btn-glass" type="button" data-dlg-close>Close</button></div></div>`;
      focusTitle();
    });
  }

  /* ---- outside pages: Stripe, Instagram, Clerk -------------------------------------------- */

  const OUTSIDE = {
    'billing-portal': { title: 'Update your payment method', where: 'Stripe', text: 'Stripe, our payment service, looks after your card on its own safe page. We never see the full card number.' },
    invoice: { title: 'Invoice', where: 'Stripe', text: 'Invoices open on Stripe, our payment service, with the amount and a PDF to download.' },
    'connect-instagram': { title: 'Reconnect Instagram', where: 'Instagram', text: "You sign in on Instagram's own page and pick the account we can post to. We never see your password." },
    'clerk-account': { title: 'Sign-in and security', where: 'our sign-in service', text: 'Our sign-in service looks after your email address, how you sign in, and where you are signed in.' }
  };

  /** The page context, kept from the last account button, so old Reconnect buttons can open the guide. */
  let lastCtx = /** @type {any} */ (null);
  function external(kind, id, trigger, ctx) {
    if (ctx) lastCtx = ctx;
    if (String(kind).startsWith('connect-') && lastCtx) { account(String(kind).slice(8), 'reconnect', trigger, lastCtx); return; }
    const o = OUTSIDE[kind] || (String(kind).startsWith('connect-') ? { title: 'Reconnect this account', where: 'the provider', text: "You sign in on that service's own page and choose what we can use. We never see your password." } : null);
    if (!o) return;
    // Viewing as a client (the console's read-only preview): Stripe's and the sign-in service's pages are the client's own.
    if (D8.data.viewAs) { toast(D8.data.DEMO_NOTE, { tone: 'error' }); return; }
    const b = /** @type {HTMLButtonElement|null} */ (trigger && trigger.tagName === 'BUTTON' ? trigger : null);
    if (b) b.disabled = true;
    const number = trigger && trigger.getAttribute('data-number');
    // An invoice that already carries its own payment page opens straight away; no billing function needed.
    const direct = trigger && trigger.getAttribute('data-url');
    if (kind === 'invoice' && direct && /^https:\/\/([a-z0-9-]+\.)*stripe\.com\//i.test(direct)) { root.open(direct, '_blank', 'noopener'); if (b) b.disabled = false; return; }
    // Live: sign-in and security is Clerk's own profile window.
    if (kind === 'clerk-account' && D8.live) {
      if (b) b.disabled = true;
      D8.live.clerk().then((c) => { if (!c.openUserProfile) throw new Error('no profile'); c.openUserProfile(); })
        .catch(() => toast('We could not open this. Press Message us and we change it for you.', { tone: 'error' }))
        .then(() => { if (b) b.disabled = false; });
      return;
    }
    D8.integrations.resolve(kind, id, number || undefined).then((url) => {
      if (b) b.disabled = false;
      if (url && /^https:\/\//.test(url)) { root.location.assign(url); return; }
      open(head(number ? `${o.title} ${number}` : o.title, '') + `<div class="dlg-body">
        <p class="dlg-intro">${esc(o.text)}</p>
        ${D8.live
          ? `<div class="notice">${icon('info')}<p>Online ${esc(o.where)} is not switched on for your account yet. Press <strong>Message us</strong> and we sort it out.</p></div>`
          : `<div class="notice">${icon('info')}<p><strong>This is a demo</strong>, so ${esc(o.where)} does not open and nothing changes. In your real portal, this button takes you to ${esc(o.where)} and back.</p></div>`}
        <div class="dlg-actions"><button class="btn btn-solid" type="button" data-dlg-close>Close</button></div></div>`, trigger);
    }).catch((/** @type {any} */ err) => {
      if (b) b.disabled = false;
      toast(err && err.code ? err.message : `We couldn't reach ${o.where}. Try again in a minute.`, { tone: 'error' });
    });
  }

  /* ---- connected accounts: connect, reconnect, disconnect (2026-10-09) ---------------------- */

  /* The steps on each app's own site, each with where to find the setting (Karan: "instructions to find the specific
     setting ... visible and easy to read"). **Words** are the buttons and menus to press, shown bold. Our business ID and
     access email come from the client record (team, set in the console's Settings) when there.
     Meta: Instagram, the Facebook page and the ad account are all shared from one screen, so one trip covers every
     Meta account they still need ("one Meta connection for all three"). */
  const askId = (/** @type {any} */ t) => t.metaBusinessId ? `**${t.metaBusinessId}**` : '(no ID yet? Press Message us and we send it)';
  // Our Google access email (2026-10-09, Karan: "add our email right here, don't ask them to message us"). The console's
  // Settings value wins when set; this is the default.
  const ACCESS_EMAIL = 'karanhelps@domin8temedia.com';
  const askMail = (/** @type {any} */ t) => `**${t.accessEmail || ACCESS_EMAIL}**`;
  const META_LIST = { instagram: ['Instagram accounts', 'your Instagram account'], facebook: ['Pages', 'your Facebook page'], 'meta-ads': ['Ad accounts', 'your ad account'] };
  const GUIDE = {
    meta: {
      where: "Meta's", link: 'https://business.facebook.com/settings/partners', button: 'Open Meta Business settings',
      on: (/** @type {string[]} */ ids, /** @type {any} */ t) => [
        { do: 'Press **Open Meta Business settings** below and sign in with the Facebook account that runs your restaurant.', where: 'It opens business.facebook.com. If you have more than one business, choose the restaurant at the top left.' },
        { do: 'In the menu on the left, press **Users**, then **Partners**.', where: 'No menu? Press **Settings**, the gear at the bottom left, first.' },
        { do: 'Press **Add**, then **Give a partner access to your business assets**.' },
        { do: `Type Domin8te's business ID ${askId(t)}, then press **Next**.` },
        { do: `On the left, open ${ids.length > 1 ? 'each of these' : 'this'} and tick yours. Switch on **Full control** for ${ids.length > 1 ? 'each one' : 'it'}.`, list: ids.map((id) => `**${META_LIST[/** @type {'instagram'} */ (id)][0]}**: tick ${META_LIST[/** @type {'instagram'} */ (id)][1]}`), where: 'Some screens say **Everything** instead of Full control.' },
        { do: 'Press **Save changes**.' }
      ],
      off: (/** @type {string[]} */ ids) => [
        { do: 'Press **Open Meta Business settings** below and sign in.' },
        { do: 'In the menu on the left, press **Users**, then **Partners**, then **Domin8te**.' },
        { do: `Find ${META_LIST[/** @type {'instagram'} */ (ids[0])][1]} under **${META_LIST[/** @type {'instagram'} */ (ids[0])][0]}** and press **Remove** next to it.` }
      ],
      tip: "Instagram not in the list? It has to join your business first: press **Accounts**, then **Instagram accounts**, then **Add**."
    },
    gbp: {
      where: "Google's", link: 'https://business.google.com/', button: 'Open Google Business Profile',
      on: (/** @type {string[]} */ ids, /** @type {any} */ t) => [
        { do: 'Press **Open Google Business Profile** below and sign in with the Google account that owns your listing.', where: 'Quickest way: search Google for **my business** while signed in. Your profile opens at the top.' },
        { do: 'Press the menu with **three dots**, then **Business Profile settings**.' },
        { do: 'Press **People and access**, then **Add**.', where: 'Older screens say **Managers** instead of People and access.' },
        { do: `Type Domin8te's email ${askMail(t)}, choose **Manager**, then press **Invite**.` }
      ],
      off: (/** @type {string[]} */ ids, /** @type {any} */ t) => [
        { do: 'Press **Open Google Business Profile** below and sign in.' },
        { do: 'Press the menu with **three dots**, then **Business Profile settings**, then **People and access**.' },
        { do: `Find ${askMail(t)} in the list, then press **Remove access**.` }
      ],
      tip: 'No Business Profile settings? Your Google account may not own the listing. Ask whoever set it up, or press Message us.'
    },
    analytics: {
      where: "Google's", link: 'https://analytics.google.com/', button: 'Open Google Analytics',
      on: (/** @type {string[]} */ ids, /** @type {any} */ t) => [
        { do: 'Press **Open Google Analytics** below and sign in.', where: "Check your restaurant's website is the one chosen at the top left." },
        { do: 'Press **Admin**, the gear at the bottom left.' },
        { do: 'In the **Property** column, press **Property access management**.' },
        { do: 'Press the blue **+** at the top right, then **Add users**.' },
        { do: `Type Domin8te's email ${askMail(t)}, tick **Viewer**, then press **Add**.` }
      ],
      off: (/** @type {string[]} */ ids, /** @type {any} */ t) => [
        { do: 'Press **Open Google Analytics** below and sign in.' },
        { do: 'Press **Admin**, then **Property access management**.' },
        { do: `Press the **three dots** on the row for ${askMail(t)}, then **Remove access**.` }
      ],
      tip: 'No Admin gear? Your login can only look, not change. Ask whoever set up Analytics, or press Message us.'
    },
    other: {
      where: '', link: '', button: '',
      on: () => [
        { do: 'Every booking system (OpenTable, Resy, SevenRooms and others) works a little differently.' },
        { do: 'Press **Tell us** below. We reply with the exact steps for yours, or set it up with you.' }
      ],
      off: () => [{ do: 'Press **Tell us** below.' }, { do: 'We stop using it and help you remove our access.' }],
      tip: ''
    }
  };
  /** Escapes, then turns **words** into bold. @param {string} x */
  const rich = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const WORKING = ['fresh', 'stale'];

  /** @param {string} id @param {string} mode connect, reconnect or disconnect @param {HTMLElement|null} trigger @param {any} ctx */
  function account(id, mode, trigger, ctx) {
    const srcs = ctx.account.sources || [];
    const s = srcs.find((/** @type {any} */ x) => x.id === id) || { id, name: id };
    const a = D8.data.ACCOUNTS[id] || { name: s.name, guide: 'other', asset: 'account', stops: 'use it' };
    const g = /** @type {any} */ (GUIDE)[a.guide] || GUIDE.other;
    const off = mode === 'disconnect';
    // One Meta trip: this account plus every other Meta account they need that isn't working or waiting yet.
    const ids = !off && a.guide === 'meta'
      ? [id, ...srcs.filter((/** @type {any} */ x) => x.id !== id && D8.data.ACCOUNTS[x.id] && D8.data.ACCOUNTS[x.id].guide === 'meta' && !x.pending && x.state !== 'error' && !WORKING.includes(x.state)).map((/** @type {any} */ x) => x.id)]
        .sort((p, q) => Object.keys(META_LIST).indexOf(p) - Object.keys(META_LIST).indexOf(q))
      : [id];
    const names = ids.map((x) => (srcs.find((/** @type {any} */ y) => y.id === x) || { name: (D8.data.ACCOUNTS[x] || {}).name || x }).name);
    const verb = off ? 'Disconnect' : mode === 'reconnect' ? 'Reconnect' : 'Connect';
    const title = ids.length > 1 ? `${verb} ${F.list(names)}` : `${verb} ${s.name}`;
    const steps = (off ? g.off : g.on)(ids, ctx.account.team || {});
    const intro = off
      ? `${g.where ? `You remove Domin8te on ${g.where} own page.` : 'We stop using it.'} While it is off, we can't ${a.stops}.`
      : g.where ? `About two minutes. You let Domin8te in on ${g.where} own page.${ids.length > 1 ? ` One trip connects all ${ids.length}.` : ''} We never see your password.` : 'We set this one up with you. We never see your password.';
    let sent = false;
    open(head(title, '') + `<div class="dlg-body">
      <p class="dlg-intro">${esc(intro)}</p>
      <ol class="guide-steps">${steps.map((/** @type {any} */ x) => `<li><p class="guide-do">${rich(x.do)}</p>${x.list ? `<ul class="guide-list">${x.list.map((/** @type {string} */ y) => `<li>${rich(y)}</li>`).join('')}</ul>` : ''}${x.where ? `<p class="guide-where">${icon('info')}<span>${rich(x.where)}</span></p>` : ''}</li>`).join('')}</ol>
      ${g.tip && !off ? `<p class="guide-tip">${icon('help')}<span><strong>Stuck?</strong> ${rich(g.tip)}</span></p>` : ''}
      ${g.link ? '<p class="meta">Menus move now and then. If yours looks different, press Message us and we help.</p>' : ''}
      ${demoLine()}
      <p class="form-error" role="alert" hidden></p>
      <div class="dlg-actions">${g.link ? `<a class="btn btn-glass" href="${g.link}" target="_blank" rel="noopener noreferrer">${esc(g.button)}${icon('external')}<span class="sr-only"> (opens in a new tab)</span></a>` : ''}<button class="btn btn-solid" type="button" data-account-done>${g.link ? "I've done it" : 'Tell us'}</button><button class="btn btn-glass" type="button" data-dlg-close>Cancel</button></div></div>`, trigger, () => { if (sent) ctx.afterChange(); });
    const done = /** @type {HTMLButtonElement} */ (inner().querySelector('[data-account-done]'));
    done.addEventListener('click', () => {
      formError('');
      if (D8.data.READ_ONLY) { formError(D8.data.DEMO_NOTE); return; }
      setBusy(true, done, 'Sending');
      slow(ctx.client.accountRequest(ids, mode), 'Settings').then(() => {
        sent = true;
        setBusy(false);
        const what = F.list(names);
        inner().innerHTML = head(`Thanks${ctx.session.firstName ? ', ' + ctx.session.firstName : ''}`, '') + `<div class="dlg-body"><div class="confirm-state" role="status"><span class="confirm-icon tone-success">${icon('check')}</span><h3>We got it.</h3><p>${off ? `We stop using ${esc(what)} and confirm it` : `We check ${esc(what)} ${ids.length > 1 ? 'work' : 'works'} and confirm it`}, usually within one working day. Until then ${ids.length > 1 ? 'they say' : 'it says'} Waiting for us to confirm.</p><div class="dlg-actions"><button class="btn btn-solid" type="button" data-dlg-close>Done</button></div></div></div>`;
        focusTitle();
        toast('Sent. We will confirm soon.');
      }).catch((/** @type {any} */ err) => {
        setBusy(false, done);
        formError(err.code === 'slow' ? err.message : `That did not send. ${err.message || ''} Try again.`);
      });
    });
  }

  /* ---- messages and change requests ------------------------------------------------------ */

  function compose(o, trigger, ctx) {
    const isRequest = o.mode === 'request';
    const svc = isRequest ? D8.data.SERVICES[o.service] : null;
    const pkg = ctx.account.package.services.filter((/** @type {string} */ x) => D8.data.SERVICES[x]);
    const title = isRequest ? (svc ? `Ask for a change: ${svc.label}` : 'Ask for a change') : 'Message us';
    // A request says which service it is for: this month's picks, or an urgent fix (hours, a closure, a phone number, a
    // sold-out item), which never counts toward the plan (2026-10-13). Once the plan has loaded it also asks how many, and
    // shows how that fits this month's limit before anything is sent.
    const pick = `<div class="field"><label for="msg-service">Which service?</label><select id="msg-service" name="service">${pkg.map((s) => `<option value="${esc(s)}"${s === o.service ? ' selected' : ''}>${esc(D8.data.SERVICES[s].label)}</option>`).join('')}<option value="urgent"${o.service === 'urgent' ? ' selected' : ''}>Urgent fix (hours, closure, phone, sold out)</option></select></div>
        <div class="ask-qty" id="ask-qty" hidden></div>`;
    const about = isRequest ? pick : `<div class="field"><label for="msg-about">What is it about?</label><select id="msg-about" name="about"><option value="general">Something else</option>${pkg.map((s) => `<option value="${esc(s)}">${esc(D8.data.SERVICES[s].label)}</option>`).join('')}<option value="billing">Billing</option></select></div>`;
    let sent = false;
    open(head(title, esc(D8.ui.replyLine(ctx.account.team.reply || ''))) + `<div class="dlg-body">
      <form class="dlg-form" novalidate>
        ${about}
        <div class="field">
          <label for="msg-text">${isRequest ? 'What would you like changed?' : 'Your message'}</label>
          <textarea id="msg-text" name="text" rows="5" maxlength="2000" aria-describedby="msg-hint err-text"></textarea>
          <p class="hint" id="msg-hint">${isRequest ? 'For example: swap the brunch photo for the one I sent on Monday.' : 'We read every message. If it is urgent, say so in the first line.'}</p>
          <p class="field-error" id="err-text" hidden></p>
        </div>
        ${isRequest ? '<div class="ask-note-box" id="ask-note" aria-live="polite"></div>' : ''}
        ${demoLine()}
        <p class="form-error" role="alert" hidden></p>
        <div class="dlg-actions"><button class="btn btn-solid" type="submit">${isRequest ? 'Send request' : 'Send message'}</button><button class="btn btn-glass" type="button" data-dlg-close>Cancel</button></div>
      </form></div>`, trigger, () => { if (sent) ctx.afterChange(); });
    const form = /** @type {HTMLFormElement} */ (inner().querySelector('form'));
    const submit = /** @type {HTMLButtonElement} */ (form.querySelector('[type=submit]'));
    const qtyBox = /** @type {HTMLElement|null} */ (form.querySelector('#ask-qty'));
    const noteBox = /** @type {HTMLElement|null} */ (form.querySelector('#ask-note'));
    /** This month's plan, once it has loaded: the limit check reads it. @type {any} */
    let plan = null;

    /** What the form is asking for right now: the service, the kind of work and how many, and how that fits the month's limit. */
    function asking() {
      const sel = /** @type {HTMLSelectElement|null} */ (form.elements.namedItem('service'));
      const service = sel ? sel.value : o.service;
      const urgent = service === 'urgent';
      const s = plan && plan.state === 'ok' && !urgent ? plan.now.services.find((/** @type {any} */ x) => x.id === service) : null;
      /** @type {any[]} */
      const lines = s ? s.lines : [];
      const m = /** @type {HTMLSelectElement|null} */ (form.elements.namedItem('metric'));
      const q = /** @type {HTMLInputElement|null} */ (form.elements.namedItem('qty'));
      const metric = lines.length ? (m && lines.some((l) => l.metric === m.value) ? m.value : lines[0].metric) : null;
      const qty = q ? Math.max(1, Math.min(100, Math.floor(Number(q.value)) || 1)) : 1;
      return { service, urgent, lines, metric, qty, preview: metric ? D8.planModel.askPreview(plan, service, metric, qty) : null };
    }
    /** Redraws the quantity row when the service changed, then the limit note and the button's words. @param {boolean} rebuild */
    function refresh(rebuild) {
      if (!isRequest || !qtyBox || !noteBox) return;
      if (rebuild) {
        const a = asking();
        if (!a.lines.length) { qtyBox.hidden = true; qtyBox.innerHTML = ''; } else {
          const one = a.lines.length === 1;
          qtyBox.hidden = false;
          qtyBox.innerHTML = `${one ? '' : `<div class="field"><label for="ask-metric">What kind of work?</label><select id="ask-metric" name="metric">${a.lines.map((l) => `<option value="${esc(l.metric)}">${esc(l.name)}</option>`).join('')}</select></div>`}
            <div class="field ask-n"><label for="ask-n">${one ? `How many ${esc(a.lines[0].unit)}?` : 'How many?'}</label><input id="ask-n" name="qty" type="number" min="1" max="100" step="1" value="1" inputmode="numeric"></div>`;
        }
      }
      const b = asking();
      noteBox.innerHTML = D8.plan.askNote(b.preview, { urgent: b.urgent });
      const over = !!(b.preview && b.preview.over);
      if (!submit.classList.contains('is-busy')) submit.textContent = over ? 'Send to Karan for a decision' : b.urgent ? 'Send urgent fix' : 'Send request';
    }
    if (isRequest) {
      form.addEventListener('change', (e) => { const t = /** @type {HTMLInputElement} */ (e.target); refresh(!!t && t.name === 'service'); });
      form.addEventListener('input', (e) => { const t = /** @type {HTMLInputElement} */ (e.target); if (t && t.name === 'qty') refresh(false); });
      // Without the plan the request still goes; it just is not checked against a limit here.
      ctx.client.getPlan().then((m) => { plan = m; if (document.contains(form)) refresh(true); }).catch(() => { /* no limit check */ });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = /** @type {HTMLTextAreaElement} */ (form.elements.namedItem('text')).value;
      const aboutEl = /** @type {HTMLSelectElement|null} */ (form.elements.namedItem('about'));
      fieldError('text', '');
      formError('');
      if (!text.trim()) { fieldError('text', isRequest ? 'Tell us what you would like changed.' : 'Write your message first.'); return; }
      const btn = /** @type {HTMLButtonElement} */ (form.querySelector('[type=submit]'));
      if (D8.data.READ_ONLY) { formError(D8.data.DEMO_NOTE); return; }
      const a = isRequest ? asking() : null;
      setBusy(true, btn, 'Sending');
      /** @type {{metric?: string|null, estQty?: number|null, urgent?: boolean}} */
      const extra = a ? (a.urgent ? { urgent: true } : a.metric ? { metric: a.metric, estQty: a.qty } : {}) : {};
      const p = slow(a ? ctx.client.sendRequest(a.service, text, extra) : ctx.client.sendMessage(aboutEl ? aboutEl.value : 'general', text), 'Messages');
      p.then((rec) => {
        sent = true;
        setBusy(false);
        const over = !!((rec && rec.overCap) || (a && a.preview && a.preview.over));
        const line = over
          ? 'This is over your plan for this month. Karan will reply with options before anything happens. Nothing is charged without your OK.'
          : a && a.urgent ? 'Urgent fixes go to the front of the line, and they never count toward your plan.'
            : `${ctx.account.team.reply ? D8.ui.replyLine(ctx.account.team.reply) + ' ' : ''}We'll answer here and by email.`;
        inner().innerHTML = head(isRequest ? (over ? 'Sent to Karan' : 'Request sent') : 'Message sent', '') + `<div class="dlg-body"><div class="confirm-state" role="status"><span class="confirm-icon tone-${over ? 'info' : 'success'}">${icon('check')}</span><h3>Thanks${ctx.session.firstName ? ', ' + esc(ctx.session.firstName) : ''}.</h3><p>${esc(line)}</p><p class="audit">${icon('clock')}Sent on ${esc(F.date(rec.at))} at ${esc(F.time(rec.at))}</p><div class="dlg-actions"><button class="btn btn-solid" type="button" data-dlg-close>Done</button></div></div></div>`;
        focusTitle();
        toast(isRequest ? (over ? 'Sent to Karan.' : 'Request sent.') : 'Message sent.');
      }).catch((err) => {
        setBusy(false, btn);
        if (!(err.field && fieldError(err.field, err.message))) formError(err.code === 'slow' ? err.message : `That did not send. ${err.message || ''} Try again.`);
      });
    });
  }

  /* ---- demo data ---------------------------------------------------------------------------- */

  /**
   * Preview mode: a development panel, never part of a client's account. It says plainly that
   * everything is demo data and switches between demo situations in place (no page load, so it
   * works from any page and with no server running), keeping the page you are on.
   */
  function demo(trigger, ctx) {
    const cur = D8.data.currentScenario();
    open(head('Preview mode', 'Demo data only. Not a client account.') + `<div class="dlg-body">
      <p class="dlg-intro">Everything here is made up. ${esc(ctx.account.business.name)} is not a real ${esc(ctx.account.business.kind.toLowerCase())}, and nothing is live. Stripe (our payment service), our sign-in service and the connected accounts are not hooked up, so their buttons tell you what would happen instead.</p>
      <h3 class="dlg-h3" id="scn-title">Try another situation</h3>
      <ul class="scenarios" aria-labelledby="scn-title">${D8.data.scenarios().map((s) => `<li><button class="scenario${s.id === cur.id ? ' is-current' : ''}" type="button" data-scenario="${esc(s.id)}"${s.id === cur.id ? ' aria-current="true"' : ''}><strong>${esc(s.label)}${s.id === cur.id ? '<span class="scn-now">Showing now</span>' : ''}</strong><span>${esc(s.about)}</span></button></li>`).join('')}</ul>
      <p class="meta">Tip: press Alt, Shift and P together to open this panel from any page.</p>
      <h3 class="dlg-h3">Start again</h3>
      <p>Clears the demo approvals, messages and settings.</p>
      <div class="dlg-actions"><button class="btn btn-glass" type="button" data-demo-reset>Reset the demo</button><button class="btn btn-glass" type="button" data-dlg-close>Close</button></div></div>`, trigger);
    inner().querySelectorAll('[data-scenario]').forEach((b) => b.addEventListener('click', () => {
      const id = b.getAttribute('data-scenario') || '';
      close();
      if (id !== cur.id && ctx.switchScenario) ctx.switchScenario(id);
    }));
    const reset = /** @type {HTMLButtonElement} */ (inner().querySelector('[data-demo-reset]'));
    reset.addEventListener('click', () => {
      setBusy(true, reset, 'Resetting');
      ctx.client.resetDemo().then(() => {
        setBusy(false, reset);
        close();
        ctx.afterChange();
        toast('Demo reset. Everything is back to the start.');
      });
    });
  }

  /* ---- confirm --------------------------------------------------------------------------- */

  /** @returns {Promise<boolean>} */
  function confirm(o, trigger) {
    return new Promise((resolve) => {
      let answer = false;
      open(head(o.title, '') + `<div class="dlg-body"><p class="dlg-intro">${esc(o.text)}</p><div class="dlg-actions"><button class="btn btn-solid" type="button" data-confirm-yes>${esc(o.yes)}</button><button class="btn btn-glass" type="button" data-dlg-close>${esc(o.no || 'Cancel')}</button></div></div>`, trigger, () => resolve(answer));
      const yes = /** @type {HTMLElement} */ (inner().querySelector('[data-confirm-yes]'));
      yes.addEventListener('click', () => { answer = true; close(); });
    });
  }

  D8.dialogs = { wire, open, close, approval, external, account, compose, demo, confirm, toast, slow };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui/pages.js */
// @ts-check
/*
 * The portal's pages. Each page renders its frame at once (with loading placeholders), then
 * fills each section from the data layer on its own, so one failing source never blanks
 * the page. A page is { title, render(ctx, route), mount(ctx, route, el) }; mount returns
 * { retry(section), change(name, value) } for the app's event handlers.
 */
(function (root) {
  'use strict';
  /** @type {any} */
  const D8 = (root.D8 = root.D8 || {});
  const F = D8.fmt;
  const UI = D8.ui;
  const esc = F.esc;
  const icon = UI.icon;
  const SVC = () => D8.data.SERVICES;
  // Design variants can ask for a Home order, a Coming up section and a Basic / Advanced switch
  // on Results (D8VARIANT.home, .reportModes). Without them, every page renders as in 16.
  /** @type {any} */
  const V = root.D8VARIANT || {};
  const HOME = V.home || {};
  /** A display preference kept in this browser, under the design's own name. */
  function pref(key, value) {
    const k = (V.storage || 'd8.v16') + '.' + key;
    try {
      if (value === undefined) return root.localStorage.getItem(k);
      root.localStorage.setItem(k, value);
    } catch (e) { /* storage blocked: the default applies */ }
    return null;
  }

  /** How long a section may take before the client is told, instead of watching a placeholder. */
  const SLOW_MS = 10000;
  let loadSeq = 0;

  /**
   * Fills one section from the data layer, and never leaves it loading for ever.
   * - First load: a shimmering placeholder, then the content, or a specific error with Try again.
   * - Later loads (Refresh, Try again, after an approval): what is on screen stays, dimmed, until
   *   the new answer arrives. If that fails, the old content stays with a note saying so.
   * - After SLOW_MS the client is told it is taking too long, with Try again. If the answer
   *   still arrives, it replaces the message.
   * - Only the newest load for a section may draw, so a slow old answer never overwrites a new one.
   * @param {ParentNode} scope @param {string} sel @param {() => Promise<any>} fetch
   * @param {(d: any) => string} draw @param {(e: any) => any} onError
   */
  function section(scope, sel, fetch, draw, onError) {
    const box = /** @type {HTMLElement|null} */ (scope.querySelector(sel));
    if (!box) return Promise.resolve(null);
    const token = String(++loadSeq);
    const had = box.hasAttribute('data-loaded');
    box.setAttribute('data-load', token);
    box.setAttribute('aria-busy', 'true');
    box.classList.toggle('is-refreshing', had);
    const current = () => box.getAttribute('data-load') === token && document.contains(box);
    const settle = () => { box.removeAttribute('aria-busy'); box.classList.remove('is-refreshing'); };
    const info = (e) => { try { return onError(e) || {}; } catch (x) { return {}; } };
    const timer = setTimeout(() => {
      if (!current() || !box.hasAttribute('aria-busy')) return;
      settle();
      const i = info({ code: 'timeout' });
      if (had) staleNote(box, 'This is slow right now. You are seeing the last numbers we had.', i.retry);
      else box.innerHTML = UI.ErrorState({ icon: 'clock', title: 'This is taking a while.', text: 'Your internet may be slow, or one of your accounts is not answering. The rest of the page works. Try again in a minute.', retry: i.retry });
    }, SLOW_MS);
    let result;
    try {
      result = Promise.resolve(fetch());
    } catch (e) {
      result = Promise.reject(e);
    }
    return result
      .then((d) => {
        clearTimeout(timer);
        if (!current()) return null;
        box.innerHTML = draw(d);
        box.setAttribute('data-loaded', '');
        settle();
        return d;
      })
      .catch((e) => {
        clearTimeout(timer);
        if (!current()) return null;
        if (root.console) console.warn('[portal] section failed', sel, e);
        settle();
        const i = info(e);
        if (had) staleNote(box, "We couldn't update this. You are seeing the last numbers we had.", i.retry);
        else box.innerHTML = UI.ErrorState(i);
        return null;
      });
  }
  /** A small note above content that could not be refreshed: the old figures stay readable. */
  function staleNote(box, text, retry) {
    const old = box.querySelector(':scope > .stale-note');
    if (old) old.remove();
    box.insertAdjacentHTML('afterbegin', `<p class="stale-note" role="status">${icon('clock')}<span>${esc(text)}</span>${retry ? `<button class="btn-text" type="button" data-action="retry" data-section="${esc(retry)}">${icon('refresh')}Try again</button>` : ''}</p>`);
  }
  const markSrc = () => { const m = document.getElementById('brand-mark'); return m ? m.getAttribute('src') || '' : ''; };
  const refreshButton = () => `<button class="btn btn-glass btn-sm" type="button" data-action="refresh" title="Asks your connected apps for their newest numbers.">${icon('refresh')}Check for new numbers</button>`;
  const day = UI.day;
  const span = UI.span;
  const label = UI.metricLabel;
  const replyLine = UI.replyLine;
  const setText = (scope, sel, text) => { const el = scope.querySelector(sel); if (el) el.textContent = text; };

  /* ================================================================ HOME */

  /* Home, as simple as it can be (2026-10-09 complexity review): the greeting and one sentence, what is
     waiting for the client, three numbers from the last 30 days, one row per service, and how to reach us.
     The biggest change moved into the Results summary, the latest update lives under Work > Done, the plan
     on Billing and the connected accounts in Settings. */

  /** The grey line under the numbers: when they were last checked against their sources. */
  function checkedText(a, now) {
    return a.updatedAt ? `Checked ${esc(F.when(a.updatedAt, now))}.` : 'Not checked yet.';
  }
  /* (the same line on every page that says when it last looked: the restaurant's own clock) */
  function checkedLine(a, now) {
    return `<p class="meta home-checked"><span id="home-checked">${checkedText(a, now)}</span> <a class="link" href="#/results">See all results</a></p>`;
  }

  /** Next meeting and Message us, in one quiet strip at the bottom of Home. */
  function contactStrip(a, now) {
    const m = a.meeting;
    // A cancelled or past meeting is "none booked"; a date without a time shows no "at 00:00".
    const live = m && m.at && (!m.status || m.status === 'confirmed') && D8.time.dayNum(m.at) >= D8.time.dayNum(now);
    const timed = live && /[T ]\d\d:\d\d/.test(String(m.at));
    const when = live ? `${day(m.at)}${timed ? ` at ${F.time(m.at)}` : ''}` : 'none booked';
    return `<section class="card contact-strip" aria-label="Talk to us">
      <p class="contact-meet">${icon('calendar')}<span>Next meeting: ${esc(when)}</span></p>
      <a class="btn btn-glass btn-sm" href="#/messages">${icon('message')}Message us</a>
    </section>`;
  }

  /** "Next planned" and "Latest win", as a quiet line under the calm banner. @param {any} h */
  function calmFacts(h) {
    if (!h || (!h.next && !h.win)) return '';
    const svcName = (/** @type {string} */ id) => (SVC()[id] ? SVC()[id].label : '');
    const bits = [];
    if (h.next) bits.push(`<span><strong>Next planned:</strong> ${esc(h.next.title)}, ${esc(F.date(h.next.date))}${svcName(h.next.service) ? ` (${esc(svcName(h.next.service))})` : ''}</span>`);
    if (h.win) bits.push(`<span><strong>Latest win:</strong> ${esc(h.win.text)}, ${esc(day(h.win.date))}${svcName(h.win.service) ? ` (${esc(svcName(h.win.service))})` : ''}</span>`);
    return `<p class="pb-facts">${bits.join('')}</p>`;
  }

  /* Home, narrowed (2026-10-16, Karan: "the first screen must feel light, not like work"). By default it shows three
     things only: what is waiting for the client (approve on the card, or ask for changes), this week against last week
     in plain words with up to three numbers, and one next step. The plan, the 30-day numbers and the meeting strip fold
     under "More about your plan" and load only when it is opened. */

  /** The short word for a number on Home's "This week" ([one, many]); anything else uses its own unit. */
  const WEEK_WORD = {
    calls: ['call', 'calls'], directions: ['direction request', 'directions'], bookings: ['booking', 'bookings'], orders: ['order', 'orders'],
    visits: ['website visit', 'website visits'], facebookViews: ['Facebook view', 'Facebook views'], instagramViews: ['Instagram view', 'Instagram views'],
    adClicks: ['ad click', 'ad clicks'], profileViews: ['Google profile view', 'Google profile views'], leads: ['lead from ads', 'leads from ads']
  };
  /** @param {any} n one weekly number @param {number} v */
  const weekWord = (n, v) => { const w = /** @type {any} */ (WEEK_WORD)[n.id]; return w ? F.plural(v, w[0], w[1]) : String(n.unit || ''); };
  const hasNum = (/** @type {any} */ v) => v !== null && v !== undefined;

  /**
   * "Last week" (the last full Monday to Sunday, or the last 7 days in the demo): one sentence, up to three numbers with
   * the week before beside them, and what staff recorded. The lead moves only on a real change: the average change of the
   * numbers that can be compared, 10 percent either way, so one call less never reads as a quiet week. @param {any} wk
   */
  function weekBlock(wk) {
    if (!wk || !wk.numbers || !wk.numbers.length) {
      return UI.EmptyState({ icon: 'results', title: 'No weekly numbers yet.', text: 'Calls, directions and bookings show here, next to the week before, once we have checked them.' });
    }
    const nums = wk.numbers;
    const compared = nums.filter((/** @type {any} */ n) => hasNum(n.before));
    const moves = compared.filter((/** @type {any} */ n) => n.before > 0).map((/** @type {any} */ n) => (n.now - n.before) / n.before);
    const avg = moves.length ? moves.reduce((/** @type {number} */ a, /** @type {number} */ b) => a + b, 0) / moves.length : 0;
    const lead = !compared.length ? 'Your first week of checked numbers.' : avg >= 0.1 ? 'Busier than the week before.' : avg <= -0.1 ? 'Quieter than the week before.' : 'About the same as the week before.';
    const said = (/** @type {'now'|'before'} */ k) => nums.filter((/** @type {any} */ n) => hasNum(n[k])).map((/** @type {any} */ n) => `${F.num(n[k])} ${weekWord(n, n[k])}`).join(', ');
    const extras = (wk.extras || []).filter((/** @type {any} */ x) => x && x.label).map((/** @type {any} */ x) => `${x.label}: ${x.value}.`).join(' ');
    const line = `Last week: ${said('now')}.${compared.length ? ` The week before: ${said('before')}.` : ''}`;
    const cells = nums.map((/** @type {any} */ n) => {
      const had = hasNum(n.before);
      const dir = !had ? '' : n.now > n.before ? 'up' : n.now < n.before ? 'down' : 'flat';
      return `<li class="wn${dir ? ' is-' + dir : ''}"><span class="wn-val">${esc(F.num(n.now))}</span><span class="wn-word">${esc(weekWord(n, n.now))}</span>${had ? `<span class="wn-was">${esc(F.num(n.before))} the week before</span>` : ''}</li>`;
    }).join('');
    return `<div class="card week-card" data-week="${esc(wk.id || '')}">
      <p class="week-lead">${esc(lead)}</p>
      <p class="sr-only">${esc(line)}</p>
      <ul class="week-nums" aria-hidden="true">${cells}</ul>
      ${extras ? `<p class="week-extras">${esc(extras)}</p>` : ''}
      <p class="meta week-meta">${wk.from && wk.to ? `${esc(F.range(wk.from, wk.to))}. ` : ''}<a class="link" href="#/results">See all results</a></p>
    </div>`;
  }

  /**
   * One next step, picked by a fixed order: answer what is waiting, read our reply, the meeting this week, otherwise
   * how to ask for something. Always one sentence and one button.
   * A client who has never answered anything gets their first real job instead, while one waits: the first card.
   * @param {number} waiting @param {number} unread @param {any} a the account @param {Date} now @param {boolean} [first]
   */
  function nextStep(waiting, unread, a, now, first) {
    const m = a.meeting;
    const gap = m && m.at ? D8.time.dayNum(m.at) - D8.time.dayNum(now) : -1;
    const soon = m && m.at && (!m.status || m.status === 'confirmed') && gap >= 0 && gap <= 7;
    const timed = soon && /[T ]\d\d:\d\d/.test(String(m.at));
    /** @type {string[]} icon, words, button */
    let s;
    if (first && waiting > 0) s = ['check', 'Your first job here: the card at the top. One tap to approve, or tell us what to change. That is how all the work comes to you from now on.', '<button class="btn btn-tint btn-sm" type="button" data-action="go-first">Start with it</button>'];
    else if (waiting > 0) s = ['check', waiting === 1 ? 'Answer the one thing above and you are done for now.' : `Answer the ${waiting} things above. It takes about a minute.`, '<button class="btn btn-tint btn-sm" type="button" data-action="go-first">Start with the first</button>'];
    else if (unread > 0) s = ['message', unread === 1 ? 'We replied to your message.' : `We sent you ${unread} replies.`, `<a class="btn btn-tint btn-sm" href="#/messages">Read ${unread === 1 ? 'it' : 'them'}</a>`];
    else if (soon) s = ['calendar', `Our next meeting is ${day(m.at)}${timed ? ` at ${F.time(m.at)}` : ''}. Anything to add first?`, '<a class="btn btn-glass btn-sm" href="#/messages">Message us</a>'];
    // the request form itself (new hours go in as an urgent fix that never counts toward the plan)
    else s = ['message', 'Nothing needed from you. New hours, a special or a change? Tell us here and we do it.', '<button class="btn btn-glass btn-sm" type="button" data-action="compose" data-mode="request">Ask for something</button>'];
    return `<div class="card next-card"><span class="next-icon">${icon(s[0])}</span><p class="next-text">${esc(s[1])}</p>${s[2]}</div>`;
  }

  /** "Approved lately": what they approved and where it stands, for a week. @param {any[]} list @param {Date} now */
  function doneBlock(list, now) {
    if (!list || !list.length) return '';
    return `<ul class="done-list">${list.map((/** @type {any} */ x) => `<li class="done-item is-${x.stage === 'done' ? 'done' : 'doing'}">
      <span class="done-icon">${icon(x.stage === 'done' ? 'check' : 'progress')}</span>
      <div class="done-main"><p class="done-title">${esc(x.title.replace(/^(approve|confirm|review)\s*:?\s+/i, ''))}</p><p class="done-text">${esc(x.text)}</p></div>
      <span class="meta done-when">${esc(F.when(x.at, now))}</span></li>`).join('')}</ul>`;
  }

  /** The Undo window after Approve on a card, before the answer is saved. */
  const HOLD_MS = 8000;

  const home = {
    title: () => 'Home',
    /** #/home?more=open opens "More about your plan" (a link from an email or another page can land there). */
    render(ctx, r) {
      const now = ctx.client.now();
      const a = ctx.account;
      return `<div class="page page-home is-narrow">
        ${UI.PageHeader({ cls: 'is-home', title: `${F.greeting(now)}, ${a.user.firstName}.`, intro: '<span id="home-summary">Checking your account.</span>', introHtml: true, sample: a.business.name })}
        ${UI.PageFresh({ updatedAt: a.updatedAt || D8.time.isoTime(now), source: 'Domin8te console', zone: a.zoneAbbr, status: a.problems && a.problems.length ? 'delayed' : 'ok', label: a.problems && a.problems.length ? `${a.problems.length} ${F.plural(a.problems.length, 'account needs', 'accounts need')} a look` : '' })}
        <p class="sr-only" id="home-live" role="status" aria-live="polite"></p>
        <section class="sec sec-attention" aria-labelledby="h-attention">
          ${UI.SectionHead('h-attention', 'Waiting for you')}
          <div id="home-attention">${UI.Skeleton('row', 2)}</div>
        </section>
        <section class="sec sec-done" aria-labelledby="h-done" hidden>
          ${UI.SectionHead('h-done', 'Approved lately')}
          <div id="home-done"></div>
        </section>
        <section class="sec sec-week" aria-labelledby="h-week">
          ${UI.SectionHead('h-week', 'Last week')}
          <div id="home-week">${UI.Skeleton('card', 1)}</div>
        </section>
        <section class="sec sec-next" aria-labelledby="h-next">
          ${UI.SectionHead('h-next', 'Your next step')}
          <div id="home-next">${UI.Skeleton('row', 1)}</div>
        </section>
        <details class="home-more" id="home-more"${r && r.params && r.params.more === 'open' ? ' open' : ''}>
          <summary class="home-more-sum"><span class="hm-title">More about your plan</span><span class="hm-sub">This month, the last 30 days and your next meeting</span>${icon('chevron-down', 'hm-chev')}</summary>
          <div class="home-more-body">
            <div class="sec home-plan" id="home-plan">${UI.Skeleton('card', 2)}</div>
            <section class="sec sec-strip" aria-labelledby="h-strip">
              ${UI.SectionHead('h-strip', 'Last 30 days')}
              <div id="home-strip">${UI.Skeleton('strip', 3)}</div>
              ${checkedLine(a, now)}
            </section>
            ${contactStrip(a, now)}
          </div>
        </details>
      </div>`;
    },
    mount(ctx, r, el) {
      const now = () => ctx.client.now();
      /** @type {number|null} */ let count = null;
      /** What staff wrote for one part of Home, when they made it visible. @param {string} k */
      const staffSection = (k) => (ctx.account.homeSections || []).find((/** @type {any} */ s) => s.section === k) || null;
      /** First week: the header says what this page is for, once, until their first answer. */
      let firstTime = false;
      /** What still waits: an answer in its Undo window no longer counts. */
      const waitingNow = () => Math.max((count || 0) - held.size, 0);
      const summary = () => {
        if (count === null) return;
        const n = waitingNow();
        const said = count < 0 ? 'We could not check what is waiting for you just now.' : n ? `${n} ${F.plural(n, 'thing needs', 'things need')} you.` : 'Nothing needs you right now.';
        setText(el, '#home-summary', firstTime && n > 0 ? `Welcome to your dashboard. Approvals, updates and your numbers all come here. ${said}` : said);
      };
      const live = (/** @type {string} */ t) => setText(el, '#home-live', t);
      const setFirst = (/** @type {boolean} */ f) => { if (f !== firstTime) { firstTime = f; summary(); } };
      const more = /** @type {HTMLDetailsElement|null} */ (el.querySelector('#home-more'));
      const moreOpen = () => !!(more && more.open);
      /** @type {Record<string, () => any>} */
      const loaders = {
        attention: () => section(el, '#home-attention', () => Promise.all([ctx.client.getAttention(), ctx.client.getPlan().catch(() => null)])
          .then(([items, plan]) => (items.length ? { items, plan, highlights: null } : ctx.client.getHighlights().catch(() => null).then((h) => ({ items, plan, highlights: h })))), (d) => {
          count = d.items.length;
          summary();
          ctx.setBadges(d.items);
          loaders.next();
          const ok = d.plan && d.plan.state === 'ok';
          const sec = el.querySelector('.sec-attention');
          if (sec) sec.classList.toggle('is-calm', !count && !!ok);
          if (count) return UI.ActionNeededList(d.items, now());
          return ok ? D8.plan.banner(d.plan, { staff: staffSection('nothing_to_do'), facts: calmFacts(d.highlights) }) : UI.CaughtUp(d.highlights);
        }, () => { count = -1; summary(); loaders.next(); return { title: "We couldn't load what is waiting for you.", text: 'Nothing is lost. The rest of this page works.', retry: 'attention' }; }),
        // Shown is seen: the first time a summary is drawn, the server learns the client opened it (live only).
        // Shown only when something was approved or finished this week; otherwise the section stays hidden.
        done: () => section(el, '#home-done', () => ctx.client.getRecentDone(), (list) => {
          const sec = /** @type {HTMLElement|null} */ (el.querySelector('.sec-done'));
          if (sec) sec.hidden = !list || !list.length;
          return doneBlock(list, now());
        }, () => { const sec = /** @type {HTMLElement|null} */ (el.querySelector('.sec-done')); if (sec) sec.hidden = true; return { title: '', text: '' }; }),
        week: () => section(el, '#home-week', () => ctx.client.getWeekly(), (wk) => {
          if (wk && wk.id) setTimeout(() => watchSeen(wk.id), 0);
          return weekBlock(wk);
        },
          () => ({ title: "We couldn't load this week's numbers.", text: 'The rest of this page works.', retry: 'week' })),
        // Waits for the attention count; the unread replies are a best effort (no reply count is not an error).
        next: () => {
          if (count === null) return Promise.resolve(null);
          return section(el, '#home-next', () => Promise.all([ctx.client.getUnreadReplies().catch(() => 0), ctx.client.getFirstWeek().catch(() => ({ first: false }))]),
            ([n, fw]) => {
              const first = !!(fw && fw.first);
              setFirst(first);
              return nextStep(waitingNow(), Number(n) || 0, ctx.account, now(), first);
            },
            () => ({ title: "We couldn't work out your next step.", text: 'The rest of this page works.', retry: 'next' }));
        },
        strip: () => (moreOpen() ? section(el, '#home-strip', () => ctx.client.getStrip(30), (d) => {
          const verified = d.mode === 'verified';
          const head = el.querySelector('#h-strip');
          if (head) head.textContent = verified ? 'Latest checked numbers' : 'Last 30 days';
          const list = d.items.filter((/** @type {any} */ x) => x.state !== 'pending' || !verified).slice(0, 3);
          if (!list.length) return UI.EmptyState({ icon: 'results', title: 'No checked numbers yet.', text: 'They show here once we have checked them against your accounts.' });
          return `<div class="strip is-3">${list.map((/** @type {any} */ t) => UI.ResultTile(t, now(), { compact: true, delta: !verified, days: 30 })).join('')}</div>`;
        }, () => ({ title: "We couldn't load your numbers.", text: 'The rest of this page works.', retry: 'strip' })) : Promise.resolve(null)),
        // The plan this month, what is used, and what comes next.
        plan: () => (moreOpen() ? section(el, '#home-plan', () => Promise.all([ctx.client.getPlan(), ctx.client.getWorkSummary(), ctx.client.getAttention().catch(() => [])]), ([m, list, acts]) => {
          if (m.state !== 'ok') return D8.plan.notSetUp(m);
          const changing = m.confirmed && m.changes.differs;
          const note = staffSection('note');
          return `<div class="home-cols">${D8.plan.runningNow(m, { summary: list, actions: acts, staff: staffSection('running_now') })}${changing ? D8.plan.whatChanges(m, staffSection('next_month')) : D8.plan.comingUp(m, staffSection('next_month'), ctx.account.user.email)}</div>${note && D8.plan.staffNote(note) ? `<section class="card home-note" aria-label="A note from Domin8te">${D8.plan.staffNote(note)}</section>` : ''}`;
        }, () => ({ title: "We couldn't load your plan.", text: 'The rest of this page works.', retry: 'plan' })) : Promise.resolve(null))
      };
      /**
       * Opened means read: the summary counts as opened once at least half of it has been on screen for a second
       * (live only; the data layer never writes in the demo or view-as, and tells the server once).
       * @param {string} id
       */
      let seenWatch = /** @type {IntersectionObserver|null} */ (null);
      const watchSeen = (id) => {
        const card = el.querySelector('#home-week .week-card');
        if (!card || !ctx.client.markWeeklySeen) return;
        if (seenWatch) seenWatch.disconnect();
        if (typeof IntersectionObserver !== 'function') return;
        /** @type {any} */ let t = null;
        seenWatch = new IntersectionObserver((list) => {
          const on = list.some((e) => e.isIntersecting && e.intersectionRatio >= 0.5);
          clearTimeout(t);
          if (on) t = setTimeout(() => { if (seenWatch) seenWatch.disconnect(); ctx.client.markWeeklySeen(id).catch(() => {}); }, 1000);
        }, { threshold: [0, 0.5, 1] });
        seenWatch.observe(card);
      };
      // The folded part loads the first time it opens, and again on every refresh while it is open.
      let moreLoaded = moreOpen();
      if (moreLoaded) { loaders.plan(); loaders.strip(); }
      if (more) more.addEventListener('toggle', () => { if (more.open && !moreLoaded) { moreLoaded = true; loaders.plan(); loaders.strip(); } });
      loaders.attention();
      loaders.done();
      loaders.week();

      /* ---- approve on the card: Approve, a short Undo window, then saved ---------------------------------------- */
      /** @type {Map<string, {timer: any, li: HTMLElement, html: string, title: string, at: number}>} */
      const held = new Map();
      const cardFor = (/** @type {string} */ id) => /** @type {HTMLElement|null} */ ([...el.querySelectorAll('.act-card[data-approval]')].find((c) => c.getAttribute('data-approval') === id) || null);
      /** @param {HTMLElement} li @param {string} title @param {string} text @param {string} btn */
      const cardState = (li, title, text, btn) => {
        li.innerHTML = `<span class="act-icon">${icon('check')}</span><div class="act-main"><h3 class="act-title">${esc(title)}</h3><p class="act-detail">${esc(text)}</p></div>${btn ? `<div class="act-do">${btn}</div>` : ''}`;
      };
      /** @param {string} id */
      const restore = (id) => {
        const h = held.get(id);
        if (!h) return null;
        clearTimeout(h.timer);
        held.delete(id);
        h.li.classList.remove('is-held');
        h.li.innerHTML = h.html;
        return h;
      };
      /** The card's heading takes focus after each change, so focus never falls back to the top of the page. @param {HTMLElement} li */
      const focusCard = (li) => { const t = /** @type {HTMLElement|null} */ (li.querySelector('.act-title')); if (t && li.isConnected) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); } };
      /** Saves one held answer. Resolves when it is saved or put back. @param {string} id @returns {Promise<void>} */
      const commit = (id) => {
        const h = held.get(id);
        if (!h) return Promise.resolve();
        clearTimeout(h.timer);
        held.delete(id);
        cardState(h.li, `${h.title}: approved.`, 'Saving your answer.', '');
        const done = () => {
          h.li.classList.remove('is-held');
          h.li.classList.add('is-done');
          cardState(h.li, `${h.title}: approved.`, "Thanks. We'll take it from here.", '');
          focusCard(h.li);
          live(`${h.title}: approved and saved.`);
          if (count !== null && count > 0) { count -= 1; summary(); loaders.next(); }
          ctx.client.getAttention().then((/** @type {any[]} */ items) => ctx.setBadges(items)).catch(() => {});
          // a moment later the card leaves Waiting for you and shows under Approved lately, with what happens next
          setTimeout(() => { if (el.isConnected && !held.size) { loaders.attention(); loaders.done(); } }, 2500);
        };
        return D8.dialogs.slow(ctx.client.decide(id, 'approved', ''), 'Home').then(done).catch((/** @type {any} */ err) => {
          if (err && err.code === 'already-decided') { done(); return; }
          h.li.classList.remove('is-held');
          h.li.innerHTML = h.html;
          focusCard(h.li);
          const msg = err && err.code === 'slow' ? err.message : `We couldn't save your answer, so nothing changed. ${(err && err.message) || ''} Try again.`;
          live(msg);
          D8.dialogs.toast(msg, { tone: 'error' });
        });
      };
      /** Saves every held answer now. @returns {Promise<any>} */
      const flush = () => Promise.all([...held.keys()].map(commit));
      // Leaving the tab or the app saves at once, while the page can still send (pagehide is often too late on phones).
      const onHidden = () => { if (document.visibilityState === 'hidden') flush(); };
      document.addEventListener('visibilitychange', onHidden);
      root.addEventListener('pagehide', flush);

      return {
        refresh() {
          const c = el.querySelector('#home-checked');
          if (c) c.innerHTML = checkedText(ctx.account, now());
          // an answer still in its Undo window is saved first, and the page reads again only after it is saved
          flush().then(() => {
            if (!el.isConnected) return;
            loaders.attention();
            loaders.done();
            loaders.week();
            if (moreLoaded) { loaders.plan(); loaders.strip(); }
          });
        },
        /** @param {string} which */
        retry(which) {
          const f = loaders[which];
          if (!f) return;
          const box = /** @type {HTMLElement|null} */ (el.querySelector(/** @type {any} */ ({ strip: '#home-strip', attention: '#home-attention', plan: '#home-plan', week: '#home-week', next: '#home-next' })[which] || ''));
          // A section that never loaded goes back to its placeholder; one with content keeps it, dimmed.
          if (box && !box.hasAttribute('data-loaded')) box.innerHTML = UI.Skeleton(/** @type {any} */ ({ strip: 'strip', attention: 'row', plan: 'card', week: 'card', next: 'row' })[which] || 'block', which === 'strip' ? 3 : which === 'plan' ? 2 : 1);
          f();
        },
        /** @param {string} act @param {HTMLElement} t */
        action(act, t) {
          if (act === 'go-first') {
            const b = /** @type {HTMLElement|null} */ (el.querySelector('#home-attention .act-card .act-do .btn'));
            if (b) { b.scrollIntoView({ block: 'center', behavior: 'smooth' }); b.focus({ preventScroll: true }); }
            return;
          }
          const id = t.dataset.id || '';
          if (act === 'undo-approve') {
            const h0 = held.get(id);
            // a quick second tap on the same spot is not an Undo
            if (!h0 || Date.now() - h0.at < 600) return;
            const h = restore(id);
            if (!h) return;
            summary();
            loaders.next();
            focusCard(h.li);
            live(`${h.title}: not approved yet.`);
            return;
          }
          if (act !== 'quick-approve' || held.has(id)) return;
          if (D8.data.READ_ONLY || D8.data.viewAs) { D8.dialogs.toast(D8.data.DEMO_NOTE, { tone: 'error' }); return; }
          const li = cardFor(id);
          if (!li) return;
          // "Approve next week's posts" reads as "Next week's posts: approved."
          const raw = String((li.querySelector('.act-title') || {}).textContent || '').replace(/^(approve|confirm|review)\s+/i, '').trim();
          const title = raw ? raw[0].toUpperCase() + raw.slice(1) : 'This';
          held.set(id, { timer: setTimeout(() => commit(id), HOLD_MS), li, html: li.innerHTML, title, at: Date.now() });
          li.classList.add('is-held');
          cardState(li, `${title}: approved.`, `Saving in ${HOLD_MS / 1000} seconds. Changed your mind? Press Undo.`, `<button class="btn btn-glass" type="button" data-action="undo-approve" data-id="${esc(id)}">Undo<span class="sr-only">: ${esc(title)}</span></button>`);
          focusCard(li);
          live(`${title}: approved. Saving in ${HOLD_MS / 1000} seconds. The Undo button is on the card.`);
          summary();
          loaders.next();
        },
        /** Leaving Home saves any answer still in its Undo window. */
        leave() { flush(); root.removeEventListener('pagehide', flush); document.removeEventListener('visibilitychange', onHidden); if (seenWatch) seenWatch.disconnect(); }
      };
    }
  };

  /* ================================================================ WORK */

  /* The Work page, made simple (2026-10-08, Karan: "make it as simple as possible so that even a five year old can
     read and interpret it"; 2026-10-09 complexity review). Two tabs: Now (each service, what we are doing right now
     and its steps) and Done (the updates, at #/updates). Each service shows one "Right now" sentence and one list
     of steps: the team's board cards for that service when it has any, otherwise the steps typed on the console's
     Work tab (and older finished lines). What is left first; the done steps fold away. What the client has to do
     lives once, under Waiting for you on Home; a service only points there. */
  const STEP = {
    you: ['Waiting for you', 'alert'],
    now: ['Doing now', 'progress'],
    later: ['Coming up', 'clock'],
    hold: ['On hold', 'pause'],
    done: ['Done', 'check']
  };
  const STEP_ORDER = { you: 0, now: 1, later: 2, hold: 3 };
  /** Every step for one service, from its cards, milestones and finished work, without repeats. @param {any} s */
  function steps(s) {
    /** @type {{title: string, kind: string, date?: string}[]} */
    const out = [];
    const seen = new Set();
    const add = (/** @type {string} */ title, /** @type {string} */ kind, /** @type {string|undefined} */ date) => {
      const key = String(title || '').trim().toLowerCase();
      if (!key || seen.has(key)) return;
      seen.add(key);
      out.push({ title, kind, date });
    };
    const CARD = { in_review: 'you', in_progress: 'now', todo: 'later', blocked: 'hold', done: 'done' };
    if (s.cards && s.cards.length) {
      for (const c of s.cards) add(c.title, /** @type {any} */ (CARD)[c.status] || 'later', c.status === 'done' ? String(c.updatedAt || '').slice(0, 10) : c.due);
    } else {
      for (const m of s.milestones || []) add(m.title, m.needs ? 'you' : m.state === 'done' ? 'done' : m.state === 'current' ? 'now' : 'later', m.date);
      for (const c of s.completed || []) add(c.text, 'done', c.date);
    }
    const open = out.filter((x) => x.kind !== 'done')
      .sort((a, b) => /** @type {any} */ (STEP_ORDER)[a.kind] - /** @type {any} */ (STEP_ORDER)[b.kind] || String(a.date || '9999').localeCompare(String(b.date || '9999')));
    const done = out.filter((x) => x.kind === 'done').sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    return { open, done };
  }
  /** The steps: "N of M done", what is left, and the done ones behind "Show N done steps". One colour per row: the icon's. @param {any} s */
  function stepList(s) {
    const { open, done } = steps(s);
    const all = open.length + done.length;
    if (!all) return '';
    const row = (/** @type {any} */ x) => {
      const st = /** @type {any} */ (STEP)[x.kind];
      // The stage and its date on one line, as plain words: "Done, Fri 18 Sep", "Coming up, by Thu 1 Oct".
      const when = x.date ? (x.kind === 'done' ? day(x.date) : `by ${day(x.date)}`) : '';
      return `<li class="step is-${x.kind}"><span class="step-dot">${icon(st[1])}</span><p class="step-title">${esc(x.title)}</p><p class="step-tag">${st[0]}${when ? `, ${esc(when)}` : ''}</p></li>`;
    };
