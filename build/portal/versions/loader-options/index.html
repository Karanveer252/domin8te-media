html[data-theme=dark] { --bg:#101217; --ink:#F6F3EE; --ink-3:#A29E97; --line:rgba(255,255,255,.08); --surface:#1B1E26; --dots: radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1.4px); }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.5 "Schibsted Grotesk", system-ui, sans-serif; }
body::before { content:""; position:fixed; inset:0; z-index:-1; background:var(--dots) 0 0/23px 23px; }
.top { display:flex; gap:12px; align-items:center; padding:18px 28px; } .top h1 { font-size:18px; margin:0 auto 0 0 } .top button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); cursor:pointer }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); gap:18px; padding:0 28px 40px; }
.card { position:relative; min-height:330px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; border:1px solid var(--line); border-radius:22px; background:var(--surface); overflow:hidden; }
.card .n { position:absolute; top:14px; left:16px; font-weight:700; font-size:13px; color:var(--ink-3); letter-spacing:.04em } .card .t { position:absolute; top:14px; right:16px; font-size:13px; color:var(--ink-3) }
.word { color:var(--ink-3); font-size:15px; }
.mark { width:120px; height:66px; display:block; }

/* 1 Breathe: the mark eases in and out of scale with a soft warm glow; the words fade with it */
.l1 .mark { animation: breathe 1.8s ease-in-out infinite; filter: drop-shadow(0 6px 18px rgba(255,91,31,.18)); }
@keyframes breathe { 0%,100% { transform:scale(.94); opacity:.72 } 50% { transform:scale(1.04); opacity:1 } }
.l1 .word { animation: fadeword 1.8s ease-in-out infinite } @keyframes fadeword { 0%,100%{opacity:.55} 50%{opacity:1} }

/* 2 Trace: the logo lights up along its own figure-eight. The mark sits dimmed; a second copy of it shows only inside a
   soft spotlight that rides the loops, so the colour travels around the infinity like light along a track. */
.l2 .wrap { position:relative; width:150px; height:83px; }
.l2 .wrap img { position:absolute; inset:0; width:150px; height:83px; }
.l2 .dim { opacity:.5; filter:saturate(.5) brightness(1.05); }
html[data-theme=dark] .l2 .dim { opacity:.4; }
.l2 .lit { -webkit-mask: radial-gradient(circle 22px at var(--x) var(--y), #000 0 30%, rgba(0,0,0,.55) 60%, transparent 100%); mask: radial-gradient(circle 22px at var(--x) var(--y), #000 0 30%, rgba(0,0,0,.55) 60%, transparent 100%); filter: saturate(1.2) brightness(1.06) drop-shadow(0 0 6px rgba(255,255,255,.45)); animation: ride8 3s linear infinite; }
.l2 .tail { -webkit-mask: radial-gradient(circle 34px at var(--x) var(--y), rgba(0,0,0,.7) 0 15%, transparent 100%); mask: radial-gradient(circle 34px at var(--x) var(--y), rgba(0,0,0,.7) 0 15%, transparent 100%); animation: ride8 3s linear infinite; animation-delay:-.22s; }
.l2 .tail2 { -webkit-mask: radial-gradient(circle 40px at var(--x) var(--y), rgba(0,0,0,.35) 0 10%, transparent 100%); mask: radial-gradient(circle 40px at var(--x) var(--y), rgba(0,0,0,.35) 0 10%, transparent 100%); animation: ride8 3s linear infinite; animation-delay:-.44s; }

@property --y { syntax:'<length>'; inherits:false; initial-value:41px; }

/* 3 Light sweep: a soft light passes across the mark, like light on glass, with three quiet dots */
.l3 .wrap { position:relative; }
.l3 .wrap::after { content:""; position:absolute; inset:-10px; background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%); mix-blend-mode:screen; animation: sweep 1.5s ease-in-out infinite; }
html[data-theme=dark] .l3 .wrap::after { background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); }
@keyframes sweep { 0% { transform:translateX(-110%) } 60%,100% { transform:translateX(110%) } }
.l3 .dots i { display:inline-block; width:6px; height:6px; margin:0 3px; border-radius:50%; background:var(--ink-3); animation: dot 1.2s ease-in-out infinite } .l3 .dots i:nth-child(2){animation-delay:.15s} .l3 .dots i:nth-child(3){animation-delay:.3s}
@keyframes dot { 0%,80%,100%{opacity:.25; transform:translateY(0)} 40%{opacity:1; transform:translateY(-3px)} }

/* 4 Cards rising: three card shapes rise and settle, the way the real pages load, under a smaller mark */
.l4 .cards { display:grid; gap:8px; width:200px }
.l4 .cards i { display:block; height:22px; border-radius:8px; background:var(--bg); border:1px solid var(--line); animation: rise 1.5s cubic-bezier(.2,.7,.2,1) infinite; opacity:0 }
.l4 .cards i:nth-child(1){animation-delay:0s;width:100%} .l4 .cards i:nth-child(2){animation-delay:.15s;width:78%} .l4 .cards i:nth-child(3){animation-delay:.3s;width:56%}
@keyframes rise { 0%{opacity:0; transform:translateY(10px)} 25%,65%{opacity:1; transform:translateY(0)} 90%,100%{opacity:0; transform:translateY(-6px)} }
.l4 .mark { width:84px; height:46px }

/* 5 Orbit: a thin orange arc circles the mark, which stays steady in the middle */
.l5 .wrap { position:relative; width:150px; height:150px; display:grid; place-items:center }
.l5 .ring { position:absolute; inset:0; border-radius:50%; border:2px solid var(--line) }
.l5 .arc { position:absolute; inset:0; border-radius:50%; border:2px solid transparent; border-top-color:var(--accent); border-right-color:rgba(255,91,31,.35); animation: spin 1.1s cubic-bezier(.5,.15,.5,.85) infinite }
.l5 .mark { width:92px; height:50px }
@keyframes spin { to { transform:rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .card * { animation: none !important } }
