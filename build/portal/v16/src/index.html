<script>
  /* Before the first paint: the client's chosen theme (so a dark-mode client never sees a light
     flash), and no transitions until the app has started. */
  (function () {
    var d = document.documentElement;
    d.setAttribute('data-booting', '');
    try {
      var ns = (window.D8VARIANT && window.D8VARIANT.storage) || 'd8.v16';
      var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem(ns + '.theme');
      if (t === 'dark') d.setAttribute('data-theme', 'dark');
    } catch (e) { /* storage blocked: light */ }
  })();
</script>
