<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:bvp;font-weight:600;src:url(bvp-600.woff2) format('woff2')}
@font-face{font-family:bvp;font-weight:400;src:url(bvp-400.woff2) format('woff2')}
html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#F3E9DF}
.bg{position:absolute;inset:-60px;background:url(bg.png) center 22% / 118% auto no-repeat;filter:blur(9px) saturate(.9);transform:scale(1.02)}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse 62% 58% at 50% 50%,rgba(246,238,229,.9) 0%,rgba(246,238,229,.8) 55%,rgba(240,228,216,.7) 100%)}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:bvp,system-ui,sans-serif}
.mark{width:150px;height:auto;margin-bottom:34px}
h1{margin:0;font-weight:600;font-size:96px;line-height:1.02;letter-spacing:-.035em;color:#1E1B18}
h1 span{display:block;color:#FF5A1F}
p{margin:34px 0 0;font-weight:400;font-size:33px;letter-spacing:-.005em;color:#3F3A35}
</style></head><body><div class="bg"></div><div class="veil"></div>
<div class="card"><img class="mark" src="mark-720.webp" alt=""><h1>Your whole business.<span>One dashboard.</span></h1><p>Built for restaurants by Domin8te Media</p></div>
</body></html>
