<!doctype html>
<!-- The link-preview picture (og:image), 1200x630. Light, set A (Design Language PDF), 2026-10-22; the dark September one is og.html.bak-20261022-dark. Render with: node make-og.js -->
<html lang="en-CA"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@500;600&family=Archivo:ital,wght@1,700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; box-sizing: border-box; padding: 64px 76px;
    background-color: #FAF6F0;
    background-image: radial-gradient(rgba(94, 72, 50, 0.16) 1.4px, transparent 1.6px);
    background-size: 26px 26px;
    color: #1F2128; font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  /* a soft warm glow behind the mark so the card is not flat */
  body::before { content: ""; position: absolute; right: -140px; top: -160px; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(241, 92, 34, 0.10), rgba(241, 92, 34, 0)); }
  .brand { display: flex; align-items: center; gap: 16px; position: relative; }
  .brand img { width: 92px; height: auto; display: block; }
  .brand b { font: 700 30px/1 "Inter Tight", sans-serif; letter-spacing: -0.02em; }
  .brand b span { color: #6F6A64; font-weight: 600; }
  h1 { position: relative; margin: auto 0 0; max-width: 940px; font: 700 76px/1.02 "Inter Tight", sans-serif; letter-spacing: -0.035em; }
  h1 em { font-family: Archivo, "Inter Tight", sans-serif; font-style: italic; font-weight: 700; color: #F15C22; letter-spacing: -0.02em; }
  p { position: relative; margin: 22px 0 0; max-width: 820px; font: 500 27px/1.35 Inter, sans-serif; color: #3A3D45; }
  .foot { position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: 40px; padding-top: 22px; border-top: 1.5px solid #E7E0D5; }
  .url { font: 600 24px/1 "Inter Tight", sans-serif; letter-spacing: -0.01em; color: #1F2128; }
  .pill { font: 600 21px/1 Inter, sans-serif; color: #fff; background: #D4450A; padding: 15px 26px; border-radius: 999px; box-shadow: 0 8px 22px -10px rgba(181, 71, 14, 0.6); }
</style></head>
<body>
  <div class="brand"><img src="file:///C:/Work/domin8te-media/assets/mark-720.webp" alt=""><b>Domin8te <span>Media</span></b></div>
  <h1>Restaurant marketing that runs <em>while you cook.</em></h1>
  <p>Websites, Google, social posts and ads for independent restaurants and cafés.</p>
  <div class="foot"><span class="url">domin8temedia.com</span><span class="pill">Get your plan in one business day</span></div>
</body></html>
